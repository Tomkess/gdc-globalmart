<!doctype html>
<meta charset="utf-8">
<title>A2A federation — GlobalMart</title>
<!--
  Minimal on purpose. This stands where Portal Copilot stands, so it must not look like a
  product: it renders /ask's payload and nothing else. Anything shown here is something a
  host could show; anything missing is missing from the interface, not from this page.
  Charts are inline SVG from the visualization-data rows — no charting library, which is
  itself the useful data point about rendering a GoodData artifact elsewhere.
-->
<style>
  :root { --bg:#12141a; --fg:#e8eaf0; --dim:#8b93a7; --line:#262a35; --card:#191c24;
          --ok:#5fd68a; --bad:#ff7b72; --warn:#e3b341; --accent:#79b8ff; }
  * { box-sizing:border-box }
  body { margin:0; background:var(--bg); color:var(--fg); font:14px/1.5 -apple-system,Segoe UI,system-ui,sans-serif }
  header { padding:14px 20px; border-bottom:1px solid var(--line); display:flex; gap:12px; align-items:center }
  header h1 { font-size:14px; font-weight:600; margin:0; letter-spacing:.02em }
  header .ws { color:var(--dim); font-size:12px }
  main { max-width:1100px; margin:0 auto; padding:20px }
  form { display:flex; gap:8px; margin-bottom:16px }
  input[type=text] { flex:1; padding:10px 12px; background:var(--card); color:var(--fg);
                     border:1px solid var(--line); border-radius:6px; font-size:14px }
  button { padding:10px 16px; background:var(--accent); color:#0b1220; border:0;
           border-radius:6px; font-weight:600; cursor:pointer }
  button.ghost { background:transparent; color:var(--dim); border:1px solid var(--line) }
  button:disabled { opacity:.5; cursor:default }
  .card { background:var(--card); border:1px solid var(--line); border-radius:8px;
          padding:14px 16px; margin-bottom:12px }
  .card h2 { font-size:12px; text-transform:uppercase; letter-spacing:.08em; color:var(--dim);
             margin:0 0 8px }
  .row { display:flex; gap:10px; flex-wrap:wrap; align-items:baseline }
  .pill { font-size:11px; padding:2px 8px; border-radius:99px; border:1px solid var(--line);
          color:var(--dim) }
  .pill.ok { color:var(--ok); border-color:#245c3a }
  .pill.bad { color:var(--bad); border-color:#6b2b28 }
  .pill.warn { color:var(--warn); border-color:#6b5520 }
  .lane { border-top:1px solid var(--line); padding:12px 0 }
  .lane:first-of-type { border-top:0 }
  .lane .ws { font-weight:600; color:var(--accent) }
  .q { color:var(--dim); font-size:13px; margin:4px 0 }
  .txt { white-space:pre-wrap }
  .reply { font-size:15px; white-space:pre-wrap }
  .mono { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:12px; color:var(--dim) }
  table { border-collapse:collapse; font-size:12px; margin-top:6px }
  th,td { border:1px solid var(--line); padding:3px 8px; text-align:right }
  th { color:var(--dim); font-weight:500 }
  td:first-child, th:first-child { text-align:left }
  svg { display:block; margin-top:8px }
  .ax { stroke:var(--line) } .ln { fill:none; stroke:var(--accent); stroke-width:2 }
  .bar { fill:var(--accent) } .lbl { fill:var(--dim); font-size:10px }
  .err { color:var(--bad) }
  .spin { color:var(--dim) }
</style>

<header>
  <h1>A2A federation</h1>
  <span class="ws" id="wslist">loading…</span>
</header>

<main>
  <form id="f">
    <input type="text" id="q" placeholder="Ask something that needs more than one workspace…" autocomplete="off">
    <button id="go">Ask</button>
    <button type="button" class="ghost" id="en" disabled title="Re-ask only the lanes that did not answer">Enrich</button>
  </form>
  <div id="out"></div>
</main>

<script>
const $ = s => document.querySelector(s);
const el = (t, c, x) => { const n = document.createElement(t); if (c) n.className = c;
                          if (x !== undefined) n.textContent = x; return n; };

fetch('/registry').then(r => r.json()).then(d => {
  $('#wslist').textContent = d.workspaces.map(w => w.id).join('  ·  ');
});

let busy = false;
function setBusy(b) { busy = b; $('#go').disabled = b; $('#q').disabled = b; }

$('#f').addEventListener('submit', e => { e.preventDefault(); send('/ask', {question: $('#q').value}); });
$('#en').addEventListener('click', () => send('/enrich', {}));

function send(route, body) {
  if (busy) return;
  setBusy(true);
  const out = $('#out');
  out.prepend(waiting(route === '/enrich' ? 'retrying the missing lanes…' : 'planning, then asking the workspaces…'));
  fetch(route, {method:'POST', headers:{'Content-Type':'application/json'},
                body: JSON.stringify(Object.assign({session:'demo'}, body))})
    .then(r => r.json())
    .then(d => { out.firstChild.remove(); if (d.error) out.prepend(errorCard(d.error)); else render(d, out); })
    .catch(e => { out.firstChild.remove(); out.prepend(errorCard(String(e))); })
    .finally(() => setBusy(false));
}

function waiting(msg) { const c = el('div','card'); c.append(el('div','spin', msg)); return c; }
function errorCard(msg) { const c = el('div','card'); c.append(el('div','err', msg)); return c; }

function render(d, out) {
  const wrap = el('div');

  // Routing: which workspaces, and the sub-question each was given. Decomposition is the
  // thing worth seeing — the lanes are not asked the user's question.
  const r = el('div','card');
  r.append(el('h2', null, 'Routing'));
  r.append(el('div','q', d.routing.reasoning || ''));
  d.routing.workspaces.forEach(w => {
    const row = el('div','lane');
    row.append(el('span','ws', w.id));
    row.append(el('div','q', '→ ' + w.question));
    if (w.why) row.append(el('div','mono', w.why));
    row.append(row.appendChild(el('div')));
    r.append(row);
  });
  r.append(el('div','mono', 'combine on: ' + (d.routing.combine_on || 'not combinable')));
  wrap.append(r);

  // The answer.
  const a = el('div','card');
  a.append(el('h2', null, d.combinable ? 'Merged answer' : 'Answers (not combined)'));
  a.append(el('div','reply', d.reply));
  if (d.provenance && d.provenance.rejected) {
    a.append(el('div','err', 'merge rejected: ' + d.provenance.rejected));
  }
  wrap.append(a);

  // Per lane: status, latency, what it was asked, what it returned, and its chart.
  const l = el('div','card');
  l.append(el('h2', null, 'Lanes'));
  d.lanes.forEach(ln => {
    const box = el('div','lane');
    const head = el('div','row');
    head.append(el('span','ws', ln.workspace));
    head.append(el('span', 'pill ' + (ln.ok ? (ln.returned_data ? 'ok' : 'warn') : 'bad'),
                   ln.ok ? (ln.returned_data ? 'answered' : 'no data') : 'failed'));
    head.append(el('span','pill', ln.latency_ms + ' ms'));
    if (ln.round_trips > 1) head.append(el('span','pill', ln.round_trips + ' round trips'));
    if (ln.grain) head.append(el('span','pill', 'by ' + ln.grain));
    if (ln.window) head.append(el('span','pill', ln.window));
    box.append(head);
    box.append(el('div','q', '→ ' + ln.question));
    if (ln.error) box.append(el('div','err', ln.error));
    if (ln.text) box.append(el('div','txt', ln.text));
    (ln.artifacts || []).forEach(art => {
      const node = chart(art);
      if (node) box.append(node);
    });
    l.append(box);
  });
  wrap.append(l);

  // Checks, so a refusal is explained rather than just delivered.
  const c = el('div','card');
  c.append(el('h2', null, 'Merge checks'));
  (d.checks || []).forEach(k => {
    const row = el('div','row');
    row.append(el('span','pill ' + (k.verdict === 'pass' ? 'ok' : k.verdict === 'fail' ? 'bad' : ''), k.verdict));
    row.append(el('span','mono', k.check));
    row.append(el('span','q', k.reason));
    c.append(row);
  });
  const t = d.timings, tk = d.tokens;
  c.append(el('div','mono',
    `total ${t.total_ms} ms · fan-out wall ${t.fanout_wall_ms} ms · slowest lane ${t.slowest_lane_ms} ms · orchestrator ${tk.in} in / ${tk.out} out`));
  wrap.append(c);

  $('#en').disabled = !d.lanes.some(ln => !ln.ok || !ln.returned_data);
  out.prepend(wrap);
}

// A GoodData visualization-data artifact, as a chart. Inline SVG, no library — which is the
// honest test of whether a host that is not GoodData's UI can render one of these.
function chart(art) {
  if (art.name !== 'visualization-data' || !art.data) return null;
  const rows = art.data.formattedRows || art.data.rows || [];
  if (!rows.length) return null;

  const first = rows[0];
  const keys = Array.isArray(first) ? first.map((_, i) => i) : Object.keys(first);
  if (keys.length < 2) return null;
  const labelKey = keys[0], valueKeys = keys.slice(1);

  const num = v => { const n = parseFloat(String(v).replace(/[, ]/g, '')); return isFinite(n) ? n : null; };
  const series = valueKeys.map(k => rows.map(r => num(Array.isArray(r) ? r[k] : r[k])));
  const flat = series.flat().filter(v => v !== null);
  if (!flat.length) return null;

  const W = 560, H = 160, P = 34;
  const lo = Math.min(0, ...flat), hi = Math.max(...flat) || 1;
  const x = i => P + (rows.length < 2 ? 0 : i * (W - P * 2) / (rows.length - 1));
  const y = v => H - P - ((v - lo) / (hi - lo || 1)) * (H - P * 2);

  const ns = 'http://www.w3.org/2000/svg';
  const svg = document.createElementNS(ns, 'svg');
  svg.setAttribute('viewBox', `0 0 ${W} ${H}`); svg.setAttribute('width', '100%');

  const axis = document.createElementNS(ns, 'path');
  axis.setAttribute('class', 'ax');
  axis.setAttribute('d', `M${P},${P - 6} L${P},${H - P} L${W - P},${H - P}`);
  svg.append(axis);

  series.forEach(values => {
    const points = values.map((v, i) => v === null ? null : `${x(i)},${y(v)}`).filter(Boolean);
    if (points.length < 2) {
      values.forEach((v, i) => {
        if (v === null) return;
        const bar = document.createElementNS(ns, 'rect');
        bar.setAttribute('class', 'bar'); bar.setAttribute('x', x(i) - 8);
        bar.setAttribute('y', y(v)); bar.setAttribute('width', 16);
        bar.setAttribute('height', Math.max(1, H - P - y(v)));
        svg.append(bar);
      });
      return;
    }
    const line = document.createElementNS(ns, 'path');
    line.setAttribute('class', 'ln'); line.setAttribute('d', 'M' + points.join(' L'));
    svg.append(line);
  });

  rows.forEach((r, i) => {
    if (rows.length > 12 && i % 2) return;
    const label = document.createElementNS(ns, 'text');
    label.setAttribute('class', 'lbl'); label.setAttribute('x', x(i));
    label.setAttribute('y', H - P + 14); label.setAttribute('text-anchor', 'middle');
    label.textContent = String(Array.isArray(r) ? r[labelKey] : r[labelKey]).slice(0, 10);
    svg.append(label);
  });
  [hi, lo].forEach(v => {
    const label = document.createElementNS(ns, 'text');
    label.setAttribute('class', 'lbl'); label.setAttribute('x', P - 6);
    label.setAttribute('y', y(v) + 3); label.setAttribute('text-anchor', 'end');
    label.textContent = v.toLocaleString();
    svg.append(label);
  });

  const box = el('div');
  box.append(el('div','mono', valueKeys.map(String).join(' · ')));
  box.append(svg);
  return box;
}
</script>
