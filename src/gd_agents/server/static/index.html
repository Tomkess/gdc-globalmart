<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GoodData A2A federation</title>
<!--
  This stands where Portal Copilot stands. It is not a product and is meant to be deleted:
  its only job is to make one turn watchable, so that everything on screen is something a
  host could also show and anything missing is missing from the payload, not from the CSS.

  Three things here are claims rather than decoration:

  * The charts come from the `visualization` artifact's own type and title, paired with the
    `visualization-data` artifact's rows by `visualizationId`. The agent already decided it
    was a line chart of Total Campaign Spend by month; guessing again from the rows would
    throw that away. Inline SVG, no charting library — which is the honest answer to "can a
    host that is not GoodData's UI render one of these".

  * The progress feed is the real one. `/ask/stream` narrates the orchestrator as it runs,
    so a 90-second turn shows the router's choice, each lane starting, each lane's round
    trips and each lane landing — out of order, which is how you can see the fan-out is
    concurrent rather than take the wall-clock number on trust.

  * A workspace that stops to ask a question gets that question put on screen, and the
    reply goes back to that one workspace on its own contextId. Auto-confirming is the
    orchestrator guessing on the user's behalf, and the toggle in the header is the
    difference.
-->
<style>
:root{
  --bg:#F4F6FC; --surf:#FFFFFF; --surf2:#FAFBFF; --bord:#DDE3F0; --bord2:#EDF0F8;
  --tx:#161B33; --tx2:#565F80; --tx3:#8B93AE;
  --brand:#4C34E0; --brand2:#EFEBFF; --brand3:#C9BDFF;
  --ok:#0E7C4A; --okbg:#ECFDF3; --okb:#9BE7BF;
  --bad:#B4232B; --badbg:#FEF1F2; --badb:#F5B8BC;
  --warn:#8A5300; --warnbg:#FFF8EA; --warnb:#F5C759;
  --r:10px;
  /* One colour per workspace. A four-lane answer is four different sources and the eye
     should be able to follow one of them through routing, lanes and charts. */
  --w0:#4C34E0; --w1:#0E8F8F; --w2:#C2410C; --w3:#B21E6B; --w4:#3F6212;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--tx);font:14px/1.6 'Segoe UI',system-ui,-apple-system,sans-serif;
  display:flex;flex-direction:column;min-height:100vh;-webkit-font-smoothing:antialiased}

/* ── header ─────────────────────────────────────────────────────────────── */
header{background:linear-gradient(95deg,#4C34E0,#7B4DFF 46%,#0E8F8F);color:#fff;
  padding:12px 22px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;
  box-shadow:0 1px 10px rgba(30,20,90,.18);position:sticky;top:0;z-index:5}
header .logo{font-weight:700;font-size:16px;letter-spacing:-.01em}
header .sub{font-size:13px;opacity:.86}
.tag{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
  background:rgba(255,255,255,.22);padding:3px 9px;border-radius:5px;border:1px solid rgba(255,255,255,.3)}
.hspace{margin-left:auto}
.hbtn{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.34);color:#fff;
  font:inherit;font-size:12px;padding:5px 11px;border-radius:6px;cursor:pointer}
.hbtn:hover{background:rgba(255,255,255,.3)}
.toggle{display:flex;align-items:center;gap:7px;font-size:12px;cursor:pointer;
  background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.3);
  padding:5px 11px;border-radius:6px}
.toggle input{accent-color:#fff;width:14px;height:14px;cursor:pointer}

/* ── workspace strip ────────────────────────────────────────────────────── */
.strip{background:var(--surf);border-bottom:1px solid var(--bord);padding:12px 22px;
  display:flex;gap:12px;overflow-x:auto}
.wscard{min-width:236px;flex:1;border:1px solid var(--bord);border-radius:var(--r);
  padding:10px 12px;background:var(--surf2);border-top:3px solid var(--c)}
.wscard .id{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;
  font-weight:600;color:var(--c)}
.wscard .desc{font-size:11.5px;color:var(--tx2);line-height:1.5;margin-top:4px;
  max-height:3.1em;overflow:hidden}
.wscard.open .desc{max-height:none}

/* ── layout ─────────────────────────────────────────────────────────────── */
main{flex:1;width:100%;max-width:1060px;margin:0 auto;padding:22px 20px 40px}
.card{background:var(--surf);border:1px solid var(--bord);border-radius:var(--r);
  padding:14px 16px;margin-bottom:14px;box-shadow:0 1px 2px rgba(22,27,51,.04)}
.card > h2{font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
  color:var(--tx3);margin-bottom:10px;display:flex;align-items:center;gap:8px}
.card > h2 .note{margin-left:auto;font-weight:400;letter-spacing:0;text-transform:none;
  font-size:11.5px;color:var(--tx3)}
.turn{margin-bottom:26px}
.you{background:var(--brand);color:#fff;border-radius:var(--r) var(--r) 3px var(--r);
  padding:10px 14px;font-size:14.5px;max-width:78%;margin:0 0 14px auto;width:fit-content;
  box-shadow:0 1px 4px rgba(76,52,224,.26)}

/* ── ask bar ────────────────────────────────────────────────────────────── */
.askbar{display:flex;gap:9px;align-items:flex-end;margin-bottom:14px}
textarea{flex:1;border:1px solid var(--bord);border-radius:var(--r);padding:11px 13px;
  font:inherit;font-size:14.5px;resize:none;min-height:44px;max-height:130px;outline:none;
  background:var(--surf);color:var(--tx)}
textarea:focus{border-color:var(--brand3);box-shadow:0 0 0 3px var(--brand2)}
.btn{background:var(--brand);color:#fff;border:0;border-radius:var(--r);padding:0 20px;
  height:44px;font:inherit;font-size:14.5px;font-weight:600;cursor:pointer}
.btn:hover:not(:disabled){background:#3A25B8}
.btn:disabled{background:var(--bord);color:var(--tx3);cursor:not-allowed}
.btn.ghost{background:var(--surf);color:var(--tx2);border:1px solid var(--bord);font-weight:500}
.btn.ghost:hover:not(:disabled){border-color:var(--brand3);color:var(--brand)}

/* ── prompt chips ───────────────────────────────────────────────────────── */
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{background:var(--surf);border:1px solid var(--bord);border-radius:99px;
  padding:6px 12px;font:inherit;font-size:12.5px;color:var(--tx2);cursor:pointer;text-align:left}
.chip:hover{border-color:var(--brand3);color:var(--brand);background:var(--brand2)}
.chip b{font-weight:600;color:var(--tx)}
.chipgroup{margin-bottom:12px}
.chiphead{font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
  color:var(--tx3);margin-bottom:7px}

/* ── pills ──────────────────────────────────────────────────────────────── */
.pills{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.pill{font-size:10.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;
  padding:2.5px 8px;border-radius:5px;background:#F0F2F9;color:var(--tx2);
  border:1px solid var(--bord2);white-space:nowrap}
.pill.ok{background:var(--okbg);color:var(--ok);border-color:var(--okb)}
.pill.bad{background:var(--badbg);color:var(--bad);border-color:var(--badb)}
.pill.warn{background:var(--warnbg);color:var(--warn);border-color:var(--warnb)}
.pill.brand{background:var(--brand2);color:var(--brand);border-color:var(--brand3)}
.pill.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;text-transform:none;
  letter-spacing:0;font-weight:500}

/* ── answer ─────────────────────────────────────────────────────────────── */
.answer{font-size:15.5px;line-height:1.72;white-space:pre-wrap}
.answer.refused{border-left:3px solid var(--warnb);padding-left:12px}
.q{color:var(--tx2);font-size:13px}
.sub{font-size:13.5px;color:var(--tx);background:var(--surf2);border:1px dashed var(--bord);
  border-radius:7px;padding:7px 10px;margin:5px 0}
.why{font-size:11.5px;color:var(--tx3);line-height:1.5}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11.5px;color:var(--tx3)}
.err{color:var(--bad);font-size:13px}

/* ── lanes ──────────────────────────────────────────────────────────────── */
.lane{border-top:1px solid var(--bord2);padding:13px 0 13px 12px;
  border-left:3px solid var(--c);margin-left:-15px;padding-left:13px}
.lane:first-of-type{border-top:0;padding-top:2px}
.lane .ws{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px;
  font-weight:600;color:var(--c)}
.lane .txt{font-size:13.5px;margin-top:6px;white-space:pre-wrap}

/* ── progress feed ──────────────────────────────────────────────────────── */
.feed{font-size:13px}
.frow{display:flex;gap:9px;align-items:baseline;padding:4px 0;border-top:1px dashed var(--bord2)}
.frow:first-child{border-top:0}
.fdot{width:8px;height:8px;border-radius:99px;background:var(--brand);flex-shrink:0;
  margin-top:7px}
.fdot.live{animation:pulse 1.1s ease-in-out infinite}
.fdot.ok{background:var(--ok)} .fdot.bad{background:var(--bad)} .fdot.warn{background:var(--warn)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
.fname{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;font-weight:600;
  min-width:172px;color:var(--c,var(--tx))}
.fdet{color:var(--tx2);font-size:12.5px;flex:1}
.fms{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;color:var(--tx3)}
.elapsed{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11.5px;color:var(--tx3)}

/* ── visualization ──────────────────────────────────────────────────────── */
.viz{margin-top:10px;border:1px solid var(--bord);border-radius:9px;overflow:hidden;
  background:var(--surf)}
.viz-head{padding:8px 12px;background:var(--surf2);border-bottom:1px solid var(--bord);
  display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.viz-title{font-size:13px;font-weight:600}
.viz-body{padding:12px;overflow-x:auto}
.viz-note{padding:0 12px 9px;font-size:11px;color:var(--tx3)}
.headline{font-size:30px;font-weight:700;letter-spacing:-.02em;color:var(--c)}
.headline small{display:block;font-size:12px;font-weight:500;color:var(--tx3);letter-spacing:0}
.vbars{display:flex;flex-direction:column;gap:6px}
.vbar{display:grid;grid-template-columns:minmax(76px,170px) 1fr auto;gap:10px;align-items:center;
  font-size:12.5px}
.vbar .lab{color:var(--tx2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vbar .track{background:#EFF1F8;border-radius:4px;height:17px;overflow:hidden}
/* display:block matters: width is ignored on a non-replaced inline box, so the fill would
   render as nothing while the track (a grid item, and so blockified) still showed. */
.vbar .fill{display:block;height:100%;border-radius:4px;min-width:2px;background:var(--c)}
.vbar .val{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11.5px;
  white-space:nowrap}
.vsvg{width:100%;height:auto;max-height:280px;display:block;overflow:visible}
.vsvg .ax{stroke:var(--bord);stroke-width:1}
.vsvg .gr{stroke:var(--bord2);stroke-width:1;stroke-dasharray:3 3}
.vsvg .tk{fill:var(--tx3);font-size:9.5px;font-family:ui-monospace,Menlo,monospace}
.vsvg .axt{fill:var(--tx3);font-size:10px;letter-spacing:.04em}
.vsvg .ln{fill:none;stroke:var(--c);stroke-width:2.2;stroke-linejoin:round;stroke-linecap:round}
.vsvg .ar{fill:var(--c);fill-opacity:.12}
.vsvg .pt{fill:var(--c);stroke:#fff;stroke-width:1.4}
.vtable{border-collapse:collapse;font-size:12.5px;width:100%}
.vtable th{text-align:left;font-size:10px;font-weight:700;letter-spacing:.06em;
  text-transform:uppercase;color:var(--tx3);padding:5px 12px 5px 0;
  border-bottom:1px solid var(--bord);white-space:nowrap}
.vtable td{padding:5px 12px 5px 0;border-bottom:1px solid var(--bord2)}
.vtable td.num{font-family:ui-monospace,Menlo,monospace;font-size:11.5px;text-align:right}
.vtable th.num{text-align:right}

/* ── clarification ──────────────────────────────────────────────────────── */
.ask{margin-top:12px;background:var(--warnbg);border:1px solid var(--warnb);border-radius:9px;
  padding:12px 13px}
.ask-head{font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
  color:var(--warn);margin-bottom:7px}
.ask-q{font-size:13.5px;line-height:1.6;white-space:pre-wrap;margin-bottom:9px}
.ask-form{display:flex;gap:8px}
.ask-form input{flex:1;border:1px solid var(--warnb);border-radius:7px;padding:8px 11px;
  font:inherit;font-size:13.5px;background:#fff;outline:none}
.ask-btn{background:var(--warn);color:#fff;border:0;border-radius:7px;padding:8px 14px;
  font:inherit;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap}
.ask-hint{font-size:11px;color:var(--warn);opacity:.8;margin-top:7px}
.ask-quick{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.ask-quick button{background:#fff;border:1px solid var(--warnb);color:var(--warn);
  border-radius:99px;padding:4px 11px;font:inherit;font-size:12px;cursor:pointer}

/* ── checks ─────────────────────────────────────────────────────────────── */
.check{display:grid;grid-template-columns:62px 168px 1fr;gap:9px;align-items:baseline;
  padding:4px 0;border-top:1px dashed var(--bord2);font-size:12.5px}
.check:first-of-type{border-top:0}
.check .name{font-family:ui-monospace,Menlo,monospace;font-size:11.5px;color:var(--tx)}
.check .reason{color:var(--tx2);font-size:12px}
.foot{margin-top:10px;padding-top:9px;border-top:1px solid var(--bord2)}
.raw{display:none;margin-top:10px;background:#141829;color:#C9D2EC;border-radius:8px;
  padding:12px;font-family:ui-monospace,Menlo,monospace;font-size:11px;white-space:pre;
  overflow:auto;max-height:340px}
.raw.open{display:block}
.link{background:none;border:0;color:var(--brand);font:inherit;font-size:11.5px;cursor:pointer;
  text-decoration:underline;text-underline-offset:2px;padding:0}
</style></head><body>

<header>
  <span class="logo">GoodData</span>
  <span class="tag">A2A</span>
  <span class="sub">multi-workspace federation</span>
  <span class="hspace"></span>
  <label class="toggle" title="A workspace agent can stop mid-task and ask a question. On: it reaches you. Off: the lane auto-confirms and says so.">
    <input type="checkbox" id="askme" checked> ask me when a workspace needs input
  </label>
  <button class="hbtn" id="reset" title="Forget the conversation — every lane starts cold again">new conversation</button>
</header>

<div class="strip" id="strip"></div>

<main>
  <div class="askbar">
    <textarea id="q" rows="1" placeholder="Ask something one workspace cannot answer alone…"
      onkeydown="key(event)" oninput="grow(this)"></textarea>
    <button class="btn" id="go">Ask</button>
    <button class="btn ghost" id="en" disabled title="Re-ask only the lanes that did not answer">Enrich</button>
  </div>
  <div id="out"></div>
  <div class="card" id="scriptcard"><h2>Demo script<span class="note">from config/questions.yaml</span></h2>
    <div id="chips"></div></div>
</main>

<script>
// ── state ────────────────────────────────────────────────────────────────────
let busy = false, session = 'demo', turnNo = 0;
const COLOURS = ['var(--w0)','var(--w1)','var(--w2)','var(--w3)','var(--w4)'];
const colourOf = {};           // workspace -> colour, stable across the whole session
function colour(ws) {
  if (!(ws in colourOf)) colourOf[ws] = COLOURS[Object.keys(colourOf).length % COLOURS.length];
  return colourOf[ws];
}

const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s)
  .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

// ── workspace strip and prompt chips ─────────────────────────────────────────
fetch('/registry').then(r => r.json()).then(d => {
  d.workspaces.forEach(w => colour(w.id));   // fix the colours in registry order
  $('#strip').innerHTML = d.workspaces.map(w => `
    <div class="wscard" style="--c:${colour(w.id)}" onclick="this.classList.toggle('open')"
         title="Click to read the full routing description">
      <div class="id">${esc(w.id)}</div>
      <div class="desc">${esc(w.description)}</div>
    </div>`).join('');
}).catch(() => { $('#strip').innerHTML = '<div class="q">registry unavailable</div>'; });

fetch('/questions').then(r => r.json()).then(d => {
  const one = (q) => `<button class="chip" title="${esc(q.shows || '')}"
      onclick="fill(${JSON.stringify(q.question).replace(/"/g,'&quot;')},${q.inject_failure ? JSON.stringify(q.inject_failure).replace(/"/g,'&quot;') : 'null'})"
    >${esc(q.question)}</button>`;
  const groups = {};
  (d.questions || []).forEach(q => { (groups[q.kind || 'other'] ||= []).push(q); });
  let html = Object.entries(groups).map(([kind, qs]) => `
    <div class="chipgroup"><div class="chiphead">${esc(kind.replace(/-/g,' '))}</div>
      <div class="chips">${qs.map(one).join('')}</div></div>`).join('');
  if ((d.conversations || []).length) {
    html += `<div class="chipgroup"><div class="chiphead">conversations — ask these in order</div>
      <div class="chips">${d.conversations.map(c => c.turns.map((t, i) =>
        `<button class="chip" title="${esc(c.shows)}" onclick="fill(${
          JSON.stringify(t.question).replace(/"/g,'&quot;')},${
          t.inject_failure ? JSON.stringify(t.inject_failure).replace(/"/g,'&quot;') : 'null'})"
        ><b>${esc(c.id)} ${i + 1}.</b> ${esc(t.question)}</button>`).join('')).join('')}</div></div>`;
  }
  $('#chips').innerHTML = html || '<div class="q">no script loaded</div>';
}).catch(() => { $('#scriptcard').remove(); });

function fill(text, injectFailure) {
  $('#q').value = text;
  pendingFailure = injectFailure || null;
  grow($('#q'));
  send('/ask', {question: text, inject_failure: pendingFailure});
}
let pendingFailure = null;

// ── input ────────────────────────────────────────────────────────────────────
function grow(el) { el.style.height = 'auto'; el.style.height = Math.min(el.scrollHeight, 130) + 'px'; }
function key(e) { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); $('#go').click(); } }
$('#go').onclick = () => {
  const text = $('#q').value.trim();
  if (text) send('/ask', {question: text, inject_failure: pendingFailure});
};
$('#en').onclick = () => send('/enrich', {});
// A new session key, not a reset of the old one: every lane's contextId is dropped, so each
// workspace starts cold. Workspace colours are deliberately kept — they are a property of
// the registry, not of the thread.
$('#reset').onclick = () => {
  session = 'demo-' + Date.now();
  $('#out').innerHTML = '';
  $('#en').disabled = true;
};
function setBusy(b) {
  busy = b;
  $('#go').disabled = b; $('#q').disabled = b;
  $('#go').textContent = b ? 'Asking…' : 'Ask';
  if (b) $('#en').disabled = true;
}

// ── one turn, streamed ───────────────────────────────────────────────────────
// The last event carries exactly the payload the blocking /ask would have returned, so the
// narration above it is additive and never the source of what is finally shown.
function send(route, body) {
  if (busy) return;
  setBusy(true);
  pendingFailure = null;
  const turn = newTurn(body.question || (route === '/enrich' ? 'Retry the lanes that did not answer.'
                                                            : body.text));
  const feed = turn.querySelector('.feed');
  const started = Date.now();
  const tick = setInterval(() => {
    const t = turn.querySelector('.elapsed');
    if (t) t.textContent = ((Date.now() - started) / 1000).toFixed(1) + 's elapsed';
  }, 100);

  fetch(route + '/stream', {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify(Object.assign({session, ask_me: $('#askme').checked}, body)),
  }).then(response => {
    const reader = response.body.getReader(), decoder = new TextDecoder();
    let buffer = '';
    const pump = () => reader.read().then(({done, value}) => {
      if (done) return;
      buffer += decoder.decode(value, {stream: true});
      const lines = buffer.split('\n');
      buffer = lines.pop();
      lines.filter(Boolean).forEach(line => {
        let event; try { event = JSON.parse(line); } catch { return; }
        handle(event, turn, feed);
      });
      return pump();
    });
    return pump();
  }).catch(error => {
    feed.insertAdjacentHTML('beforeend', frow('bad', 'transport', String(error)));
  }).finally(() => {
    clearInterval(tick);
    setBusy(false);
  });
}

function newTurn(question) {
  turnNo += 1;
  const turn = document.createElement('div');
  turn.className = 'turn';
  turn.id = 't' + turnNo;
  turn.innerHTML = `
    ${question ? `<div class="you">${esc(question)}</div>` : ''}
    <div class="card"><h2>What the orchestrator is doing<span class="note elapsed">0.0s elapsed</span></h2>
      <div class="feed"></div></div>
    <div class="result"></div>`;
  $('#out').prepend(turn);
  return turn;
}

function frow(state, name, detail, ms) {
  return `<div class="frow"><span class="fdot ${state}"></span>
    <span class="fname" style="--c:${name.startsWith('globalmart') ? colour(name) : 'var(--tx)'}">${esc(name)}</span>
    <span class="fdet">${esc(detail)}</span>
    ${ms != null ? `<span class="fms">${ms} ms</span>` : ''}</div>`;
}

// Every event kind the orchestrator emits. Unknown kinds are ignored rather than rendered
// as debris: the payload is the contract and this feed is narration.
function handle(event, turn, feed) {
  const add = html => { feed.insertAdjacentHTML('beforeend', html); };
  switch (event.event) {
    case 'planning':
      add(frow('live', 'router', `one model call over ${event.workspaces.length} workspace descriptions`));
      break;
    case 'plan': {
      feed.querySelector('.fdot.live')?.classList.replace('live', 'ok');
      const picked = event.workspaces.map(w => w.id).join(', ') || 'none';
      add(frow('ok', 'router', `chose ${event.workspaces.length}: ${picked} · ${event.tokens_in} tokens in`));
      event.workspaces.forEach(w => add(frow('ok', w.id, 'sub-question: ' + w.question)));
      (event.notes || []).forEach(n => add(frow('warn', 'router', n)));
      break;
    }
    case 'lane_start':
      add(frow('live', event.workspace, 'asking…'));
      break;
    case 'lane_step':
      add(frow('live', event.workspace, event.step + (event.detail ? ' — ' + event.detail : ''),
               event.latency_ms));
      break;
    case 'lane_done': {
      const state = !event.ok ? 'bad' : event.input_required ? 'warn' : event.returned_data ? 'ok' : 'warn';
      const said = !event.ok ? 'failed: ' + (event.error || '')
                 : event.input_required ? 'stopped to ask a question'
                 : !event.returned_data ? 'answered, but returned no data'
                 : 'answered' + (event.grain ? ' by ' + event.grain : '')
                   + (event.round_trips > 1 ? ` · ${event.round_trips} round trips` : '');
      add(frow(state, event.workspace, said, event.latency_ms));
      break;
    }
    case 'merge_start':
      add(frow('live', 'merge', `${event.lanes} lane(s) with data · fan-out wall ${event.wall_ms} ms, slowest lane ${event.slowest_ms ?? '?'} ms`));
      break;
    case 'checks': {
      feed.querySelector('.fdot.live')?.classList.replace('live', 'ok');
      const failed = (event.results || []).filter(r => r.verdict === 'fail');
      add(frow(failed.length ? 'warn' : 'ok', 'merge checks',
        failed.length ? `${failed.length} refused: ` + failed.map(r => r.check).join(', ')
                      : `${(event.results || []).length} ran, none refused`));
      break;
    }
    case 'done':
      feed.querySelectorAll('.fdot.live').forEach(d => d.classList.replace('live', 'ok'));
      render(event.payload, turn.querySelector('.result'));
      break;
    case 'error':
      add(frow('bad', 'orchestrator', event.error));
      break;
  }
  window.scrollTo({top: 0});
}

// ── the result ───────────────────────────────────────────────────────────────
function render(d, into) {
  const pills = [];
  pills.push(pill(d.combinable ? 'ok' : 'warn', d.combinable ? 'combined' : 'not combined'));
  pills.push(pill('mono', d.timings.total_ms + ' ms total'));
  pills.push(pill('mono', 'fan-out ' + d.timings.fanout_wall_ms + ' ms · slowest lane ' + d.timings.slowest_lane_ms + ' ms'));
  pills.push(pill('mono', `${d.tokens.in} / ${d.tokens.out} orchestrator tokens`));
  if (d.enriched.length) pills.push(pill('brand', 're-asked ' + d.enriched.join(', ')));

  let html = `<div class="card">
    <h2>Answer</h2>
    <div class="answer${d.combinable ? '' : ' refused'}">${esc(d.reply)}</div>
    ${d.provenance && d.provenance.rejected
      ? `<div class="err" style="margin-top:9px">merge rejected — ${esc(d.provenance.rejected)}</div>` : ''}
    <div class="foot pills">${pills.join('')}</div>
  </div>`;

  // Whatever is still waiting on a human. Rendered before the detail, because it is the one
  // thing on the page that is asking the reader for something.
  (d.pending || []).forEach(p => { html += askBox(p); });

  // Routing. Decomposition is the thing worth seeing: no lane is asked the user's question.
  html += `<div class="card"><h2>Routing and decomposition
      <span class="note">${d.routing.workspaces.length} of the registry · combine on
      ${esc(d.routing.combine_on || 'nothing')}</span></h2>
    ${d.routing.reasoning ? `<div class="q">${esc(d.routing.reasoning)}</div>` : ''}
    ${d.routing.workspaces.map(w => `
      <div class="lane" style="--c:${colour(w.id)}">
        <span class="ws">${esc(w.id)}</span>
        <div class="sub">${esc(w.question)}</div>
        ${w.why ? `<div class="why">${esc(w.why)}</div>` : ''}
      </div>`).join('')}
    ${(d.routing.notes || []).map(n => `<div class="err">${esc(n)}</div>`).join('')}
  </div>`;

  // Per lane, with its charts.
  html += `<div class="card"><h2>Lanes<span class="note">${d.lanes.length} asked</span></h2>
    ${d.lanes.map(ln => laneHTML(ln)).join('')}</div>`;

  // Checks, so a refusal is explained rather than merely delivered.
  html += `<div class="card"><h2>Merge checks
      <span class="note">unknown is not a pass</span></h2>
    ${(d.checks || []).map(k => `<div class="check">
      ${pill(k.verdict === 'pass' ? 'ok' : k.verdict === 'fail' ? 'bad' : '', k.verdict)}
      <span class="name">${esc(k.check)}</span>
      <span class="reason">${esc(k.reason)}</span></div>`).join('')}
    <div class="foot">
      <span class="mono">provenance: ${d.provenance.ok ? 'ok' : 'INVENTED'} — ${d.provenance.checked} number(s) checked${
        (d.provenance.invented || []).length ? ', not found: ' + esc(d.provenance.invented.join(', ')) : ''}</span>
      <button class="link" style="margin-left:10px" onclick="this.nextElementSibling.classList.toggle('open')">payload</button>
      <div class="raw">${esc(JSON.stringify(d, null, 2))}</div>
    </div>
  </div>`;

  into.innerHTML = html;
  $('#en').disabled = busy || !d.lanes.some(ln => !ln.ok || !ln.returned_data);
}

function pill(cls, text) { return `<span class="pill ${cls}">${esc(text)}</span>`; }

function laneHTML(ln) {
  const state = !ln.ok ? ['bad', 'failed']
              : ln.input_required ? ['warn', 'needs input']
              : !ln.returned_data ? ['warn', 'no data']
              : ['ok', 'answered'];
  const pills = [pill(state[0], state[1]), pill('mono', ln.latency_ms + ' ms')];
  if (ln.round_trips > 1) pills.push(pill('mono', ln.round_trips + ' round trips'));
  if (ln.grain) pills.push(pill('', 'by ' + ln.grain));
  if (ln.window) pills.push(pill('mono', ln.window));
  (ln.filters || []).forEach(f => pills.push(pill('mono', f)));
  return `<div class="lane" style="--c:${colour(ln.workspace)}">
    <div class="pills"><span class="ws">${esc(ln.workspace)}</span>${pills.join('')}</div>
    <div class="sub">${esc(ln.question)}</div>
    ${ln.error ? `<div class="err">${esc(ln.error)}</div>` : ''}
    ${ln.text ? `<div class="txt">${esc(ln.text)}</div>` : ''}
    ${charts(ln).join('')}
    ${ln.source ? `<div class="mono" style="margin-top:6px">${esc(ln.source)}</div>` : ''}
  </div>`;
}

// ── clarification ────────────────────────────────────────────────────────────
// input-required is neither an answer nor a failure, and it is the state most callers do not
// model. The agent has usually already proposed a way forward, so the quick replies are
// worth having — but the free-text box is the honest one.
function askBox(p) {
  return `<div class="ask">
    <div class="ask-head">${esc(p.workspace)} needs input</div>
    <div class="ask-q">${esc(p.asks)}</div>
    <div class="ask-quick">
      <button onclick="reply('${esc(p.workspace)}','Yes, go ahead with the fields you proposed.')">Yes, go ahead</button>
      <button onclick="reply('${esc(p.workspace)}','Yes, and tell me which fields you used.')">Yes — and say which fields</button>
    </div>
    <div class="ask-form">
      <input type="text" placeholder="Answer ${esc(p.workspace)}…"
        onkeydown="if(event.key==='Enter'){reply('${esc(p.workspace)}', this.value)}">
      <button class="ask-btn" onclick="reply('${esc(p.workspace)}', this.previousElementSibling.value)">Reply</button>
    </div>
    <div class="ask-hint">Goes to ${esc(p.workspace)} only, on that workspace's own contextId — the
      agent resumes where it stopped, and the other lanes are not asked again.</div>
  </div>`;
}

function reply(workspace, text) {
  text = (text || '').trim();
  if (!text || busy) return;
  send('/reply', {workspace, text});
}

// ── charts ───────────────────────────────────────────────────────────────────
// The agent returns both a `visualization` (its chart type, title and query) and a
// `visualization-data` (columns, rows, formattedRows), paired by visualizationId. Using the
// agent's own declared chart type is the point: it already decided this was a line chart of
// Total Campaign Spend by month, and re-guessing from the rows would throw that away.
function charts(ln) {
  const arts = ln.artifacts || [];
  const defs = arts.filter(a => a.name === 'visualization' && a.data);
  const datas = arts.filter(a => a.name === 'visualization-data' && a.data);
  if (!datas.length) return [];
  return datas.map(dataArt => {
    const data = dataArt.data;
    const def = defs.find(v => v.data.id === data.visualizationId) || defs[0];
    return vizHTML(def ? def.data : {}, data, colour(ln.workspace));
  });
}

const BARLIKE = ['bar_chart', 'column_chart', 'pie_chart', 'donut_chart'];
const LINELIKE = ['line_chart', 'area_chart'];

function fmt(v) {
  if (v === null || v === undefined || v === '') return '–';
  const n = Number(v);
  if (!isFinite(n)) return String(v);
  const a = Math.abs(n);
  if (a >= 1e9) return (n / 1e9).toFixed(1) + 'B';
  if (a >= 1e6) return (n / 1e6).toFixed(1) + 'M';
  if (a >= 1e3) return (n / 1e3).toFixed(1) + 'K';
  return Number.isInteger(n) ? String(n) : n.toFixed(2);
}

function vizHTML(def, data, c) {
  const cols = data.columns || [];
  const attrs = cols.filter(col => col.type === 'attribute');
  const metrics = cols.filter(col => col.type !== 'attribute');
  const raw = data.rows || [];
  const shown = data.formattedRows || raw;
  const type = def.type || (metrics.length && !attrs.length ? 'headline' : 'table');

  const rows = raw.map((row, i) => ({
    label: attrs.map(col => cell(row, col.name)).join(' · ') || '(total)',
    values: metrics.map(col => num(cell(row, col.name))),
    shown: metrics.map(col => String(cell(shown[i] || row, col.name) ?? '')),
  }));

  const head = `<div class="viz-head">
    <span class="viz-title">${esc(def.title || 'Result')}</span>
    ${pill('brand', (type || '?').replace(/_/g, ' '))}
    ${pill('mono', `${data.rowCount ?? rows.length} row(s)`)}
    ${data.truncated ? pill('warn', 'truncated') : ''}</div>`;

  if (!rows.length) return `<div class="viz" style="--c:${c}">${head}
    <div class="viz-body q">no rows returned</div></div>`;

  // Each form can tell the truth about exactly one shape: a line needs several points to
  // trend between, a bar needs one metric across a dimension, a headline needs no dimension
  // at all. Anything else falls back to a table rather than dropping columns to force a
  // picture — and says so underneath, because a silent downgrade reads as the agent having
  // ignored the request.
  const asHeadline = (type === 'headline' || !attrs.length) && rows.length === 1;
  const asLine = LINELIKE.includes(type) && metrics.length >= 1 && rows.length > 1;
  const asBars = BARLIKE.includes(type) && metrics.length === 1 && rows.length > 1;
  const asScatter = type === 'scatter_chart' && metrics.length >= 2;

  const body = asHeadline ? headlineHTML(rows[0], metrics)
             : asScatter  ? scatterHTML(rows, metrics)
             : asLine     ? lineHTML(rows, metrics, type === 'area_chart')
             : asBars     ? barsHTML(rows, ['pie_chart', 'donut_chart'].includes(type))
                          : tableHTML(rows, attrs, metrics);

  let note = '';
  if (!asHeadline && !asScatter && !asLine && !asBars && type && type !== 'table')
    note = `The agent asked for a ${type.replace(/_/g, ' ')}; shown as a table (${metrics.length} metric(s), ${rows.length} row(s)).`;
  const unformatted = metrics.filter(col => !col.format).map(col => col.name);
  if (unformatted.length)
    note += (note ? ' ' : '') + `No number format came back for ${unformatted.join(', ')} — units are a guess.`;

  return `<div class="viz" style="--c:${c}">${head}<div class="viz-body">${body}</div>
    ${note ? `<div class="viz-note">${esc(note)}</div>` : ''}</div>`;
}

function cell(row, name) { return Array.isArray(row) ? row[0] : (row ? row[name] : null); }
function num(v) {
  if (v === null || v === undefined) return null;
  const n = parseFloat(String(v).replace(/[, %]/g, ''));
  return isFinite(n) ? n : null;
}

function headlineHTML(row, metrics) {
  return row.shown.map((value, i) => `<div class="headline">${esc(value)}
    <small>${esc(metrics[i] ? metrics[i].name : '')}</small></div>`).join('');
}

function barsHTML(rows, share) {
  const max = Math.max(...rows.map(r => Math.abs(r.values[0] || 0)), 0) || 1;
  const sum = rows.reduce((a, r) => a + (r.values[0] || 0), 0);
  return `<div class="vbars">${rows.map(r => {
    const v = r.values[0] || 0;
    const part = share && sum ? ' · ' + (v / sum * 100).toFixed(1) + '%' : '';
    return `<div class="vbar"><span class="lab" title="${esc(r.label)}">${esc(r.label)}</span>
      <span class="track"><i class="fill" style="width:${(Math.abs(v) / max * 100).toFixed(1)}%"></i></span>
      <span class="val">${esc(r.shown[0] || '')}${part}</span></div>`;
  }).join('')}</div>`;
}

const PLOT = {w: 620, h: 250, l: 62, r: 16, t: 14, b: 38};
function frame(inner, xlab, ylab) {
  const {w, h, l, r, t, b} = PLOT;
  return `<svg class="vsvg" viewBox="0 0 ${w} ${h}" preserveAspectRatio="xMidYMid meet" role="img"
      aria-label="${esc(ylab)} by ${esc(xlab)}">
    <line class="gr" x1="${l}" y1="${t}" x2="${w - r}" y2="${t}"/>
    <line class="ax" x1="${l}" y1="${t}" x2="${l}" y2="${h - b}"/>
    <line class="ax" x1="${l}" y1="${h - b}" x2="${w - r}" y2="${h - b}"/>
    ${inner}
    ${xlab ? `<text class="axt" x="${(l + w - r) / 2}" y="${h - 5}" text-anchor="middle">${esc(xlab)}</text>` : ''}
    <text class="axt" transform="translate(14 ${(t + h - b) / 2}) rotate(-90)" text-anchor="middle">${esc(ylab)}</text>
  </svg>`;
}
function scale(values) {
  let lo = Math.min(...values), hi = Math.max(...values);
  if (!isFinite(lo) || !isFinite(hi)) { lo = 0; hi = 1; }
  if (lo === hi) { lo -= Math.abs(lo || 1) * .5; hi += Math.abs(hi || 1) * .5; }
  const pad = (hi - lo) * .08;
  return {lo: lo - pad, hi: hi + pad};
}

function lineHTML(rows, metrics, area) {
  const {w, h, l, r, t, b} = PLOT;
  const values = rows.map(row => row.values[0]).filter(v => v !== null);
  // A magnitude over time is honest from zero; a band of large similar values is not, so
  // include zero only when it does not flatten the line into a straight one.
  const Y = scale(values.concat(Math.min(...values) > 0 && Math.min(...values) / Math.max(...values) > .35 ? [] : [0]));
  const px = i => l + (rows.length === 1 ? .5 : i / (rows.length - 1)) * (w - l - r);
  const py = v => (h - b) - (v - Y.lo) / (Y.hi - Y.lo) * (h - b - t);
  const points = rows.map((row, i) => `${px(i).toFixed(1)},${py(row.values[0] || 0).toFixed(1)}`);
  const fill = area
    ? `<polygon class="ar" points="${px(0).toFixed(1)},${h - b} ${points.join(' ')} ${px(rows.length - 1).toFixed(1)},${h - b}"/>`
    : '';
  const marks = rows.map((row, i) => `<circle class="pt" cx="${px(i).toFixed(1)}"
      cy="${py(row.values[0] || 0).toFixed(1)}" r="3.6"><title>${esc(row.label)}: ${esc(row.shown[0] || '')}</title></circle>`).join('');
  // Only the ends get a label — anything denser overlaps unreadably, and the tooltips carry
  // the rest.
  const ticks = `<text class="tk" x="${l}" y="${h - b + 14}">${esc(rows[0].label)}</text>
    <text class="tk" x="${w - r}" y="${h - b + 14}" text-anchor="end">${esc(rows[rows.length - 1].label)}</text>
    <text class="tk" x="${l - 7}" y="${h - b}" text-anchor="end">${esc(fmt(Y.lo))}</text>
    <text class="tk" x="${l - 7}" y="${t + 9}" text-anchor="end">${esc(fmt(Y.hi))}</text>`;
  return frame(`${ticks}${fill}<polyline class="ln" points="${points.join(' ')}"/>${marks}`,
               '', metrics[0] ? metrics[0].name : 'value');
}

function scatterHTML(rows, metrics) {
  const {w, h, l, r, t, b} = PLOT;
  const points = rows.filter(row => row.values[0] !== null && row.values[1] !== null);
  if (!points.length) return tableHTML(rows, [], metrics);
  const X = scale(points.map(p => p.values[0])), Y = scale(points.map(p => p.values[1]));
  const px = v => l + (v - X.lo) / (X.hi - X.lo) * (w - l - r);
  const py = v => (h - b) - (v - Y.lo) / (Y.hi - Y.lo) * (h - b - t);
  const marks = points.map(p => `<circle class="pt" cx="${px(p.values[0]).toFixed(1)}"
      cy="${py(p.values[1]).toFixed(1)}" r="5" fill-opacity=".75"><title>${esc(p.label)}: ${
      esc(p.shown[0])} / ${esc(p.shown[1])}</title></circle>`).join('');
  const ticks = `<text class="tk" x="${l}" y="${h - b + 14}">${esc(fmt(X.lo))}</text>
    <text class="tk" x="${w - r}" y="${h - b + 14}" text-anchor="end">${esc(fmt(X.hi))}</text>
    <text class="tk" x="${l - 7}" y="${h - b}" text-anchor="end">${esc(fmt(Y.lo))}</text>
    <text class="tk" x="${l - 7}" y="${t + 9}" text-anchor="end">${esc(fmt(Y.hi))}</text>`;
  return frame(ticks + marks, metrics[0] ? metrics[0].name : 'x', metrics[1] ? metrics[1].name : 'y');
}

function tableHTML(rows, attrs, metrics) {
  return `<table class="vtable"><thead><tr>
    ${attrs.length ? `<th>${esc(attrs.map(a => a.name).join(' · '))}</th>` : ''}
    ${metrics.map(m => `<th class="num">${esc(m.name)}</th>`).join('')}</tr></thead>
    <tbody>${rows.map(r => `<tr>${attrs.length ? `<td>${esc(r.label)}</td>` : ''}
      ${r.shown.map(v => `<td class="num">${esc(v)}</td>`).join('')}</tr>`).join('')}</tbody></table>`;
}
</script>
</body></html>
