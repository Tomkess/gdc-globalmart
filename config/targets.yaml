# Publish/capture target profiles.
#
# NO SECRETS IN THIS FILE. Tokens come from the environment only:
#   GLOBALMART_TOKEN__<PROFILE_NAME_UPPER_SNAKE>   (e.g. GLOBALMART_TOKEN__DEMO_CLOUD)
#   GLOBALMART_TOKEN                               (generic fallback)
#
# Adding a target is an entry here, never a code change (STEERING § Portability Contract).

targets:
  demo-cloud:
    host: https://petertomko.demo.cloud.gooddata.com
    organization_id: gm-ddebmti
    datasource_id: globalmart-motherduck
    datasource_schema: globalmart
    parent_workspace_id: globalmart
    warehouse_type: motherduck
    datasource_name: GlobalMart MotherDuck
    datasource_url: jdbc:duckdb:md:gd_demo
    datasource_database: gd_demo
    # The NAME of the env var holding the token — never the value.
    datasource_secret_env: MOTHERDUCK_TOKEN
    # data_owned since 2026-09-21. It was false because this schema held the real inherited
    # MotherDuck rows — the only copy after the S3 bucket was lost — which is exactly the
    # "irreplaceable rows" case ADR 004's revisit trigger names. ADR 008 removed that
    # condition: every row here is now generated and reproducible from a seed and a window,
    # so a bad load costs a regeneration, not the data.
    #
    # What remains is availability, not loss. A truncate-then-load empties this schema for
    # the duration and leaves it empty if the load fails halfway, and the live workspaces
    # read it. That is minutes on a demo org, and the fix is to run the load again.
    data_owned: true
    # The corpus is written into each GlobalMart workspace and never at organization level:
    # org-level objects belong to the separate org repo (ADR 009, ADR 011).
    knowledge_scope: workspaces

  # The load target: same host, same MotherDuck database, a schema of its own.
  #
  # This exists so the cold-rebuild path can be proven end to end — apply the DDL into an
  # empty schema, load all 215 tables, load again and get the same row counts — without
  # touching the `globalmart` schema the live workspaces read. It is the only profile in
  # this file with data_owned: true, and that is the point of the flag (ADR 004). Since
  # 2026-09-21 demo-cloud is owned too — see the note above and ADR 004's reverse trigger.
  demo-cloud-rebuild:
    host: https://petertomko.demo.cloud.gooddata.com
    organization_id: gm-ddebmti
    datasource_id: globalmart-motherduck
    datasource_schema: globalmart_rebuild
    parent_workspace_id: globalmart
    warehouse_type: motherduck
    datasource_name: GlobalMart MotherDuck (rebuild)
    datasource_url: jdbc:duckdb:md:gd_demo
    datasource_database: gd_demo
    warehouse_database: gd_demo
    datasource_secret_env: MOTHERDUCK_TOKEN
    data_owned: true
    # The corpus is written into each GlobalMart workspace and never at organization level:
    # org-level objects belong to the separate org repo (ADR 009, ADR 011).
    knowledge_scope: workspaces

  # Second demo org — the cross-org proof target. Publishing the same repo state
  # here and to demo-cloud must yield layouts identical except for the parameterized
  # values (STEERING § Portability Contract).
  # Fill organization_id / datasource_* once a token for this org exists:
  #   GLOBALMART_TOKEN__USECASES_AI=...  then  globalmart targets inspect --target usecases-ai
  usecases-ai:
    host: https://usecases-ai.demo.cloud.gooddata.com
    organization_id: w2r-kigdm6
    # This org has no GlobalMart datasource yet — its existing motherduck-ds points at
    # the demo_data_git database. Publishing with --apply creates this one, aimed at the
    # same shared MotherDuck database the demo-cloud org reads, so both orgs serve the
    # same rows and the cross-org comparison is meaningful.
    datasource_id: globalmart-motherduck
    datasource_schema: globalmart
    parent_workspace_id: globalmart
    warehouse_type: motherduck
    datasource_name: GlobalMart MotherDuck
    datasource_url: jdbc:duckdb:md:gd_demo
    datasource_database: gd_demo
    datasource_secret_env: MOTHERDUCK_TOKEN
    # No knowledge_scope: this profile keeps the default (workspaces) exercised by a real entry.

  # --- gdcloud release targets (FEAT-019, ADR 011) -------------------------------------------
  #
  # One per environment in config.yml. gdcloud deploys the workspace content itself; these let the
  # project-owned steps around it (the knowledge corpus publish, `verify`, `data ensure`) address
  # the same workspace. `gdcloud_environment` ties each to config.yml, and profile-load refuses a
  # `parent_workspace_id` that disagrees with it. Tokens: GLOBALMART_TOKEN__GDCLOUD_<ENV>.
  #
  # All four read the one MotherDuck schema the legacy profiles read, through a data source of
  # their own, `gdc_ds_globalmart_motherduck` (the sibling demo repo's ADR 002 naming), created by
  # `globalmart gdcloud bootstrap`. Both orgs are shared, so knowledge is never org-level.
  gdcloud-dev:
    host: https://petertomko.demo.cloud.gooddata.com
    organization_id: gm-ddebmti
    datasource_id: gdc_ds_globalmart_motherduck
    datasource_schema: globalmart
    parent_workspace_id: globalmart_dev
    warehouse_type: motherduck
    datasource_name: GlobalMart MotherDuck (gdcloud)
    datasource_url: jdbc:duckdb:md:gd_demo
    datasource_database: gd_demo
    warehouse_database: gd_demo
    datasource_secret_env: MOTHERDUCK_TOKEN
    data_owned: true
    knowledge_scope: workspaces
    gdcloud_environment: dev

  gdcloud-test:
    host: https://petertomko.demo.cloud.gooddata.com
    organization_id: gm-ddebmti
    datasource_id: gdc_ds_globalmart_motherduck
    datasource_schema: globalmart
    parent_workspace_id: globalmart_test
    warehouse_type: motherduck
    datasource_name: GlobalMart MotherDuck (gdcloud)
    datasource_url: jdbc:duckdb:md:gd_demo
    datasource_database: gd_demo
    warehouse_database: gd_demo
    datasource_secret_env: MOTHERDUCK_TOKEN
    data_owned: true
    knowledge_scope: workspaces
    gdcloud_environment: test

  gdcloud-preprod:
    host: https://usecases-ai.demo.cloud.gooddata.com
    organization_id: w2r-kigdm6
    datasource_id: gdc_ds_globalmart_motherduck
    datasource_schema: globalmart
    parent_workspace_id: globalmart_preprod
    warehouse_type: motherduck
    datasource_name: GlobalMart MotherDuck (gdcloud)
    datasource_url: jdbc:duckdb:md:gd_demo
    datasource_database: gd_demo
    warehouse_database: gd_demo
    datasource_secret_env: MOTHERDUCK_TOKEN
    data_owned: true
    knowledge_scope: workspaces
    gdcloud_environment: preprod

  gdcloud-prod:
    host: https://usecases-ai.demo.cloud.gooddata.com
    organization_id: w2r-kigdm6
    datasource_id: gdc_ds_globalmart_motherduck
    datasource_schema: globalmart
    parent_workspace_id: globalmart_master
    warehouse_type: motherduck
    datasource_name: GlobalMart MotherDuck (gdcloud)
    datasource_url: jdbc:duckdb:md:gd_demo
    datasource_database: gd_demo
    warehouse_database: gd_demo
    datasource_secret_env: MOTHERDUCK_TOKEN
    data_owned: true
    knowledge_scope: workspaces
    gdcloud_environment: prod

  # Local-inference host. Filled in by FEAT-002 when the Postgres datasource
  # fields (warehouse_type, url, username, secret env var) are added.
  # local-inference:
  #   host: https://<li-host>
  #   organization_id: default
  #   datasource_id: globalmart-postgres
  #   datasource_schema: globalmart
  #   parent_workspace_id: globalmart

  # Any empty org, for proving the cold rebuild (goal-01's measurable outcome).
  # fresh-org:
  #   host: https://<fresh-host>
  #   organization_id: <org>
  #   datasource_id: globalmart-motherduck
  #   datasource_schema: main
  #   parent_workspace_id: globalmart
  #   # knowledge_scope: organization is not supported here — organization-level knowledge
  #   # belongs to the separate org repo (ADR 011); this repo publishes into workspaces only.
  #   knowledge_scope: workspaces
