# Publish/capture target profiles.
#
# NO SECRETS IN THIS FILE. Tokens come from the environment only:
#   GLOBALMART_TOKEN__<PROFILE_NAME_UPPER_SNAKE>   (e.g. GLOBALMART_TOKEN__DEMO_CLOUD)
#   GLOBALMART_TOKEN                               (generic fallback)
#
# Adding a target is an entry here, never a code change (STEERING § Portability Contract).

targets:
  demo-cloud:
    host: https://petertomko.demo.cloud.gooddata.com
    organization_id: gm-ddebmti
    datasource_id: globalmart-motherduck
    datasource_schema: globalmart
    parent_workspace_id: globalmart
    warehouse_type: motherduck
    datasource_name: GlobalMart MotherDuck
    datasource_url: jdbc:duckdb:md:gd_demo
    datasource_database: gd_demo
    # The NAME of the env var holding the token — never the value.
    datasource_secret_env: MOTHERDUCK_TOKEN
    # Deliberately NOT data_owned. `globalmart data load` truncates every table it knows,
    # and this schema is what both published orgs query. Loading here would empty the live
    # demo data for the duration of the load, and leave it empty if the load failed
    # halfway. Use demo-cloud-rebuild to exercise the load path.
    data_owned: false

  # The load target: same host, same MotherDuck database, a schema of its own.
  #
  # This exists so the cold-rebuild path can be proven end to end — apply the DDL into an
  # empty schema, load all 215 tables, load again and get the same row counts — without
  # touching the `globalmart` schema the live workspaces read. It is the only profile in
  # this file with data_owned: true, and that is the point of the flag (ADR 004).
  demo-cloud-rebuild:
    host: https://petertomko.demo.cloud.gooddata.com
    organization_id: gm-ddebmti
    datasource_id: globalmart-motherduck
    datasource_schema: globalmart_rebuild
    parent_workspace_id: globalmart
    warehouse_type: motherduck
    datasource_name: GlobalMart MotherDuck (rebuild)
    datasource_url: jdbc:duckdb:md:gd_demo
    datasource_database: gd_demo
    warehouse_database: gd_demo
    datasource_secret_env: MOTHERDUCK_TOKEN
    data_owned: true

  # Second demo org — the cross-org proof target. Publishing the same repo state
  # here and to demo-cloud must yield layouts identical except for the parameterized
  # values (STEERING § Portability Contract).
  # Fill organization_id / datasource_* once a token for this org exists:
  #   GLOBALMART_TOKEN__USECASES_AI=...  then  globalmart targets inspect --target usecases-ai
  usecases-ai:
    host: https://usecases-ai.demo.cloud.gooddata.com
    organization_id: w2r-kigdm6
    # This org has no GlobalMart datasource yet — its existing motherduck-ds points at
    # the demo_data_git database. Publishing with --apply creates this one, aimed at the
    # same shared MotherDuck database the demo-cloud org reads, so both orgs serve the
    # same rows and the cross-org comparison is meaningful.
    datasource_id: globalmart-motherduck
    datasource_schema: globalmart
    parent_workspace_id: globalmart
    warehouse_type: motherduck
    datasource_name: GlobalMart MotherDuck
    datasource_url: jdbc:duckdb:md:gd_demo
    datasource_database: gd_demo
    datasource_secret_env: MOTHERDUCK_TOKEN

  # Local-inference host. Filled in by FEAT-002 when the Postgres datasource
  # fields (warehouse_type, url, username, secret env var) are added.
  # local-inference:
  #   host: https://<li-host>
  #   organization_id: default
  #   datasource_id: globalmart-postgres
  #   datasource_schema: globalmart
  #   parent_workspace_id: globalmart

  # Any empty org, for proving the cold rebuild (goal-01's measurable outcome).
  # fresh-org:
  #   host: https://<fresh-host>
  #   organization_id: <org>
  #   datasource_id: globalmart-motherduck
  #   datasource_schema: main
  #   parent_workspace_id: globalmart
