# Realistic values for generated text columns (FEAT-021). Read by `globalmart data generate` and
# `data ensure`; a column not listed here keeps the generator's default (`<Column> <index>`).
#
# This is demo content, not schema: change it freely, then force a reload (`data-currency` with
# force + apply). Rule kinds and their semantics are documented in src/globalmart/vocabulary.py.
#
# Geography is coherent by construction: a region is named from *its* country's list and a city
# from *its* region's, and the generator keeps every row's references consistent with the rows
# they point at (a city's country is its region's country).
version: 1
tables:
  dim_currency:
    records:
    - currency_code: USD
      currency_name: US Dollar
      exchange_rate_to_usd: '1.0000'
    - currency_code: CAD
      currency_name: Canadian Dollar
      exchange_rate_to_usd: '0.7300'
    - currency_code: EUR
      currency_name: Euro
      exchange_rate_to_usd: '1.0800'
    - currency_code: GBP
      currency_name: British Pound
      exchange_rate_to_usd: '1.2700'
    - currency_code: MXN
      currency_name: Mexican Peso
      exchange_rate_to_usd: '0.0550'
    - currency_code: JPY
      currency_name: Japanese Yen
      exchange_rate_to_usd: '0.0067'
    - currency_code: CNY
      currency_name: Chinese Yuan
      exchange_rate_to_usd: '0.1400'
    - currency_code: AUD
      currency_name: Australian Dollar
      exchange_rate_to_usd: '0.6600'
    - currency_code: CHF
      currency_name: Swiss Franc
      exchange_rate_to_usd: '1.1300'
    - currency_code: SEK
      currency_name: Swedish Krona
      exchange_rate_to_usd: '0.0950'
  dim_geography_country:
    records:
    - country_name: United States
      ref:
        currency_id:
          currency_code: USD
    - country_name: Canada
      ref:
        currency_id:
          currency_code: CAD
  dim_geography_region:
    # Which country each region belongs to, in row order. Left to chance, 5 of the 8 regions
    # fell in Canada, and with them ~70% of cities, stores and orders. A US-headquartered
    # retailer reads better at roughly three US regions to one Canadian.
    records:
    - ref: {country_id: {country_name: United States}}
    - ref: {country_id: {country_name: Canada}}
    - ref: {country_id: {country_name: United States}}
    - ref: {country_id: {country_name: United States}}
    - ref: {country_id: {country_name: United States}}
    - ref: {country_id: {country_name: Canada}}
    - ref: {country_id: {country_name: United States}}
    - ref: {country_id: {country_name: United States}}
    by_parent:
    - column: region_name
      via: country_id
      key: country_name
      values:
        United States:
        - Northeast
        - Southeast
        - Midwest
        - Southwest
        - West Coast
        - Mountain West
        - Great Lakes
        - Mid-Atlantic
        Canada:
        - Ontario
        - Quebec
        - Western Canada
        - Atlantic Canada
        - Prairies
        - Northern Canada
