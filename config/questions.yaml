# The question and conversation script.
#
# Three things at once, deliberately:
#   * the demo runbook — what gets asked on the day, in order
#   * the routing measurement input — `expect` is what a human says the question needs
#   * the regression set — when a prompt changes, this is what says whether it got better
#
# Written before the prompts exist, so the routing expectations are a judgement about the
# workspaces rather than a description of whatever the router happens to do.
#
# `expect` is the set of workspaces a competent analyst would consult. A router that returns
# fewer has missed something; one that returns more is broadcasting, which is the failure the
# whole exercise exists to avoid. Both count as misses.
#
# The four workspaces model Infobip's four products — one workspace per product, four
# different data models:
#   globalmart-customer    ~ Conversation   interaction detail: NPS, feedback, loyalty
#   globalmart-marketing   ~ Moments        campaigns: spend, impressions, sends, clicks
#   globalmart-store-ops   ~ Answers        service delivery: footfall, staffing, energy
#   globalmart-ecommerce   ~ Overview       broad but thin: order count, average order value

version: 1

questions:
  - id: single-ecommerce
    kind: routing
    question: How many online orders did we take last month?
    expect: [globalmart-ecommerce]
    shows: >
      Routing selects rather than broadcasts. One workspace answers this completely, and a
      router that calls all four has demonstrated nothing.

  - id: single-customer
    kind: routing
    question: What is our NPS trend over the last six months?
    expect: [globalmart-customer]
    shows: >
      A second single-workspace case in different vocabulary, so the first is not a fluke of
      one phrasing.

  - id: pair-campaign-satisfaction
    kind: federation
    question: >
      Did the campaigns we spent the most on last quarter actually move customer
      satisfaction?
    expect: [globalmart-marketing, globalmart-customer]
    shows: >
      The core case. Neither workspace can answer it: marketing knows spend and knows nothing
      about satisfaction, customer knows NPS and has never heard of a campaign. Decomposition
      sends a different sub-question to each, and the merge combines them on month.

  - id: pair-staffing-satisfaction
    kind: federation
    question: Were customers less happy in the weeks when stores were short-staffed?
    expect: [globalmart-store-ops, globalmart-customer]
    shows: >
      A second federation pair across a different boundary, to show the first was not a
      specially chosen question.

  - id: wide-quarter-review
    kind: latency
    question: >
      Give me a full picture of last quarter — sales, campaign performance, store operations
      and customer sentiment.
    expect:
      - globalmart-ecommerce
      - globalmart-marketing
      - globalmart-store-ops
      - globalmart-customer
    shows: >
      All four lanes, which is where latency is measured. Fan-out costs the slowest lane, so
      this is the number that decides whether four-to-five workspaces is viable live.

  - id: unmergeable-grain
    kind: merge-refusal
    question: Which campaigns performed best, and which stores had the most footfall?
    expect: [globalmart-marketing, globalmart-store-ops]
    shows: >
      Two valid answers with nothing to join on — one is by campaign, the other by store.
      The merge checks must refuse to connect them and say why, rather than inventing a
      relationship. Presented separately, attributed, with the reason.

  - id: overview-shallow
    kind: overview-problem
    question: How is our online business doing, and what is driving it?
    expect: [globalmart-ecommerce, globalmart-marketing]
    shows: >
      Infobip's actual problem, reproduced. The thin workspace nominally covers "online
      business" and answers shallowly — order count and average order value, no explanation.
      "What is driving it" needs a detailed workspace. This is why their own Overview
      workspace was not sufficient, demonstrated rather than described.
    note: >
      Narrowed on 2026-09-21 from three workspaces to two. The original expectation included
      customer satisfaction as a "driver" of online business, which the question does not
      imply — the router chose ecommerce and marketing, and that was the better reading.
      Recorded rather than quietly edited: an expectation changed to match a router measures
      nothing, so the reason has to survive in the file.

  - id: overview-shallow-with-sentiment
    kind: overview-problem
    question: >
      How is our online business doing, what is driving it, and how do customers feel about
      it?
    expect: [globalmart-ecommerce, globalmart-marketing, globalmart-customer]
    shows: >
      The same beat with satisfaction made explicit, so three workspaces is a defensible
      expectation rather than an assumption. Kept alongside the narrower version because the
      pair shows the router responding to what the question actually asks.

  - id: lane-failure
    kind: degradation
    question: Compare campaign spend and customer satisfaction for last quarter.
    expect: [globalmart-marketing, globalmart-customer]
    inject_failure: globalmart-customer
    shows: >
      One lane forced to fail. The answer must degrade honestly — report what marketing
      returned, state plainly that customer did not answer, and never imply the missing half.

  - id: no-data
    kind: degradation
    question: What were our order volumes in 2019?
    expect: [globalmart-ecommerce]
    shows: >
      A lane that answers but finds nothing, which is not the same as failing. The reply must
      say there is no data for the period rather than returning an empty-looking number.

  # --- the second ten -------------------------------------------------------
  # Added on 2026-09-21 to give the demo a full bank of prompts rather than ten. The first
  # ten each prove a distinct mechanism; these widen the vocabulary, cover the two merge
  # refusals the first set did not reach (units and time window), and give the presenter
  # single-workspace questions to open with while the audience is still reading the screen.

  - id: single-marketing
    kind: routing
    question: Which campaign delivered the most impressions last month?
    expect: [globalmart-marketing]
    shows: >
      A single workspace in marketing's own vocabulary. Useful as an opener: one lane, one
      chart, twenty seconds, and the mechanism is visible before anything is federated.

  - id: single-store-ops
    kind: routing
    question: Which stores had the highest footfall last quarter?
    expect: [globalmart-store-ops]
    shows: >
      The fourth workspace on its own, so all four have been seen answering before any of
      them is asked to combine.

  - id: single-customer-feedback
    kind: routing
    question: What are customers complaining about most in their feedback?
    expect: [globalmart-customer]
    shows: >
      A qualitative question rather than a metric one. The agent has to pick its own
      breakdown, which is the part of the work the orchestrator never does.

  - id: within-one-workspace
    kind: routing
    question: Did energy use track footfall across the stores last quarter?
    expect: [globalmart-store-ops]
    shows: >
      Two measures that sound like two workspaces and are not — store operations holds both.
      The correct answer is one lane, and a router that fans out has demonstrated the exact
      habit this exercise exists to avoid. The single most useful negative case in the set.

  - id: pair-footfall-orders
    kind: federation
    question: >
      Are the stores with the most footfall in the regions where online orders are growing
      fastest?
    expect: [globalmart-store-ops, globalmart-ecommerce]
    shows: >
      A third federation pair, across the physical/digital boundary rather than the
      marketing/customer one. Region is the common key, and whether the two lanes actually
      report at the same grain is left to the checks rather than assumed.

  - id: pair-loyalty-campaigns
    kind: federation
    question: Are our loyalty members responding to campaigns better than everyone else?
    expect: [globalmart-customer, globalmart-marketing]
    shows: >
      Population parity, which is a model judgement rather than a code check. "Loyalty
      members" and "everyone else" are two populations and only one workspace knows which
      is which — so the merge has to say what it is comparing, or refuse.

  - id: trio-sales-drivers
    kind: federation
    question: Sales are up this quarter — was it the campaigns or the stores?
    expect: [globalmart-ecommerce, globalmart-marketing, globalmart-store-ops]
    shows: >
      Three lanes, and a question whose whole content is causal. The merge may sequence and
      compare but not conclude: "spend rose in the same months" is supportable from the
      lanes, "campaigns caused it" is not.

  - id: unmergeable-units
    kind: merge-refusal
    question: Compare campaign spend against average customer satisfaction for last quarter.
    expect: [globalmart-marketing, globalmart-customer]
    shows: >
      Currency against a score. Both real, the quotient meaningless — this is the case that
      produces "cost per NPS point was 441.73" if nothing stops it. `unit_compatibility`
      gates it, and `numeric_provenance` catches it afterwards even if the prompt is ignored.

  - id: unmergeable-window
    kind: merge-refusal
    question: How do last month's online orders compare with campaign spend over the last six months?
    expect: [globalmart-ecommerce, globalmart-marketing]
    shows: >
      The user asked for two different periods, so the lanes correctly answer over two
      different periods — and `time_window_match` must refuse to present them as a
      comparison. A refusal the *question* caused, not the data.

  - id: clarification-needed
    kind: clarification
    question: Rank our campaigns by spend and show which of them had the best click-through.
    expect: [globalmart-marketing]
    shows: >
      Observed live: the agent finds the spend metric, finds it has no campaign field to
      rank by, proposes an alternative and stops for permission. With a human watching, the
      question reaches the screen and the reply goes back on that lane's own contextId.
      Unattended, the lane auto-confirms and the answer says it rested on an assumption.

conversations:
  - id: followup-reroute
    shows: >
      A follow-up that needs a workspace the first turn never touched. The router must run
      again on the second turn rather than reusing the first turn's selection.
    turns:
      - question: How did our campaigns perform last quarter?
        expect: [globalmart-marketing]
      - question: And did any of that show up in customer satisfaction?
        expect: [globalmart-customer]

  - id: followup-same-lane
    shows: >
      A follow-up within the same workspace, which must reuse that lane's context_id so the
      agent resolves "those" against its own earlier turn rather than starting cold.
    turns:
      - question: Which campaigns had the highest spend last quarter?
        expect: [globalmart-marketing]
      - question: How many impressions did those get?
        expect: [globalmart-marketing]

  - id: enrich-after-failure
    shows: >
      The enrich path. A lane fails, the answer is synthesised from what returned, and the
      failed lane is retried alone — keeping the answers that succeeded rather than re-running
      everything.
    turns:
      - question: Compare campaign spend against customer satisfaction last quarter.
        expect: [globalmart-marketing, globalmart-customer]
        inject_failure: globalmart-customer
      - question: Try the satisfaction part again.
        expect: [globalmart-customer]
        enrich: true

  - id: clarify-then-answer
    shows: >
      The clarification loop, which is the one part of this a caller cannot paper over. Turn
      one stops with the agent asking a question; the human answers it in the front end; the
      reply goes to that workspace alone, on its own contextId, and the agent resumes where
      it stopped. The other lanes are never re-asked — they already answered, and asking
      again would compare two different moments.
    turns:
      - question: Rank our campaigns by spend and show which had the best click-through.
        expect: [globalmart-marketing]
      - question: Yes, use the campaign name — and say which fields you chose.
        expect: [globalmart-marketing]

  - id: narrowing-thread
    shows: >
      Three turns that narrow, which is how anyone actually uses an assistant. The route is
      recomputed every turn: turn two stays in marketing, turn three leaves it entirely. A
      session that remembered the first turn's selection would answer the third question
      from the wrong workspace.
    turns:
      - question: How did our campaigns perform last quarter?
        expect: [globalmart-marketing]
      - question: Which of those had the highest spend per impression?
        expect: [globalmart-marketing]
      - question: And were customers any happier in the months those ran?
        expect: [globalmart-customer]
