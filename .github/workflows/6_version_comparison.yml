# Generated by `gd-workflows adopt`; edit config.yml or gd-cloud-tooling,
# not this package-owned workflow. Re-run `make dev` after a pin change.
name: 6 - Version Comparison and Status Report
run-name: "6 - Version comparison [${{ inputs.data_product_id }}]${{ inputs.environment && format(' by {0}', inputs.environment) || '' }}"

on:
  workflow_dispatch:
    inputs:
      data_product_id:
        description: 'Data product to check'
        required: false
        type: choice
        options:
          - 'globalmart'
        default: 'globalmart'
      environment:
        description: 'Environment that triggered the report'
        required: false
        type: string
        default: ''
      show_detailed_history:
        description: 'Show recent version history'
        required: false
        type: boolean
        default: false
      trigger_reason:
        description: 'Reason for automatic trigger'
        required: false
        type: string
        default: 'manual'

  workflow_call:
    inputs:
      data_product_id:
        description: 'Data product to check'
        required: false
        type: string
      environment:
        description: 'Environment that triggered the report'
        required: false
        type: string
        default: ''
      show_detailed_history:
        description: 'Show recent version history'
        required: false
        type: boolean
        default: false
      trigger_reason:
        description: 'Reason for automatic trigger'
        required: false
        type: string
        default: automatic

permissions:
  contents: read
  pull-requests: read

jobs:
  version_comparison:
    if: ${{ github.event_name == 'workflow_dispatch' || github.repository != '__gdcloud_disabled__' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0  # Required for version tag operations
          # gd-version reads tags and `git log -- <path>`: commits and trees,
          # never an old file's contents.
          filter: blob:none

      - name: Setup Python Environment
        uses: ./.github/actions/setup_python
        with:
          github_token: ${{ secrets.TOKEN_GITHUB_GDCLOUD }}

      - name: Generate Version Status Report
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          DATA_PRODUCT_ID: ${{ inputs.data_product_id }}
          TRIGGER_REASON: ${{ inputs.trigger_reason }}
          SHOW_DETAILED_HISTORY: ${{ inputs.show_detailed_history }}
        run: |
          # Build command arguments
          DETAILED_FLAG=""

          if [ "$SHOW_DETAILED_HISTORY" = "true" ]; then
            DETAILED_FLAG="--detailed"
          fi

          # Add trigger reason to summary if provided
          if [ "$TRIGGER_REASON" != "automatic" ]; then
            echo "## 🔄 Triggered by: $TRIGGER_REASON" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
          fi

          # Run the Python script with GitHub Summary output
          gd-version \
            --data-product-id "$DATA_PRODUCT_ID" \
            --github-summary \
            $DETAILED_FLAG
