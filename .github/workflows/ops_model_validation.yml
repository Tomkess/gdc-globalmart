# Generated by `gd-workflows adopt`; edit config.yml or gd-cloud-tooling,
# not this package-owned workflow. Re-run `make dev` after a pin change.
name: "@ Model validation"
run-name: "Model validation [${{ inputs.data_product_id }}] ${{ inputs.mode }} @ ${{ inputs.env }}"

on:
  workflow_dispatch:
    inputs:
      data_product_id:
        description: 'Data product to validate'
        required: true
        type: choice
        # NOTE: Update this list when adding new data products
        options:
          - 'globalmart'
        default: 'globalmart'
      env:
        description: 'Target environment'
        required: true
        type: choice
        # gd-workflows: environment-options all
        options:
          - 'dev'
          - 'test'
          - 'preprod'
          - 'prod'
        default: 'dev'
      mode:
        # ldm-deploy automatically runs overrides-check in parallel (see model_validation.yml)
        # overrides-check mode exists but is not exposed here - use ldm-deploy instead
        description: 'ldm-now: remote LDM vs PDM (current state) | ldm-deploy: local LDM vs PDM (pre-deploy check)'
        required: true
        type: choice
        options:
          - 'ldm-now'
          - 'ldm-deploy'
        default: 'ldm-now'
      show_overrides:
        description: 'Show current env overrides after validation'
        required: false
        type: boolean
        default: true

  workflow_call:
    inputs:
      data_product_id:
        description: 'Data product to validate'
        required: true
        type: string
      env:
        description: 'Target environment'
        required: true
        type: string
      mode:
        description: 'ldm-now: remote LDM vs PDM (current state) | ldm-deploy: local LDM vs PDM (pre-deploy check)'
        required: true
        type: string
      show_overrides:
        description: 'Show current env overrides after validation'
        required: false
        type: boolean
        default: true

# Required permissions for reusable workflow
permissions:
  contents: read       # Required for checkout
  actions: read        # Required for querying workflow run jobs

jobs:
  validate:
    uses: ./.github/workflows/model_validation.yml
    with:
      env: ${{ inputs.env }}
      data_product_id: ${{ inputs.data_product_id }}
      mode: ${{ inputs.mode }}
      show_overrides: ${{ inputs.show_overrides }}
    secrets: inherit
