# Generated by `gd-workflows adopt`; edit config.yml or gd-cloud-tooling,
# not this package-owned workflow. Re-run `make dev` after a pin change.
name: 5 - Manual deployment to preprod/prod environment
run-name: "5 - Deploy to ${{ inputs.environment }} [${{ inputs.data_product_id }}]${{ inputs.version && format(' {0}', inputs.version) || '' }}${{ inputs.hotfix_ref && format(' from {0}', inputs.hotfix_ref) || '' }}"

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        type: choice
        # gd-workflows: environment-options preprod,prod
        options:
          - 'preprod'
          - 'prod'
        default: 'preprod'
      data_product_id:
        description: 'Data product to deploy'
        required: true
        type: choice
        options:
          - 'globalmart'
        default: 'globalmart'
      version:
        description: 'Version to deploy — required for standard deploys and prod hotfix promotion (the patch tag); empty (with hotfix_ref) creates a preprod hotfix tag'
        required: false
        type: string
        default: ''
      hotfix_ref:
        description: 'PREPROD ONLY — ephemeral hotfix branch (deployed-tag + fix). Prod promotion is tag-only; leave empty and pass the patch tag as version. Workflow itself runs from master.'
        required: false
        type: string
        default: ''
      skip_validation:
        description: 'Skip pre-deployment model validation (not recommended)'
        required: false
        type: boolean
        default: false

  workflow_call:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        type: string
      data_product_id:
        description: 'Data product to deploy'
        required: true
        type: string
      version:
        description: 'Version to deploy — required for standard deploys and prod hotfix promotion (the patch tag); empty (with hotfix_ref) creates a preprod hotfix tag'
        required: false
        type: string
        default: ''
      hotfix_ref:
        description: 'PREPROD ONLY — ephemeral hotfix branch (deployed-tag + fix). Prod promotion is tag-only; leave empty and pass the patch tag as version. Workflow itself runs from master.'
        required: false
        type: string
        default: ''
      skip_validation:
        description: 'Skip pre-deployment model validation (not recommended)'
        required: false
        type: boolean
        default: false

# Permissions for reusable workflow calls and deployment operations
concurrency:
  group: deploy-prod-${{ inputs.data_product_id }}-${{ inputs.environment }}
  cancel-in-progress: false

permissions:
  actions: read         # Required by model_validation.yml (validation-summary job)
  contents: write       # Required to push deployment tracking tags
  pull-requests: read   # PR changelog in deployment summary

jobs:
  # Refuses a non-default branch before any job holding a credential runs.
  # No secrets are passed: the gate needs none.
  branch_gate:
    permissions:
      contents: read
    uses: ./.github/workflows/branch_gate.yml

  # Deployment plan: visible to approvers BEFORE the prod approval gate
  deployment_info:
    needs: branch_gate
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolved.outputs.version }}
      candidate_sha: ${{ steps.candidate.outputs.sha }}
      is_hotfix_promotion: ${{ steps.classify.outputs.is_hotfix_promotion }}
      # Published so the reusable-workflow jobs below can gate on the same
      # verdict; a job-level `if:` cannot reach another job's step outputs.
      is_default_branch: ${{ steps.config.outputs.is_default_branch }}
      default_branch: ${{ steps.config.outputs.default_branch }}
    steps:
      # Soft naming enforcement: the dispatched hotfix branch must reference
      # the selected DP (gd-hotfix names branches hotfix/{short}-{deployed}),
      # so a run for one DP can't accidentally execute on another DP's branch.
      - name: Verify hotfix branch matches data product
        if: ${{ inputs.hotfix_ref != '' }}
        env:
          HOTFIX_REF: ${{ inputs.hotfix_ref }}
          DATA_PRODUCT_ID: ${{ inputs.data_product_id }}
        run: |
          SHORT="${DATA_PRODUCT_ID%%_*}"
          if [[ ! "$HOTFIX_REF" =~ ^hotfix/[A-Za-z0-9._/-]+$ ]] || [[ "$HOTFIX_REF" == *..* ]]; then
            echo "::error title=Invalid hotfix_ref::'$HOTFIX_REF' is not a valid hotfix/... branch name."
            exit 1
          fi
          if [[ "$HOTFIX_REF" != "hotfix/${SHORT}-"* && "$HOTFIX_REF" != "hotfix/${DATA_PRODUCT_ID}-"* ]]; then
            echo "::error title=hotfix_ref belongs to another data product::Branch $HOTFIX_REF does not belong to $DATA_PRODUCT_ID. Expected hotfix/${SHORT}-<deployed-version> (created by gd-hotfix)."
            exit 1
          fi

      # Input-only checks run before checkout so a mis-dispatched run fails in
      # seconds, and each raises an ::error annotation: a bare echo + exit 1
      # surfaces only as "Process completed with exit code 1".
      - name: Validate version input
        if: ${{ inputs.hotfix_ref == '' && inputs.version == '' }}
        env:
          ENVIRONMENT: ${{ inputs.environment }}
        run: |
          echo "::error title=Missing version input::No version given for the $ENVIRONMENT deployment. Run 'gd-version' to list available versions, then re-run with 'version' set (e.g. v1.5)."
          echo "   A version is required so the run can't deploy an unintended commit if the default branch moves during the approval wait."
          exit 1

      # Prod is tag-only: the branch is reaped after preprod, so a hotfix_ref on
      # prod would fetch-fail. Reject it early with the correct invocation.
      - name: Reject hotfix_ref on prod
        if: ${{ inputs.hotfix_ref != '' && inputs.environment == 'prod' }}
        run: |
          echo "::error title=hotfix_ref not allowed on prod::Prod promotion is tag-only. Re-run with version=<patch> (the tag preprod created) and no hotfix_ref."
          exit 1

      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          # Strings ('0'/'1') avoid the GHA ternary trap where a falsy "true" branch
          # (the bare `0`) collapses to the `|| 1` fallback, silently giving depth 1.
          fetch-depth: ${{ inputs.hotfix_ref != '' && '0' || '1' }}
          fetch-tags: true  # Tags for version management; full history for candidate validation
          # This job reads commit/tag/tree metadata only (never materializes an
          # old tag), so blobless is the right pairing for the full history.
          filter: blob:none

      - name: Fetch hotfix candidate
        id: candidate
        if: ${{ inputs.hotfix_ref != '' }}
        env:
          HOTFIX_REF: ${{ inputs.hotfix_ref }}
        run: |
          git fetch origin "refs/heads/$HOTFIX_REF:refs/remotes/origin/$HOTFIX_REF"
          SHA=$(git rev-parse --verify "origin/$HOTFIX_REF^{commit}")
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "📌 Hotfix candidate pinned at $SHA"

      - name: Setup Python Environment
        uses: ./.github/actions/setup_python
        with:
          github_token: ${{ secrets.TOKEN_GITHUB_GDCLOUD }}

      - name: Load Configuration
        id: config
        uses: ./.github/actions/load_config
        with:
          environment: ${{ inputs.environment }}
          data_product_id: ${{ inputs.data_product_id }}

      - name: Verify allowed branch
        # Only an explicit 'false' blocks: an older pinned load_config has no
        # such output, and '' must not reject the branch branch_gate passed.
        if: ${{ steps.config.outputs.is_default_branch == 'false' }}
        run: |
          echo "::error title=Wrong branch::This workflow must be run from the default branch. For a hotfix, stay on the default branch and pass hotfix_ref."
          echo "   Configured default: ${{ steps.config.outputs.default_branch }}"
          echo "   Current branch:     ${{ github.ref_name }}"
          exit 1

      # Prod promotes hotfixes tag-only (no hotfix_ref): a three-number patch
      # version on prod IS the promotion. GHA `if:` can't regex a version, so
      # classify once here and gate the promotion checks on this boolean —
      # replacing the old `hotfix_ref != ''` proxy that prod no longer supplies.
      - name: Classify deployment
        id: classify
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          HOTFIX_REF: ${{ inputs.hotfix_ref }}
          VERSION: ${{ inputs.version }}
        run: |
          if [[ "$ENVIRONMENT" == "prod" && -z "$HOTFIX_REF" \
                && "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "is_hotfix_promotion=true" >> "$GITHUB_OUTPUT"
            echo "🩹 Prod hotfix promotion of $VERSION (tag-only)"
          else
            echo "is_hotfix_promotion=false" >> "$GITHUB_OUTPUT"
          fi

      # HARD STOP: the branch must be rooted at the DP's deployed prod tag
      # with only branch-local fix commits on top — a branch cut from master
      # would ship unreleased content as a patch.
      - name: Enforce deployed baseline for hotfix
        if: ${{ inputs.hotfix_ref != '' && inputs.version == '' }}
        uses: ./.github/actions/version_management
        with:
          action: validate_hotfix_baseline
          data_product_id: ${{ inputs.data_product_id }}
          ref: ${{ steps.candidate.outputs.sha }}
          skip_setup: 'true'

      # Hotfix versioning is per-DP: the base comes from the DP's own last
      # prod deployment tag (get_hotfix_base_version docstring has the why).
      - name: Predict hotfix version
        id: version
        if: ${{ inputs.hotfix_ref != '' && inputs.version == '' }}
        uses: ./.github/actions/version_management
        with:
          action: predict_hotfix_version
          data_product_id: ${{ inputs.data_product_id }}
          ref: ${{ steps.candidate.outputs.sha }}
          skip_setup: 'true'

      - name: Validate specified version
        id: version-standard
        if: ${{ inputs.version != '' }}
        uses: ./.github/actions/version_management
        with:
          action: validate_version
          data_product_id: ${{ inputs.data_product_id }}
          version: ${{ inputs.version }}
          skip_setup: 'true'

      - name: Enforce branch deployment mode
        if: ${{ inputs.version != '' }}
        env:
          HOTFIX_REF: ${{ inputs.hotfix_ref }}
          VERSION: ${{ steps.version-standard.outputs.version }}
          ENVIRONMENT: ${{ inputs.environment }}
        run: |
          # hotfix_ref (preprod) mints the patch tag itself — it takes no version.
          if [[ -n "$HOTFIX_REF" ]]; then
            echo "::error title=version not allowed with hotfix_ref::hotfix_ref prepares a preprod hotfix and mints its own version. Re-run preprod with hotfix_ref and an EMPTY version."
            exit 1
          fi
          # A patch (three-number) version is only valid as a prod promotion of a
          # preprod-minted tag; preprod mints via hotfix_ref instead.
          if [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ && "$ENVIRONMENT" != "prod" ]]; then
            echo "::error title=Patch version outside prod::Hotfix patch $VERSION is promoted to prod from its tag; for preprod use hotfix_ref."
            exit 1
          fi

      # validate_hotfix_promotion is version/tag-only (no branch): it requires
      # the matching deploy-preprod-{dp}-{version}-* tag and refuses rollbacks.
      - name: Verify hotfix passed preprod
        id: hotfix-promotion
        if: ${{ steps.classify.outputs.is_hotfix_promotion == 'true' }}
        uses: ./.github/actions/version_management
        with:
          action: validate_hotfix_promotion
          data_product_id: ${{ inputs.data_product_id }}
          version: ${{ steps.version-standard.outputs.version }}
          skip_setup: 'true'

      - name: Set version outputs
        id: resolved
        env:
          HOTFIX_REF: ${{ inputs.hotfix_ref }}
          RAW_VERSION: ${{ inputs.version }}
          IS_HOTFIX_PROMOTION: ${{ steps.classify.outputs.is_hotfix_promotion }}
          PREDICTED_VERSION: ${{ steps.version.outputs.version }}
          PREDICTED_PREVIOUS: ${{ steps.version.outputs.previous_version }}
          VALIDATED_VERSION: ${{ steps.version-standard.outputs.version }}
          CURRENT_PROD: ${{ steps.hotfix-promotion.outputs.previous_version }}
          CANDIDATE_SHA: ${{ steps.candidate.outputs.sha }}
        run: |
          # Preprod hotfix mint: hotfix_ref with an empty version input.
          if [[ -n "$HOTFIX_REF" && -z "$RAW_VERSION" ]]; then
            echo "version=$PREDICTED_VERSION" >> "$GITHUB_OUTPUT"
            echo "type=hotfix" >> "$GITHUB_OUTPUT"
            echo "previous_version=$PREDICTED_PREVIOUS" >> "$GITHUB_OUTPUT"
            # Compare against the branch ref: the predicted tag is only
            # created later in the deploy job, so a tag link would 404
            echo "changes_head=$CANDIDATE_SHA" >> "$GITHUB_OUTPUT"
          # Prod hotfix promotion: tag-only (classify already required a patch).
          elif [[ "$IS_HOTFIX_PROMOTION" == "true" ]]; then
            echo "version=$VALIDATED_VERSION" >> "$GITHUB_OUTPUT"
            echo "type=hotfix" >> "$GITHUB_OUTPUT"
            echo "previous_version=$CURRENT_PROD" >> "$GITHUB_OUTPUT"
            echo "changes_head=$VALIDATED_VERSION" >> "$GITHUB_OUTPUT"
          else
            echo "version=$VALIDATED_VERSION" >> "$GITHUB_OUTPUT"
            echo "type=specific" >> "$GITHUB_OUTPUT"
          fi

      - name: Pre-deployment Summary
        uses: ./.github/actions/deployment_summary
        with:
          phase: pre
          environment: ${{ inputs.environment }}
          data_product_id: ${{ inputs.data_product_id }}
          version: ${{ steps.resolved.outputs.version }}
          # Same condition as 'Predict hotfix version': this leg mints the tag
          # later (in deploy_workspace), so the number here is only a forecast.
          version_predicted: ${{ inputs.hotfix_ref != '' && inputs.version == '' }}
          branch: ${{ inputs.hotfix_ref || github.ref_name }}
          triggered_by: ${{ github.actor }}
          deployment_type: ${{ steps.resolved.outputs.type == 'hotfix' && 'hotfix' || 'specific' }}
          previous_version: ${{ steps.resolved.outputs.previous_version }}
          validation_status: ${{ inputs.skip_validation && '⚠️ **SKIPPED**' || '' }}
          changes_link: ${{ steps.resolved.outputs.type == 'hotfix' && format('{0}/{1}/compare/{2}...{3}', github.server_url, github.repository, steps.resolved.outputs.previous_version, steps.resolved.outputs.changes_head) || '' }}
          repo_url: ${{ github.server_url }}/${{ github.repository }}
          hotfix_ref: ${{ steps.candidate.outputs.sha }}

  # Pre-deployment validation: validate local LDM against target env PDM
  validate_models:
    if: >-
      ${{ !inputs.skip_validation &&
      needs.deployment_info.outputs.is_default_branch != 'false' }}
    needs: deployment_info
    uses: ./.github/workflows/model_validation.yml
    with:
      env: ${{ inputs.environment }}
      data_product_id: ${{ inputs.data_product_id }}
      mode: "ldm-deploy"
      ref: ${{ inputs.version || needs.deployment_info.outputs.candidate_sha }}
    secrets: inherit

  # Informational: validate LDM dataset SQL against data source (non-blocking)
  validate_sql:
    if: ${{ needs.deployment_info.outputs.is_default_branch != 'false' }}
    needs: deployment_info
    uses: ./.github/workflows/model_validation.yml
    with:
      env: ${{ inputs.environment }}
      data_product_id: ${{ inputs.data_product_id }}
      mode: "ldm-sql"
      ref: ${{ inputs.version || needs.deployment_info.outputs.candidate_sha }}
    secrets: inherit

  # Informational: validate base LDM SQL without env overrides (non-blocking)
  validate_sql_base:
    if: ${{ needs.deployment_info.outputs.is_default_branch != 'false' }}
    needs: deployment_info
    uses: ./.github/workflows/model_validation.yml
    with:
      env: ${{ inputs.environment }}
      data_product_id: ${{ inputs.data_product_id }}
      mode: "ldm-sql"
      skip_overrides: true
      ref: ${{ inputs.version || needs.deployment_info.outputs.candidate_sha }}
    secrets: inherit

  # Pre-deployment backup (runs before approval, in parallel with validation)
  # Only for prod - preprod doesn't need backup (can restore from git)
  backup_workspace:
    # Holds a prod token, so it waits for the branch pre-gate like every other
    # credential-bearing job — it previously started in parallel with it.
    needs: [branch_gate, deployment_info]
    if: ${{ inputs.environment == 'prod' }}
    runs-on: ubuntu-latest
    environment:
      name: ${{ fromJSON('{"dev":"develop","test":"staging","preprod":"preprod","prod":"production"}')[inputs.environment] }}
      deployment: false
    env:
      TOKEN_GOODDATA: ${{ secrets.TOKEN_GOODDATA }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Python Environment
        uses: ./.github/actions/setup_python
        with:
          github_token: ${{ secrets.TOKEN_GITHUB_GDCLOUD }}

      - name: Load Configuration
        uses: ./.github/actions/load_config
        id: config
        with:
          environment: ${{ inputs.environment }}
          data_product_id: ${{ inputs.data_product_id }}
          keys: "master_workspace_id"

      - name: Backup Workspace
        run: |
          echo "📦 Backing up ${{ inputs.environment }} workspace before deployment..."
          gd-backup \
            --environment "${{ inputs.environment }}" \
            --data-product-id "${{ inputs.data_product_id }}" \
            --all \
            --output-dir backups

      - name: Upload Backup Artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pre-deployment-backup-${{ inputs.environment }}-${{ inputs.data_product_id }}-${{ github.run_number }}-${{ github.run_attempt }}
          path: backups/
          retention-days: 30
          if-no-files-found: warn

  # Actual deployment job. Configure approval rules on the GitHub Environment
  # named by environments.<env>.github_environment in config.yml.
  deploy_workspace:
    runs-on: ubuntu-latest
    permissions:
      actions: write      # Required to dispatch enabled follow-up workflows
      contents: write     # Required to push deployment tracking tags
      pull-requests: read # PR changelog in deployment summary
    needs: [deployment_info, validate_models, backup_workspace]
    outputs:
      version: ${{ steps.track-deployment.outputs.version }}
    # Run deployment when ALL conditions are met:
    #   1. Running current workflow/tooling from master
    #   2. Deployment info succeeded (version resolution, plan summary)
    #   3. Validation passed OR skip_validation is true
    #   4. Backup succeeded OR was skipped (backup only runs for prod)
    if: |
      always() &&
      (needs.deployment_info.outputs.is_default_branch != 'false') &&
      (needs.deployment_info.result == 'success') &&
      (needs.validate_models.result == 'success' || inputs.skip_validation) &&
      (needs.backup_workspace.result == 'success' || needs.backup_workspace.result == 'skipped')
    environment: ${{ fromJSON('{"dev":"develop","test":"staging","preprod":"preprod","prod":"production"}')[inputs.environment] }}
    env:
      TOKEN_GOODDATA: ${{ secrets.TOKEN_GOODDATA }}
      ENV_LABEL: ${{ inputs.environment == 'prod' && '🔴 PRODUCTION' || '🟠 PREPROD' }}

    steps:
      - name: Pre-deployment Status
        run: |
          if [[ "${{ inputs.skip_validation }}" == "true" ]]; then
            echo "⚠️ WARNING: Model validation was skipped for $ENV_LABEL deployment!"
            echo "::warning::Pre-deployment model validation was skipped - proceeding without validation"
          else
            echo "✅ Model validation completed successfully for $ENV_LABEL"
            echo "Validation result: ${{ needs.validate_models.outputs.validation_result }}"
            echo "Critical issues: ${{ needs.validate_models.outputs.critical_issues_found }}"
          fi

      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          # Strings ('0'/'1') avoid the GHA ternary trap where a falsy "true" branch
          # (the bare `0`) collapses to the `|| 1` fallback, silently giving depth 1.
          fetch-depth: ${{ inputs.hotfix_ref != '' && '0' || '1' }}
          fetch-tags: true  # Tags for version management; full history for candidate validation
          # A hotfix's full history without contents; the restore below fetches
          # the version's files itself.
          filter: ${{ inputs.hotfix_ref != '' && 'blob:none' || '' }}

      - name: Setup Python Environment
        uses: ./.github/actions/setup_python
        with:
          github_token: ${{ secrets.TOKEN_GITHUB_GDCLOUD }}

      - name: Load Configuration
        uses: ./.github/actions/load_config
        id: config
        with:
          environment: ${{ inputs.environment }}
          data_product_id: ${{ inputs.data_product_id }}
          keys: "master_workspace_id,slack_webhook_variable"

      - name: Checkout Data Product at Specific Version
        if: ${{ inputs.version != '' || inputs.hotfix_ref != '' }}
        env:
          RAW_VERSION: ${{ inputs.version }}
          HOTFIX_REF: ${{ inputs.hotfix_ref }}
          CANDIDATE_SHA: ${{ needs.deployment_info.outputs.candidate_sha }}
          DATA_PRODUCT_ID: ${{ inputs.data_product_id }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [[ -n "$RAW_VERSION" ]]; then
            CONTENT_REF="$(echo -n "$RAW_VERSION" | xargs)"
            if [[ ! "$CONTENT_REF" =~ ^v[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
              echo "❌ Invalid version format: $CONTENT_REF" && exit 1
            fi
          else
            git fetch origin "refs/heads/$HOTFIX_REF:refs/remotes/origin/$HOTFIX_REF"
            if ! git merge-base --is-ancestor "$CANDIDATE_SHA" "origin/$HOTFIX_REF"; then
              echo "❌ $HOTFIX_REF no longer contains planned candidate $CANDIDATE_SHA"
              exit 1
            fi
            CONTENT_REF="$CANDIDATE_SHA"
          fi
          # Deploy scope from the single Python definition — a hand-copied
          # list here would drift from what the pin/baseline check covers
          readarray -t SCOPE < <(python -c "import os; from gdcloud.version_manager import hotfix_scope_paths; print('\n'.join(hotfix_scope_paths(os.environ['DATA_PRODUCT_ID'])))")
          # readarray swallows the substituted process's exit code — an import
          # failure would otherwise surface as a bogus "DP missing at version"
          if [[ ${#SCOPE[@]} -eq 0 ]]; then
            echo "❌ Could not resolve the hotfix scope from version_manager (python failed above)" && exit 1
          fi
          echo "🔄 Restoring $DATA_PRODUCT_ID deployment content from $CONTENT_REF for ${{ inputs.environment }}"
          # One fetch for a blobless hotfix checkout; the existence checks
          # below would otherwise fetch each single file on its own.
          .github/scripts/prefetch_blobs.sh "$CONTENT_REF" "${SCOPE[@]}"
          # Paths may postdate old tags; `git checkout <tag> --` aborts on any
          # missing pathspec, so restore only what exists at the tag
          PRESENT=()
          for path in "${SCOPE[@]}"; do
            if git cat-file -e "$CONTENT_REF:${path%/}" 2>/dev/null; then
              PRESENT+=("$path")
            else
              echo "::warning::$path does not exist at $CONTENT_REF — deploying without it"
            fi
          done
          if [[ ! " ${PRESENT[*]} " == *" gd_data_product/${DATA_PRODUCT_ID}/ "* ]]; then
            echo "❌ gd_data_product/${DATA_PRODUCT_ID}/ does not exist at $CONTENT_REF" && exit 1
          fi
          # rm-then-restore: checkout alone never DELETES files added since
          # the tag — without the rm, a staging refresh between the preprod
          # and prod legs would leak new unreleased files into the prod deploy
          git rm -rq --ignore-unmatch -- "${SCOPE[@]}"
          git checkout "$CONTENT_REF" -- "${PRESENT[@]}"
          echo "✅ $DATA_PRODUCT_ID + common config restored from $CONTENT_REF"
          echo "   Workflow tooling remains at $REF_NAME"

      # Re-run the promotion guard next to the actual upload: 'Re-run failed
      # jobs' re-executes this job against deployment_info's STALE outputs, so
      # a promotion rejected weeks ago (prod has since moved on) must not
      # deploy on the strength of the original run's validation.
      - name: Re-verify promotion before upload
        if: ${{ needs.deployment_info.outputs.is_hotfix_promotion == 'true' }}
        uses: ./.github/actions/version_management
        with:
          action: validate_hotfix_promotion
          data_product_id: ${{ inputs.data_product_id }}
          version: ${{ inputs.version }}
          skip_setup: 'true'

      - name: Create Hotfix Tag
        id: hotfix-version
        if: ${{ inputs.hotfix_ref != '' && inputs.version == '' }}
        uses: ./.github/actions/version_management
        with:
          action: create_hotfix_tag
          data_product_id: ${{ inputs.data_product_id }}
          ref: ${{ needs.deployment_info.outputs.candidate_sha }}
          github_token: ${{ secrets[steps.config.outputs.github_token_variable] }}
          skip_setup: 'true'

      - name: Deploy new version of ${{ inputs.data_product_id }} to GoodData
        timeout-minutes: 20
        run: |
          gd-upload \
          --environment "${{ inputs.environment }}" \
          --data-product-id "${{ inputs.data_product_id }}" \
          --branch "${{ steps.config.outputs.default_branch }}"

      - name: Track Deployment
        id: track-deployment
        uses: ./.github/actions/version_management
        with:
          action: track_deployment
          environment: ${{ inputs.environment }}
          data_product_id: ${{ inputs.data_product_id }}
          version: ${{ steps.hotfix-version.outputs.version || needs.deployment_info.outputs.version }}
          github_token: ${{ secrets[steps.config.outputs.github_token_variable] }}
          skip_setup: 'true'

      # Keep the version and command in the message: `gh run view` drops the
      # annotation title. Emit only after deployment tracking succeeds so
      # "ready for prod" means preprod actually passed.
      - name: Surface hotfix promotion command
        if: ${{ steps.hotfix-version.outputs.version != '' }}
        env:
          MINTED: ${{ steps.hotfix-version.outputs.version }}
          DATA_PRODUCT_ID: ${{ inputs.data_product_id }}
          # Not a literal 'master': branch_gate above rejects any ref that is
          # not the CONFIGURED default, so a hardcoded ref hands the operator a
          # command their own gate refuses.
          DEFAULT_BRANCH: ${{ steps.config.outputs.default_branch }}
        run: |
          echo "::notice title=Hotfix ready for prod::$MINTED passed preprod for $DATA_PRODUCT_ID. Promote with: gh workflow run 5_manual_deployment_prod.yml --ref $DEFAULT_BRANCH -f environment=prod -f data_product_id=$DATA_PRODUCT_ID -f version=$MINTED"

      - name: Post-deployment Summary
        uses: ./.github/actions/deployment_summary
        with:
          phase: post
          environment: ${{ inputs.environment }}
          data_product_id: ${{ inputs.data_product_id }}
          version: ${{ steps.track-deployment.outputs.version }}
          deployment_tag: ${{ steps.track-deployment.outputs.deployment_tag }}

      # Customer notification comes BEFORE the auxiliary triggers below: a failed
      # trigger must never suppress the customer-releases announcement (run
      # 29321044657: DB-export trigger failed -> Notify Slack skipped).
      - name: Notify Slack
        if: success() && inputs.environment == 'prod'
        continue-on-error: true
        uses: ./.github/actions/notify_release
        with:
          webhook_url: ${{ secrets[steps.config.outputs.slack_webhook_deploy_variable] }}
          header: "🚀 ${{ inputs.data_product_id }} - Production Release - ${{ steps.track-deployment.outputs.version }}"
          data_product: ${{ inputs.data_product_id }}
          validation: ${{ inputs.skip_validation && '⚠️ Skipped' || '✅ Passed' }}

      # Auxiliary follow-ups (report + metadata export) are fire-and-forget:
      # the deployment already succeeded, so their failure must not fail the run.
      - name: Trigger Version Comparison Report
        if: ${{ success() && github.repository != '__gdcloud_disabled__' }}
        continue-on-error: true
        uses: ./.github/actions/trigger_version_comparison
        with:
          data_product_id: ${{ inputs.data_product_id }}
          environment: ${{ inputs.environment }}
          trigger_reason: "${{ inputs.environment }} deployment (Workflow 5)"
          default_branch: ${{ steps.config.outputs.default_branch }}
          github_token: ${{ secrets[steps.config.outputs.github_token_variable] }}

      # Self-scoping + coalescing: the export resolves which DPs are stale for
      # this env, so a multi-DP release fan-out refreshes exactly the changed
      # DPs in one run instead of queuing one dispatch per DP. No per-DP arg.
      - name: Trigger DB Export
        if: ${{ success() && github.repository == '__gdcloud_disabled__' }}
        continue-on-error: true
        uses: ./.github/actions/trigger_db_export
        with:
          environment: ${{ inputs.environment }}
          default_branch: ${{ steps.config.outputs.default_branch }}
          github_token: ${{ secrets[steps.config.outputs.github_token_variable] }}

      # Hotfix branches are ephemeral: once preprod mints the patch tag, the
      # branch has served its purpose — that immutable tag carries the content,
      # and prod promotes it tag-only (no branch needed). Reaping here (rather
      # than after prod) also cleans up hotfixes that never get promoted, since
      # preprod runs far more often than prod. Best-effort (the branch ruleset
      # must permit the delete); a leftover branch is only cosmetic.
      # Trade-off: "Re-run all jobs" on an already-successful preprod run fails
      # (the branch is gone, so 'Fetch hotfix candidate' errors) — it fails safe
      # (no deploy), and the fix is to re-run gd-hotfix to recreate the branch.
      - name: Delete hotfix branch after preprod
        if: success() && inputs.environment == 'preprod' && inputs.hotfix_ref != ''
        continue-on-error: true
        env:
          REF_NAME: ${{ inputs.hotfix_ref }}
          CANDIDATE_SHA: ${{ needs.deployment_info.outputs.candidate_sha }}
        run: |
          # Lease against the deployed candidate: the patch tag was minted at
          # this SHA, so if the branch advanced after the plan was pinned
          # (a follow-up commit), keep it — the new tip isn't yet tested.
          git fetch -q origin "refs/heads/$REF_NAME:refs/remotes/origin/$REF_NAME" || true
          BRANCH_SHA="$(git rev-parse --verify --quiet "origin/$REF_NAME" || true)"
          if [[ -z "$BRANCH_SHA" ]]; then
            echo "ℹ️ $REF_NAME already gone"
          elif [[ "$BRANCH_SHA" != "$CANDIDATE_SHA" ]]; then
            echo "::warning::$REF_NAME moved past the deployed candidate — keeping the branch"
          else
            git push origin --delete "$REF_NAME" \
              && echo "🧹 Deleted $REF_NAME (content lives on in the patch tag)" \
              || echo "::warning::Could not delete $REF_NAME — remove it manually"
          fi

  # Resolve translation-enabled DPs without coupling this read-only gate to deploy.
  translations_scope:
    needs: deploy_workspace
    if: ${{ always() && needs.deploy_workspace.result == 'success' && inputs.environment == 'prod' }}
    runs-on: ubuntu-latest
    outputs:
      data_products: ${{ steps.scope.outputs.data_products }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false  # read-only job (reads config.yml, never pushes)

      - name: Setup Python Environment
        uses: ./.github/actions/setup_python
        with:
          github_token: ${{ secrets.TOKEN_GITHUB_GDCLOUD }}

      - name: Resolve translation scope
        id: scope
        run: |
          python - <<'PY'
          import json, os
          from gdcloud.utils.config import get_translations_data_products
          dps = get_translations_data_products()
          print("Translation-enabled data products:", dps)
          with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
              fh.write("data_products=" + json.dumps(dps) + "\n")
          PY

  # After a successful PROD deployment, emit the en-US translation delta — the
  # source strings that still lack a translation (coverage-based, Model B) — and
  # publish it as an artifact for the translation team to pick up. Delegated to the
  # standalone reusable ops_translation_delta.yml (also runnable by hand with a chosen version) so
  # emit lives in exactly one place. Read-only + local: extraction reads the
  # checked-out data product model and coverage comes from the committed
  # <lang>_translated.yml, so this needs NO GoodData credentials and commits nothing
  # back; the delta + version-stamped frozen sources upload as an artifact.
  # It still needs the dependency credential: the callee's `setup_python`
  # reads it for the private dependency pins, and a called workflow receives no
  # caller secrets by default. Map only that credential to the callee's fixed
  # contract instead of exposing unrelated deployment credentials.
  generate_translations:
    needs: [deployment_info, deploy_workspace, translations_scope]
    if: ${{ always() && needs.deploy_workspace.result == 'success' && inputs.environment == 'prod' && contains(fromJSON(needs.translations_scope.outputs.data_products || '[]'), inputs.data_product_id) }}
    uses: ./.github/workflows/ops_translation_delta.yml
    with:
      data_product_id: ${{ inputs.data_product_id }}
      version: ${{ needs.deploy_workspace.outputs.version }}
    secrets:
      dependency_token: ${{ secrets.TOKEN_GITHUB_GDCLOUD }}
