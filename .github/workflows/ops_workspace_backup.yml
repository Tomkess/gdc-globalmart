# Generated by `gd-workflows adopt`; edit config.yml or gd-cloud-tooling,
# not this package-owned workflow. Re-run `make dev` after a pin change.
name: "@ Workspace Backup"
run-name: "Workspace Backup [${{ inputs.data_product_id }}] @ ${{ inputs.environment }}"

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        type: choice
        # gd-workflows: environment-options all
        options:
          - 'dev'
          - 'test'
          - 'preprod'
          - 'prod'
        default: 'dev'
      data_product_id:
        description: 'Data product to backup'
        required: true
        type: choice
        options:
          - 'globalmart'
        default: 'globalmart'
      workspace_ids:
        description: 'Workspace IDs to backup (comma-separated). Leave empty for defaults (master + clone if enabled)'
        required: false
        type: string
        default: ''

  workflow_call:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        type: string
      data_product_id:
        description: 'Data product to backup'
        required: true
        type: string
      workspace_ids:
        description: 'Workspace IDs to backup (comma-separated). Leave empty for defaults (master + clone if enabled)'
        required: false
        type: string
        default: ''

jobs:
  backup_workspaces:
    runs-on: ubuntu-latest
    environment:
      name: ${{ fromJSON('{"dev":"develop","test":"staging","preprod":"preprod","prod":"production"}')[inputs.environment] }}
      deployment: false

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Python Environment
        uses: ./.github/actions/setup_python
        with:
          github_token: ${{ secrets.TOKEN_GITHUB_GDCLOUD }}

      - name: Load Configuration
        uses: ./.github/actions/load_config
        id: config
        with:
          environment: ${{ inputs.environment }}
          data_product_id: ${{ inputs.data_product_id }}

      - name: Backup Workspaces
        env:
          TOKEN_GOODDATA: ${{ secrets.TOKEN_GOODDATA }}
          ENVIRONMENT: ${{ inputs.environment }}
          DATA_PRODUCT_ID: ${{ inputs.data_product_id }}
          WORKSPACE_IDS: ${{ inputs.workspace_ids }}
        run: |
          if [[ -n "$WORKSPACE_IDS" ]]; then
            gd-backup \
              --environment "$ENVIRONMENT" \
              --workspace-id "$WORKSPACE_IDS" \
              --output-dir backups
          else
            gd-backup \
              --environment "$ENVIRONMENT" \
              --all \
              --data-product-id "$DATA_PRODUCT_ID" \
              --output-dir backups
          fi

      - name: Upload Backup Artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: workspace-backup-${{ inputs.environment }}-${{ inputs.data_product_id }}-${{ github.run_number }}-${{ github.run_attempt }}
          path: backups/
          retention-days: 30
          if-no-files-found: warn

      - name: Generate Summary
        if: always()
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          DATA_PRODUCT_ID: ${{ inputs.data_product_id }}
          WORKSPACE_IDS: ${{ inputs.workspace_ids }}
        run: |
          echo "## 📦 Backup Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Environment:** $ENVIRONMENT" >> $GITHUB_STEP_SUMMARY
          echo "- **Data Product:** $DATA_PRODUCT_ID" >> $GITHUB_STEP_SUMMARY

          if [[ -n "$WORKSPACE_IDS" ]]; then
            echo "- **Workspace IDs:** $WORKSPACE_IDS" >> $GITHUB_STEP_SUMMARY
          else
            echo "- **Workspace IDs:** Auto (master + clone if enabled)" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          if ls backups/*.json 1> /dev/null 2>&1; then
            echo "### Backup Files" >> $GITHUB_STEP_SUMMARY
            for f in backups/*.json; do
              echo "- \`$(basename $f)\`" >> $GITHUB_STEP_SUMMARY
            done
          else
            echo "### No Backup Files Created" >> $GITHUB_STEP_SUMMARY
            echo "Workspaces may not exist yet." >> $GITHUB_STEP_SUMMARY
          fi
