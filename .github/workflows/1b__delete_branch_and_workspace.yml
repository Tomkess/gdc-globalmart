# Generated by `gd-workflows adopt`; edit config.yml or gd-cloud-tooling,
# not this package-owned workflow. Re-run `make dev` after a pin change.
name: 1b - Delete development branch and workspace
run-name: "1b - Delete branch [${{ inputs.data_product_id }}] ${{ inputs.branch }} @ ${{ inputs.environment }}"

# Inverse of workflow 1: tears down a feature branch's GoodData workspace AND
# its git branch. Deliberately manual-only and bounded:
#   - dev/test only (prod/preprod excluded — same rationale as workflow 1)
#   - backup-before-delete: the workspace (and its clone, when enabled) is
#     snapshotted and uploaded as an artifact BEFORE anything is destroyed; a
#     hard backup failure stops the job with nothing deleted (mirrors
#     workflow 3's cleanup-feature-workspace)
#   - typed confirmation: `confirm_branch` must exactly match `branch`
#   - default branch is refused: gd-delete refuses the configured default,
#     and an explicit guard also catches bare 'main'/'master' inputs it
#     wouldn't (see the guard step)
on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        type: choice
        # gd-workflows: environment-options dev,test
        options:
          # prod/preprod intentionally excluded — this workflow destroys
          # workspaces and must never target production environments.
          - 'dev'
          - 'test'
        default: 'dev'
      data_product_id:
        description: 'Enter the data_product_id'
        required: true
        type: choice
        options:
          - 'globalmart'
        default: 'globalmart'
      branch:
        description: 'Feature branch suffix to delete (the same value used in workflow 1)'
        required: true
      confirm_branch:
        description: 'Re-type the branch suffix to confirm deletion'
        required: true

  workflow_call:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        type: string
      data_product_id:
        description: 'Enter the data_product_id'
        required: true
        type: string
      branch:
        description: 'Feature branch suffix to delete (the same value used in workflow 1)'
        required: true
        type: string
      confirm_branch:
        description: 'Re-type the branch suffix to confirm deletion'
        required: true
        type: string

# See workflow 3: -u makes a dropped var expand-fail loud instead of silently
# no-op'ing a destructive step.
defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

jobs:
  delete-branch-and-workspace:
    runs-on: ubuntu-latest
    environment: ${{ fromJSON('{"dev":"develop","test":"staging","preprod":"preprod","prod":"production"}')[inputs.environment] }}
    permissions:
      contents: write  # Required to delete the feature branch

    steps:
    # Fail fast on typo before any checkout/setup work. Compared via env: to
    # keep the input out of the shell command line.
    - name: Confirm Branch
      env:
        BRANCH: ${{ inputs.branch }}
        CONFIRM_BRANCH: ${{ inputs.confirm_branch }}
      run: |
        if [[ "$BRANCH" != "$CONFIRM_BRANCH" ]]; then
          echo "::error::Confirmation mismatch — 'confirm_branch' ($CONFIRM_BRANCH) must exactly match 'branch' ($BRANCH). Nothing deleted."
          exit 1
        fi

    # First checkout with default token to get repo content.
    - name: Initial Checkout
      uses: actions/checkout@v7

    - name: Setup Python Environment
      uses: ./.github/actions/setup_python
      with:
        github_token: ${{ secrets.TOKEN_GITHUB_GDCLOUD }}

    - name: Load Configuration
      uses: ./.github/actions/load_config
      id: config
      with:
        environment: ${{ inputs.environment }}
        data_product_id: ${{ inputs.data_product_id }}

    # Second checkout with config token (write access for the branch delete) —
    # wipes .venv/ via git clean -ffdx, hence the reinstall below.
    - name: Checkout With Config Token
      uses: actions/checkout@v7
      with:
        token: ${{ secrets[steps.config.outputs.github_token_variable] }}

    - name: Reinstall Python Environment
      uses: ./.github/actions/setup_python
      with:
        github_token: ${{ secrets.TOKEN_GITHUB_GDCLOUD }}

    - name: Resolve Names and Guard Default Branch
      env:
        DP_ID: ${{ inputs.data_product_id }}
        BRANCH: ${{ inputs.branch }}
        DEFAULT_BRANCH: ${{ steps.config.outputs.default_branch }}
      run: |
        # gd-delete refuses only the *configured* default branch, so the
        # main/master literals catch inputs it would let through — e.g.
        # branch=main with default=master resolves to a deletable
        # '<master_ws>--main' workspace. The git-branch delete below needs no
        # guard: its target is always '{dp}--'-prefixed and can never equal a
        # bare protected branch.
        for reserved in "$DEFAULT_BRANCH" main master; do
          if [[ "$BRANCH" == "$reserved" ]]; then
            echo "::error::Refusing to delete the default/protected branch '$BRANCH'. This workflow is for feature branches only."
            exit 1
          fi
        done
        # Workflow 1 pushes the combined '{dp}--{suffix}' git branch; the
        # workspace is resolved by gd-delete from the suffix + config.
        echo "combined_branch=${DP_ID}--${BRANCH}" >> "$GITHUB_ENV"

    # Snapshot BEFORE deleting. Same backup-before-destroy safety net as
    # workflow 3's cleanup-feature-workspace: gd-backup's branch path covers
    # the clone too (gd-delete destroys both); a hard backup failure stops the
    # job before gd-delete runs; a non-existent workspace is a skip (exit 0).
    - name: Backup Feature Workspace (pre-delete safety net)
      id: backup
      env:
        TOKEN_GOODDATA: ${{ secrets.TOKEN_GOODDATA }}
        ENVIRONMENT: ${{ inputs.environment }}
        DP_ID: ${{ inputs.data_product_id }}
        BRANCH: ${{ inputs.branch }}
      run: |
        gd-backup \
          --environment "$ENVIRONMENT" \
          --data-product-id "$DP_ID" \
          --branch "$BRANCH" \
          --output-dir backups

    - name: Upload Feature Workspace Backup
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: feature-workspace-backup-${{ inputs.environment }}-${{ inputs.data_product_id }}-${{ github.run_number }}-${{ github.run_attempt }}
        path: backups/
        retention-days: 30
        if-no-files-found: warn

    - name: Delete Feature Workspace
      id: delete_workspace
      env:
        TOKEN_GOODDATA: ${{ secrets.TOKEN_GOODDATA }}
        ENVIRONMENT: ${{ inputs.environment }}
        DP_ID: ${{ inputs.data_product_id }}
        BRANCH: ${{ inputs.branch }}
      run: |
        gd-delete \
          --environment "$ENVIRONMENT" \
          --data-product-id "$DP_ID" \
          --branch "$BRANCH" \
          --yes

    - name: Delete Git Branch
      id: delete_git
      run: |
        if git ls-remote --exit-code --heads origin "$combined_branch" >/dev/null 2>&1; then
          git push origin --delete "$combined_branch"
          echo "Deleted git branch: $combined_branch"
        else
          echo "Git branch '$combined_branch' does not exist on origin — nothing to delete."
        fi

    - name: Generate Summary
      if: always()
      env:
        DP_ID: ${{ inputs.data_product_id }}
        ENVIRONMENT: ${{ inputs.environment }}
        BRANCH: ${{ inputs.branch }}
        BACKUP: ${{ steps.backup.outcome }}
        DELETE_WS: ${{ steps.delete_workspace.outcome }}
        DELETE_GIT: ${{ steps.delete_git.outcome }}
      run: |
        # Render the branch from inputs (not $combined_branch from $GITHUB_ENV):
        # this step is always() and must not depend on the Resolve Names step
        # having run — under set -u an unset combined_branch would crash here.
        # Outcomes ('skipped' covers "an earlier step failed") keep the summary
        # honest when the teardown stopped partway.
        status() {
          case "$1" in
            success) echo "✅ done" ;;
            failure) echo "❌ failed" ;;
            *)       echo "⏭️ not run" ;;
          esac
        }
        {
          echo "## 🗑️ Teardown Summary"
          echo ""
          echo "| | |"
          echo "|---|---|"
          echo "| **Environment** | $ENVIRONMENT |"
          echo "| **Data Product** | \`$DP_ID\` |"
          echo "| **Branch** | \`${DP_ID}--${BRANCH}\` |"
          echo "| **Workspace backup** | $(status "$BACKUP") |"
          echo "| **Workspace delete** | $(status "$DELETE_WS") |"
          echo "| **Git branch delete** | $(status "$DELETE_GIT") |"
          if [[ "$BACKUP" == "success" ]]; then
            echo ""
            echo "_Workspace backup uploaded as an artifact (30-day retention) before deletion._"
          fi
        } >> "$GITHUB_STEP_SUMMARY"
