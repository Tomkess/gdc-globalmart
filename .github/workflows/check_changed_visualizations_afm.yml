# Generated by `gd-workflows adopt`; edit config.yml or gd-cloud-tooling,
# not this package-owned workflow. Re-run `make dev` after a pin change.
name: Changed Visualizations AFM Smoke

# Runs `gd-validate afm insight --source changed` against dev on every
# PR that touches a data-product visualization YAML. Executes each changed
# insight's REAL AFM (built from local YAML) against the feature workspace and
# fails on any that won't load — "object is not comparable to ...", broken
# refs, MAQL errors, etc. This is the backend ground-truth tier complementing
# the OFFLINE `objects_not_comparable` check (in check_ci_checks.yml), which is
# a high-precision LDM-reachability approximation; this catches what the offline
# graph can't (e.g. dimension conformance a FlexConnect compute service
# applies at runtime).
#
# Sibling of check_changed_metrics_afm.yml — same gate + feature-workspace
# targeting. visualization-smoke takes a single --data-product-id (no multi-DP
# nargs), so the run step loops the resolved DP list.
#
# Net-new insights only exist in the feature workspace until the master deploy
# runs, so the command targets '{dp}_master--<suffix>' via --branch and SKIPS
# (exit 0) on non-DP branches or an undeployed/absent workspace — no false reds.

# NOTE: do NOT add `paths:` here. GitHub evaluates trigger-level path filters
# against the synchronize push delta, not the PR's full diff vs base — after a
# rebase that doesn't re-touch visualizations in the new push the workflow would
# silently skip even when the PR carries visualization changes overall (PR #1075
# regression). The path-aware gate below via `check_pr_paths` queries the PR's
# full diff and short-circuits cheaply.
on:
  pull_request:
    types: [opened, synchronize, reopened]

  workflow_call:

jobs:
  # Cheap gate on every PR; exposes `changed` to the downstream job. The
  # two-job layout gives the downstream job a true "Skipped" status on PRs
  # without visualization changes (mirrors check_changed_metrics_afm.yml).
  # Gate mechanics live in pr_path_gate.yml.
  gate:
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/pr_path_gate.yml
    permissions:
      contents: read       # Ceiling for the called workflow's token
    with:
      patterns: '^gd_data_product/[^/]+/analytics_model/visualization_objects/.+\.yaml$'

  viz-smoke:
    needs: gate
    if: github.event_name == 'pull_request' && needs.gate.outputs.changed == 'true'
    runs-on: ubuntu-latest
    environment:
      name: ${{ fromJSON('{"dev":"develop","test":"staging","preprod":"preprod","prod":"production"}')['dev'] }}
      deployment: false
    permissions:
      contents: read
    env:
      # CI=true suppresses interactive prompts in shared helpers; the run step
      # supplies --env and --data-product-id explicitly so none fire anyway
      # (defensive, matches the other PR-time workflows).
      CI: true

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0       # --source changed needs git diff vs base
          filter: blob:none

      - name: Setup Python Environment
        uses: ./.github/actions/setup_python
        with:
          github_token: ${{ secrets.TOKEN_GITHUB_GDCLOUD }}

      - name: Load Configuration
        id: config
        uses: ./.github/actions/load_config
        with:
          environment: dev
        # --source changed needs only core deps (requests + gooddata-sdk + git);
        # the metadata-DB build is only on the not-comparable source, not here.

      # Resolve affected DPs: branch primary DP ∪ DPs from PR diff. The gate
      # guaranteed at least one visualization YAML changed, so at least one DP
      # surfaces here (every visualization lives under gd_data_product/<dp>/).
      - name: Detect affected data products
        id: dps
        uses: ./.github/actions/detect_dp_changes

      # BASE_REF / HEAD_REF lifted to env: so user-controlled values don't reach
      # `run:` via direct GH expression interpolation (security hardening).
      #
      # HEAD_REF is the PR's source branch (e.g. 'sibling_dp--feature').
      # pull_request checkouts are detached HEAD, so passing --branch explicitly
      # routes the workspace to '{dp}_master--<suffix>' (the feature workspace)
      # rather than the parent. On a non-DP branch the resolve lands on the
      # parent and visualization-smoke skips (exit 0) in --source changed mode.
      #
      # visualization-smoke is single-DP (no --data-product-all / nargs), so we
      # loop the resolved DP list; `rc` remembers any DP that fails while the
      # loop continues, so every affected DP is reported in one run.
      - name: Visualization smoke on changed insights
        env:
          TOKEN_GOODDATA: ${{ secrets.TOKEN_GOODDATA }}
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
          DP_LIST: ${{ steps.dps.outputs.dp_list }}
        run: |
          if [[ -z "$DP_LIST" ]]; then
            echo "::error::gate passed (changed=true) but detect_dp_changes resolved zero DPs"
            exit 1
          fi
          rc=0
          for DP in $DP_LIST; do
            echo "::group::afm insight ${DP}"
            gd-validate afm insight --source changed \
              --base-branch "$BASE_REF" \
              --branch "$HEAD_REF" \
              --env dev \
              --data-product-id "$DP" || rc=1
            echo "::endgroup::"
          done
          exit $rc

      - name: Show fix instructions if check fails
        if: failure()
        run: |
          echo "Visualization AFM smoke on changed insights FAILED."
          echo ""
          echo "A visualization you touched won't load against dev — most often"
          echo "'object is not comparable to ...' (a measure sliced/filtered by a"
          echo "dimension its fact dataset can't reach in the LDM, e.g. a date-dim"
          echo "swap), or a broken reference / MAQL error."
          echo ""
          echo "Reproduce locally (needs your {dp}--<suffix> feature workspace deployed):"
          echo "  gd-validate afm insight --source changed --env dev --data-product-id <dp>"
          echo ""
          echo "Offline pre-gates (no workspace needed):"
          echo "  gd-ci run --check objects_not_comparable --data-product-id <dp>"
          echo "  gd-ci run --check objects_non_existent   --data-product-id <dp>"
