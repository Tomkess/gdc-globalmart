# Generated by `gd-workflows adopt`; edit config.yml or gd-cloud-tooling,
# not this package-owned workflow. Re-run `make dev` after a pin change.
name: 1 - Create new development branch
run-name: "1 - Create branch [${{ inputs.data_product_id }}] ${{ inputs.branch }} @ ${{ inputs.environment }}"

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        type: choice
        # gd-workflows: environment-options dev,test
        options:
          # Note: prod/preprod intentionally excluded - this workflow creates
          # new workspaces and should not run against production environments
          - 'dev'
          - 'test'
        default: 'dev'
      data_product_id:
        description: 'Enter the data_product_id'
        required: true
        type: choice
        options:
          - 'globalmart'
        default: 'globalmart'
      branch:
        description: 'Enter the name of the new branch to create'
        required: true

  workflow_call:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        type: string
      data_product_id:
        description: 'Enter the data_product_id'
        required: true
        type: string
      branch:
        description: 'Enter the name of the new branch to create'
        required: true
        type: string

jobs:

  create-and-run:
    runs-on: ubuntu-latest
    environment: ${{ fromJSON('{"dev":"develop","test":"staging","preprod":"preprod","prod":"production"}')[inputs.environment] }}
    permissions:
      contents: write  # Required to create and push the feature branch

    steps:
    # First checkout with default token to get content of repo
    - name: Initial Checkout
      uses: actions/checkout@v7

    - name: Setup Python Environment
      uses: ./.github/actions/setup_python
      with:
        github_token: ${{ secrets.TOKEN_GITHUB_GDCLOUD }}

    - name: Load Configuration
      uses: ./.github/actions/load_config
      id: config
      with:
        keys: 'host,master_workspace_id'
        environment: ${{ inputs.environment }}
        data_product_id: ${{ inputs.data_product_id }}

    # Second checkout with config token - wipes .venv/ via git clean -ffdx
    - name: Checkout With Config Token
      uses: actions/checkout@v7
      with:
        token: ${{ secrets[steps.config.outputs.github_token_variable] }}

    - name: Reinstall Python Environment
      uses: ./.github/actions/setup_python
      with:
        github_token: ${{ secrets.TOKEN_GITHUB_GDCLOUD }}

    - name: Ensure Main Branch Checkout
      env:
        DEFAULT_BRANCH: ${{ steps.config.outputs.default_branch }}
      run: |
        # Checkout main branch explicitly
        git checkout "$DEFAULT_BRANCH"

    - name: Set Inputs and Construct Branch Name
      # Inputs via env: so their values reach the shell as data, never expanded
      # into the script text (closes zizmor template-injection at the point taint
      # enters — this step, not the reads that consume $GITHUB_ENV downstream).
      env:
        ENVIRONMENT: ${{ inputs.environment }}
        DATA_PRODUCT_ID: ${{ inputs.data_product_id }}
        BRANCH: ${{ inputs.branch }}
      run: |
        {
          echo "environment=$ENVIRONMENT"
          echo "data_product_id=$DATA_PRODUCT_ID"
          echo "branch=$BRANCH"
          # Combined '{dp}--{suffix}' branch name (delimiter '--').
          echo "combined_branch=${DATA_PRODUCT_ID}--${BRANCH}"
        } >> "$GITHUB_ENV"

    # Before anything is created: a bad name (a second '--', another data
    # product's id, unsafe characters, a workspace id too long) or a branch
    # that already exists stops here, with the reason on the run page.
    - name: Validate Branch Name
      run: gd-detect-dp --validate-branch "$combined_branch" --environment "$environment" --remote origin

    - name: Set Git Identity
      env:
        ACTOR: ${{ github.actor }}
      run: |
        git config --global user.email "${ACTOR}@users.noreply.github.com"
        git config --global user.name "${ACTOR}"

    - name: Create New Branch
      run: |
        # Quoted: combined_branch derives from the free-text `branch` input,
        # so an unquoted expansion word-splits and globs instead of failing.
        git checkout -b "$combined_branch"
        git push origin "$combined_branch"

    - name: Run deploy script
      timeout-minutes: 20
      env:
        TOKEN_GOODDATA: ${{ secrets.TOKEN_GOODDATA }}
      run: |
        gd-upload \
        --environment "$environment" \
        --data-product-id "$data_product_id" \
        --branch "$branch"

    # Keep this LAST. Do not move it earlier hoping to surface the target before
    # the slow deploy — it won't work: GitHub finalizes the job summary (and
    # annotations) only at job completion, never live, so the step's position
    # has zero effect on when the summary appears. Last is also the only correct
    # spot: "Created Resources" is truthful only after the branch push +
    # gd-upload have actually succeeded (a failure short-circuits the summary).
    - name: Generate Workflow Summary
      env:
        HOST: ${{ steps.config.outputs.host }}
        MASTER_WORKSPACE_ID: ${{ steps.config.outputs.master_workspace_id }}
        DEFAULT_BRANCH: ${{ steps.config.outputs.default_branch }}
      run: |
        # Construct workspace_id based on branch type
        if [[ "$branch" == "$DEFAULT_BRANCH" ]] || [[ "$branch" == "main" ]] || [[ "$branch" == "master" ]]; then
          WORKSPACE_ID="$MASTER_WORKSPACE_ID"
        else
          WORKSPACE_ID="${MASTER_WORKSPACE_ID}--${branch}"
        fi

        DASHBOARD_URL="${HOST}/dashboards/#/workspace/${WORKSPACE_ID}"

        # Label + value on separate lines so the value sits alone on its row —
        # selecting that row grabs exactly the branch / workspace id, with no
        # label prefix.
        {
          echo "## 🚀 Deployment Summary"
          echo ""
          echo "### Created Resources"
          echo ""
          echo "**GitHub Branch:**"
          echo "\`${combined_branch}\`"
          echo ""
          echo "**Workspace ID:**"
          echo "\`${WORKSPACE_ID}\`"
          echo ""
          echo "**Dashboard Link:**"
          echo "[${WORKSPACE_ID}](${DASHBOARD_URL})"
        } >> "$GITHUB_STEP_SUMMARY"
