# Generated by `gd-workflows adopt`; edit config.yml or gd-cloud-tooling,
# not this package-owned workflow. Re-run `make dev` after a pin change.
name: Skills Contract Check

# NOTE: do NOT add `paths:` here. GitHub evaluates trigger-level path filters
# against the synchronize push delta, not the PR's full diff vs base, so a
# rebase that doesn't re-touch skills/ would silently skip the job. The
# path-aware gate is implemented in the engine via `check_pr_paths`.
on:
  pull_request:
    types: [opened, synchronize, reopened]

  workflow_call:

jobs:
  # A project with no skills/ directory still gets a green check: the command
  # no-ops. Gate mechanics live in pr_path_gate.yml.
  gate:
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/pr_path_gate.yml
    permissions:
      contents: read       # Ceiling for the called workflow's token
    with:
      # config.yml too: it holds skills.family_categories, which the check reads.
      patterns: '^skills/|^config\.yml$|^\.github/workflows/(gdcloud__)?check_skills\.yml$'

  check-skills:
    needs: gate
    if: github.event_name == 'pull_request' && needs.gate.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Python Environment
        uses: ./.github/actions/setup_python
        with:
          github_token: ${{ secrets.TOKEN_GITHUB_GDCLOUD }}

      - name: Validate the skills contract
        run: gd-skills check skills

      - name: Show fix instructions if the contract is violated
        if: failure()
        run: |
          echo "Run this locally to see the same output:"
          echo "  uv run gd-skills check skills"
