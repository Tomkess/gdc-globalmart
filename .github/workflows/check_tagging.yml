# Generated by `gd-workflows adopt`; edit config.yml or gd-cloud-tooling,
# not this package-owned workflow. Re-run `make dev` after a pin change.
name: Tagging Check

# NOTE: do NOT add `paths:` here. GitHub evaluates trigger-level path filters
# against the synchronize push delta, not the PR's full diff vs base — after
# a rebase that doesn't re-touch the gated paths in the new push, the workflow
# would silently skip even when the PR carries those changes overall (see PR
# #1075 for the model_validation regression). The path-aware gate is
# implemented below via `check_pr_paths`, which queries the PR's full diff
# and short-circuits cheaply.
#
# If your project ships its own tagging SQL views or tagging plugin code
# in-repo, extend the `patterns:` regex below so edits to them re-run this
# check too.
on:
  pull_request:
    types: [opened, synchronize, reopened]

  workflow_call:

jobs:
  # Cheap gate that runs on every PR and exposes `changed` to the downstream
  # `check-tags` job. Two-job layout gives the downstream a true "Skipped"
  # status on irrelevant PRs (collapsed into "X skipped checks") rather than a
  # misleading "Successful in 10s" run.
  #
  # Patterns cover DP tag-bearing YAML and per-DP config.tagging.yml. Gate
  # mechanics live in pr_path_gate.yml.
  gate:
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/pr_path_gate.yml
    permissions:
      contents: read       # Ceiling for the called workflow's token
    with:
      patterns: '^gd_data_product/([^/]+/(analytics_model/(metrics|analytical_dashboards|visualization_objects)|ldm/datasets)/[^/]+\.yaml|([^/]+/)?config\.tagging\.yml)$'

  check-tags:
    needs: gate
    # Runs on relevant changes and on a gate that did not succeed; skips only
    # when the gate ran and found nothing relevant.
    if: ${{ !cancelled() && github.event_name == 'pull_request' && (needs.gate.result != 'success' || needs.gate.outputs.changed == 'true') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      # A gate that failed to check out or resolve the diff must fail this
      # required status, not skip it: GitHub counts a skipped required check
      # as satisfied, so tagging would pass without running.
      - name: Fail when the path gate did not succeed
        if: needs.gate.result != 'success'
        env:
          GATE_RESULT: ${{ needs.gate.result }}
        run: |
          echo "::error::The path gate ended with '$GATE_RESULT', so the changed files are unknown."
          exit 1

      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0       # detect_dp_changes runs git diff vs base
          filter: blob:none    # Blobless: history only — ~1s vs shallow

      - name: Setup Python Environment
        uses: ./.github/actions/setup_python
        with:
          full_deps: true
          github_token: ${{ secrets.TOKEN_GITHUB_GDCLOUD }}

      # Resolve affected DPs: branch primary DP ∪ DPs from PR diff. A
      # `example_dp--x` PR that also touches `gd_data_product/sibling_dp/`
      # files fans out to both. Tooling-only PRs (tagging code, SQL views) fall
      # through to --data-product-all.
      - name: Detect affected data products
        id: dps
        uses: ./.github/actions/detect_dp_changes

      # Multi-DP uses --data-product-id A B … (nargs='+') to keep work inside
      # one Python process; per-DP iteration happens in tagging/cli.py via
      # args.selected_data_products.
      - name: Check Tags
        env:
          DP_LIST: ${{ steps.dps.outputs.dp_list }}
          HAS_CHANGES: ${{ steps.dps.outputs.has_changes }}
          PYTHONUNBUFFERED: '1'
        run: |
          if [[ "$HAS_CHANGES" != "true" ]]; then
            gd-tagging sync --data-product-all --check
          else
            # shellcheck disable=SC2086  # word-split DP_LIST into separate args
            gd-tagging sync --data-product-id $DP_LIST --check
          fi

      # Tag docs are regenerated post-merge by auto_update_tag_docs.yml,
      # so we don't validate them on PRs.

      - name: Show fix instructions if check fails
        if: failure()
        env:
          DP_LIST: ${{ steps.dps.outputs.dp_list }}
        run: |
          echo "Tag check failed!"
          echo ""
          if [[ -n "$DP_LIST" ]]; then
            echo "Affected data products: $DP_LIST"
            echo ""
            echo "Run this locally to fix:"
            echo "  gd-tagging sync --yes --data-product-id $DP_LIST"
          else
            echo "Affected data products: (all)"
            echo ""
            echo "Run this locally to fix:"
            echo "  gd-tagging sync --yes --data-product-all"
          fi
          echo ""
          echo "Then commit:"
          echo "  git add -A && git commit -m 'Sync tags'"
