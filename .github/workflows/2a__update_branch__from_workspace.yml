# Generated by `gd-workflows adopt`; edit config.yml or gd-cloud-tooling,
# not this package-owned workflow. Re-run `make dev` after a pin change.
name: 2a - Update branch from workspace

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        type: choice
        # gd-workflows: environment-options dev,test
        options:
          # Note: prod/preprod intentionally excluded - this workflow modifies
          # workspaces and should not run against production environments
          - 'dev'
          - 'test'
        default: 'dev'
      source_workspace_id:
        description: '(Optional) Enter source workspace ID'
        required: false

  workflow_call:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        type: string
      source_workspace_id:
        description: '(Optional) Enter source workspace ID'
        required: false
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: ${{ fromJSON('{"dev":"develop","test":"staging","preprod":"preprod","prod":"production"}')[inputs.environment] }}
      deployment: false
    permissions:
      contents: write  # Required to commit and push the exported workspace

    steps:
      # First checkout with default token to get content of repo
      - name: Initial Checkout
        uses: actions/checkout@v7

      - name: Setup Python Environment
        uses: ./.github/actions/setup_python
        with:
          github_token: ${{ secrets.TOKEN_GITHUB_GDCLOUD }}

      - name: Load Configuration
        uses: ./.github/actions/load_config
        id: config
        with:
          environment: ${{ inputs.environment }}

      # Second checkout with config token - wipes .venv/ via git clean -ffdx
      - name: Checkout With Config Token
        uses: actions/checkout@v7
        with:
          token: ${{ secrets[steps.config.outputs.github_token_variable] }}

      - name: Reinstall Python Environment
        uses: ./.github/actions/setup_python
        with:
          github_token: ${{ secrets.TOKEN_GITHUB_GDCLOUD }}

      - name: Require feature branch
        run: |
          if [ -z "${{ steps.config.outputs.branch }}" ]; then
            echo "Error: This workflow only works on feature branches (format: data_product_id--branch_name)"
            echo "Current branch: ${{ steps.config.outputs.branch_name }}"
            exit 1
          fi

      # The env-override revert runs here (see gd-store --help). It never fails this
      # step — discarding the whole store (analytics edits included) over an existing
      # override would cost more than it saves. It only guarantees that an
      # env-specific source is never promoted into the base; whatever it cannot carry
      # over is a job annotation, and the env_override_leaked CI check blocks the PR
      # if a leak reaches the branch anyway.
      - name: Run Deploy Script
        env:
          TOKEN_GOODDATA: ${{ secrets.TOKEN_GOODDATA }}
          # Routed through env rather than interpolated into the script body:
          # source_workspace_id is a free-text dispatch input and this step
          # holds the GoodData token.
          ENVIRONMENT: ${{ inputs.environment }}
          DATA_PRODUCT_ID: ${{ steps.config.outputs.data_product_id }}
          BRANCH: ${{ steps.config.outputs.branch }}
          SOURCE_WORKSPACE_ID: ${{ inputs.source_workspace_id }}
        run: |
          gd-store \
          --environment "$ENVIRONMENT" \
          --data-product-id "$DATA_PRODUCT_ID" \
          --branch "$BRANCH" \
          --source-workspace-id "$SOURCE_WORKSPACE_ID"

      # Only kinds the project already releases: a plain store would create
      # every kind's folder and release it.
      - name: Store org objects
        if: ${{ github.repository == '__gdcloud_disabled__' }}
        env:
          TOKEN_GOODDATA: ${{ secrets.TOKEN_GOODDATA }}
          ENVIRONMENT: ${{ inputs.environment }}
        run: gd-org store --env "$ENVIRONMENT" --scope released

      - name: Set Git Identity
        run: |
          git config --global user.email "${{ github.actor }}@users.noreply.github.com"
          git config --global user.name "${{ github.actor }}"

      - name: Commit and Push Changes
        env:
          BRANCH_NAME: ${{ steps.config.outputs.branch_name }}
        run: |
          git add .
          git commit --allow-empty -m "Automated commit `date +\%Y\%m\%d\%H\%M\%S`"
          git push origin "$BRANCH_NAME"

      - name: Workflow Completed
        run: echo "Deployment completed successfully!"
