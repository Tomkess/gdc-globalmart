# Generated by `gd-workflows adopt`; edit config.yml or gd-cloud-tooling,
# not this package-owned workflow. Re-run `make dev` after a pin change.
name: "@ DB Export"
run-name: >-
  DB Export [${{ inputs.scope == 'stale' && 'STALE' || inputs.data_product_all && 'ALL' || inputs.data_product_ids || inputs.data_product_id }}] @ ${{ inputs.environment }}

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        type: choice
        # gd-workflows: environment-options all
        options:
          # Note: All environments including prod/preprod are safe here - this is
          # a read-only export workflow that doesn't modify any workspace data
          - dev
          - test
          - preprod
          - prod
        default: 'dev'
      data_product_id:
        description: 'Data product ID (ignored on feature branches - auto-detected)'
        required: true
        type: choice
        options:
          - 'globalmart'
        default: 'globalmart'
      data_product_ids:
        # Space- or comma-separated DP IDs (e.g. "example_dp sibling_dp"
        # or "example_dp,sibling_dp"). Used by workflow 3 (which goes
        # through workflow_dispatch via `gh workflow run`) to scope a
        # merge-triggered DB export to just the affected DPs. Most manual
        # runs use the dropdown — leave this blank.
        description: 'OPTIONAL: space- or comma-separated DP IDs to export a subset (overrides data_product_id). Leave blank for manual runs.'
        required: false
        type: string
        default: ''
      data_product_all:
        description: 'Export ALL data products (overrides data_product_id and data_product_ids)'
        required: false
        type: boolean
        default: false
      include_content:
        description: 'Include content column (larger DB, usually not needed)'
        required: false
        type: boolean
        default: false
      publish_pages:
        description: 'Also publish to the configured Pages branch (created on first publish)'
        required: false
        type: boolean
        default: false
      scope:
        # 'stale' = self-scoping: export only the DPs `gd-db-stale` reports as
        # changed since the last export (see its module docstring for how);
        # empty stale set → clean no-op. Dispatched by the trigger_db_export
        # action so a multi-DP release fan-out lands as one run, not one per DP.
        description: "OPTIONAL: 'stale' to export only DPs changed since last export. Leave blank for explicit selection."
        required: false
        type: string
        default: ''

# Global concurrency: exactly one export runs at a time — parallel runs race on
# the gh-pages orphan force-push (each leases the tip it saw at checkout, so the
# loser's --force-with-lease aborts and its DBs are stale). Hence one shared
# group; do NOT split it per DP or per env.
#
# `queue: max` holds every additional dispatch PENDING in FIFO order (up to 100)
# rather than the default `queue: single`, which cancels-and-replaces the pending
# run. That eviction was the cross-environment hazard: a prod dispatch would
# replace a pending test export, and prod can't refresh test. cancel-in-progress
# stays false — and must (queue: max + cancel-in-progress: true is a validation
# error).
  workflow_call:
    inputs:
      environment:
        description: 'Environment (dev, test, prod)'
        required: true
        type: string
      data_product_id:
        description: 'Data product ID (ignored when data_product_all or data_product_ids is set)'
        required: false
        type: string
      data_product_ids:
        description: 'Space- or comma-separated DP IDs (e.g. "example_dp sibling_dp"). workflow_call only.'
        required: false
        type: string
        default: ''
      data_product_all:
        description: 'Export ALL data products'
        required: false
        type: boolean
        default: false
      include_content:
        description: 'Include content column'
        required: false
        type: boolean
        default: false
      publish_pages:
        description: 'Also publish to the configured Pages branch'
        required: false
        type: boolean
        default: true
      scope:
        description: 'OPTIONAL: ''stale'' to export only DPs changed since last export.'
        required: false
        type: string
        default: ''

concurrency:
  # Keep every pending export instead of replacing the previously queued run.
  group: gd-db-export
  cancel-in-progress: false
  queue: max

jobs:
  export:
    # Disabling metadata automation stops post-deploy dispatches, but the
    # workflow remains useful on demand: a manual run defaults to an artifact
    # only and therefore never reads or writes a Pages branch.
    if: ${{ github.event_name == 'workflow_dispatch' || github.repository == '__gdcloud_disabled__' }}
    runs-on: ubuntu-latest
    environment:
      name: ${{ fromJSON('{"dev":"develop","test":"staging","preprod":"preprod","prod":"production"}')[inputs.environment] }}
      deployment: false
    timeout-minutes: 30
    permissions:
      contents: write  # Required for pushing to gh-pages
    env:
      PUBLISH_BRANCH: ${{ '' }}

    steps:
      # First, before checkout or dependency install: both checks read only
      # inputs and job env, so a misconfigured run fails in seconds.
      - name: Validate export mode
        env:
          PUBLISH_PAGES: ${{ inputs.publish_pages }}
          SCOPE: ${{ inputs.scope }}
        run: |
          if [ "${SCOPE}" == "stale" ] && [ "${PUBLISH_PAGES}" != "true" ]; then
            echo "::error::scope='stale' requires publish_pages=true"
            exit 1
          fi
          if [ "${PUBLISH_PAGES}" == "true" ] && [ -z "${PUBLISH_BRANCH}" ]; then
            echo "::error::publish_pages=true requires automation.metadata_export.publish_branch in config.yml; run gd-workflows sync after setting it"
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # Deploy tracking tags (deploy-{env}-{dp}-…) are the "last deployed"
          # signal the stale-scope resolver compares against gh-pages. Tag
          # refs only — no old tree is materialized — so no blob:none needed.
          fetch-tags: ${{ inputs.scope == 'stale' }}

      - name: Setup Python Environment
        uses: ./.github/actions/setup_python
        with:
          full_deps: true
          github_token: ${{ secrets.TOKEN_GITHUB_GDCLOUD }}

      # The first publish creates the branch: nothing has to be seeded by
      # hand, since the frontend ships with gdcloud (gd-pages).
      - name: Check publish branch
        id: ghp-branch
        if: ${{ inputs.publish_pages }}
        run: |
          if git ls-remote --exit-code origin "refs/heads/${PUBLISH_BRANCH}" >/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "ℹ️ ${PUBLISH_BRANCH} does not exist yet — this export creates it"
          fi

      # Checked out early (was after Resolve parameters) so its metadata.json —
      # the "last exported" signal — is available to the stale-scope resolver
      # below. Reused later for the tip snapshot and deploy. A branch that
      # doesn't exist yet checks out the default ref instead, only to give the
      # deploy step a git working tree with push credentials; the deploy then
      # starts the orphan commit from an empty tree.
      - name: Checkout gh-pages branch
        if: ${{ inputs.publish_pages }}
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.ghp-branch.outputs.exists == 'true' && env.PUBLISH_BRANCH || '' }}
          path: gh-pages-deploy
          # Everything but the databases (~500 MB): the commit keeps the ones
          # this export doesn't replace without fetching them (gd-pages --sparse).
          sparse-checkout: |
            /*
            !/data/*/*.db
          sparse-checkout-cone-mode: false

      # Feeds Resolve parameters below as the effective data_product_ids.
      - name: Resolve stale data products
        id: stale
        if: ${{ inputs.publish_pages && inputs.scope == 'stale' }}
        env:
          ENVIRONMENT_INPUT: ${{ inputs.environment }}
        run: |
          DP_IDS="$(gd-db-stale \
            --env "$ENVIRONMENT_INPUT" \
            --metadata gh-pages-deploy/data/metadata.json)"
          echo "dp_ids=${DP_IDS}" >> "$GITHUB_OUTPUT"

      - name: Load Configuration
        uses: ./.github/actions/load_config
        id: config
        with:
          environment: ${{ inputs.environment }}
          # data_product_id passed to load_config only on the true single-DP
          # path. Multi-DP (data_product_ids set) and all-DPs (data_product_all)
          # both leave this empty so load_config doesn't tie the run to a
          # specific DP's config (per-DP overrides for host /
          # master_workspace_id would otherwise leak
          # into a multi-DP run); gd-db handles DP iteration internally.
          #
          # Phrased as `<exclusive-condition> && value || ''` rather than the
          # natural `<inclusive-condition> && '' || value` because GitHub
          # expressions evaluate '' as falsy in `||`, so `cond && '' || value`
          # always returns `value` (the empty branch is unreachable — see
          # actions/runner#2205). Inverting the condition puts the literal
          # at the truthy end where it can actually be returned.
          data_product_id: ${{ inputs.data_product_all == false && inputs.data_product_ids == '' && inputs.scope != 'stale' && inputs.data_product_id || '' }}
          keys: "host,master_workspace_id"

      - name: Resolve parameters
        # Always API mode against the selected environment, regardless of which
        # branch dispatched the workflow. Feature branches behave identically
        # to master (same gd-db invocation, same gh-pages deploy) so workflow
        # changes can be tested end-to-end before merging. Trade-off: a buggy
        # feature-branch run can transiently corrupt gh-pages — re-running
        # from master fixes it via orphan force-push.
        #
        # Precedence: data_product_all > data_product_ids > data_product_id.
        # Subset path sets is_all=true so downstream artifact/deploy steps
        # use their multi-DB code paths (glob output/*.db) for any N>=2 run.
        id: params
        env:
          # All user-controlled inputs lifted to env: so they reach the run
          # script as bash variables (which only undergo word-splitting +
          # pathname expansion on $expansion — no command substitution, no
          # shell metachar re-evaluation), NOT as GH-expression substitutions
          # into the shell source (which would let a stray quote terminate
          # the surrounding string and inject arbitrary code).
          #
          # On workflow_dispatch, environment/data_product_id are choice-typed
          # so the surface is constrained; on workflow_call they are free-form
          # strings — treat both as untrusted to keep one defensive shape.
          # Kept as two separate vars and selected in bash below, NOT folded
          # into one `scope == 'stale' && dp_ids || data_product_ids`
          # expression: an empty stale set is a MEANINGFUL result, but '' is
          # falsy in a GH `||`, so that form would fall through to the caller's
          # explicit list and export it (actions/runner#2205 again — same trap
          # as the load_config line above).
          STALE_IDS: ${{ steps.stale.outputs.dp_ids }}
          EXPLICIT_IDS: ${{ inputs.data_product_ids }}
          DP_ID_INPUT: ${{ inputs.data_product_id }}
          ENVIRONMENT_INPUT: ${{ inputs.environment }}
          SCOPE: ${{ inputs.scope }}
          PUBLISH_PAGES: ${{ inputs.publish_pages }}
          ALL_MODE: ${{ inputs.data_product_all }}
          DETECTED_DP: ${{ steps.config.outputs.data_product_id }}
          DETECTED_BRANCH: ${{ steps.config.outputs.branch }}
          BRANCH_NAME: ${{ steps.config.outputs.branch_name }}
          DEFAULT_BRANCH: ${{ steps.config.outputs.default_branch }}
        run: |
          # Under stale scope the resolved set is authoritative — including when
          # it's empty (→ the no-op branch below).
          if [ "${SCOPE}" == "stale" ]; then
            raw_ids="${STALE_IDS}"
          else
            raw_ids="${EXPLICIT_IDS}"
          fi

          # Accept commas as a separator for manual dispatch convenience
          # (the dropdown UX nudges users toward "example_dp,sibling_dp").
          # tr+sed then trims + collapses internal whitespace so word-splitting
          # on space works regardless of caller formatting. Avoids `xargs`
          # here: with no command, xargs interprets quote/backslash escapes
          # and would crash the step on free-form workflow_dispatch input
          # before the regex gate below can reject it.
          ids_input=$(printf '%s' "${raw_ids}" | tr ',\t\n' '   ' | tr -s ' ' | sed 's/^ //; s/ $//')

          # Charset gates. Belt-and-suspenders defense — primary defense is
          # env-var routing (above), which already prevents GH-expression
          # injection into the shell source. These regexes additionally bound
          # what bash word-splitting can produce when these values flow
          # through `$VAR` expansion in the Run step. DP IDs are
          # `[a-z0-9_]+` by convention; environments are short identifiers.
          dp_id_pattern='^[a-z0-9_]+$'
          dp_list_pattern='^[a-z0-9_]+( [a-z0-9_]+)*$'
          env_pattern='^[a-z0-9_-]+$'
          if [ -n "${ids_input}" ] && ! [[ "${ids_input}" =~ ${dp_list_pattern} ]]; then
            echo "::error::Invalid data_product_ids='${raw_ids}' (expected space-separated [a-z0-9_]+ tokens)"
            exit 1
          fi
          if [ -n "${DP_ID_INPUT}" ] && ! [[ "${DP_ID_INPUT}" =~ ${dp_id_pattern} ]]; then
            echo "::error::Invalid data_product_id='${DP_ID_INPUT}' (expected [a-z0-9_]+)"
            exit 1
          fi
          if ! [[ "${ENVIRONMENT_INPUT}" =~ ${env_pattern} ]]; then
            echo "::error::Invalid environment='${ENVIRONMENT_INPUT}' (expected [a-z0-9_-]+)"
            exit 1
          fi
          # scope is free-form (choice can't express ''); reject a typo so it
          # can't silently fall through to the data_product_id default and
          # export an unintended DP.
          if [ -n "${SCOPE}" ] && [ "${SCOPE}" != "stale" ]; then
            echo "::error::Invalid scope='${SCOPE}' (expected empty or 'stale')"
            exit 1
          fi
          # Stale scope computes its own selection, so an explicit one alongside
          # it is a contradiction: data_product_all would even win the
          # precedence chain below and export every DP, the opposite of what was
          # asked (and of what run-name advertises). Reject rather than silently
          # pick a winner.
          if [ "${SCOPE}" == "stale" ] && [ "${ALL_MODE}" == "true" ]; then
            echo "::error::scope='stale' cannot be combined with data_product_all=true"
            exit 1
          fi
          if [ "${SCOPE}" == "stale" ] && [ -n "${EXPLICIT_IDS}" ]; then
            echo "::error::scope='stale' cannot be combined with data_product_ids='${EXPLICIT_IDS}'"
            exit 1
          fi

          # Stale mode with nothing stale: clean no-op. Flag skip=true so the
          # export/upload/deploy steps below are guarded off (re-deploying the
          # unchanged gh-pages tip would be wasted work). Every other mode has
          # a non-empty selection by construction, so skip stays false there.
          if [ "${SCOPE}" == "stale" ] && [ -z "${ids_input}" ]; then
            echo "✅ Nothing stale for '${ENVIRONMENT_INPUT}' — skipping export."
            {
              echo "skip=true"
              echo "is_all=false"
              echo "display_label=none (nothing stale)"
              echo "mode=API (${ENVIRONMENT_INPUT}) — stale (no changes)"
              echo "source_name=${ENVIRONMENT_INPUT}"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Feature branch = branch name differs from default (master/main).
          # DETECTED_BRANCH from load_config is unreliable for this check —
          # get_branch_suffix returns the branch name as-is for non-convention
          # branches, so "master" → "master" (non-empty) on the default branch.
          is_feature_branch="false"
          if [ "${BRANCH_NAME}" != "${DEFAULT_BRANCH}" ]; then
            is_feature_branch="true"
          fi

          # Branch label — same logic across all mode paths.
          if [ "${is_feature_branch}" == "true" ]; then
            branch_label="${BRANCH_NAME}"
            feature_note="Testing from feature branch '${BRANCH_NAME}'"
          else
            branch_label="master"
            feature_note=""
          fi

          # Resolve the three output fields the Run step consumes:
          #   data_product_id  — scalar DP name (empty unless single-DP path)
          #   data_product_ids — space-separated subset (empty unless N>=2)
          #   is_all           — "true" routes downstream artifact/deploy
          #                      steps onto their multi-DB code paths
          # Precedence: data_product_all > data_product_ids > data_product_id.
          # Subset with N==1 collapses to single-DP semantics so the artifact
          # naming, summary header, and source_name flag all align.
          data_product_id=""
          data_product_ids=""
          if [ "${ALL_MODE}" == "true" ]; then
            display_label="ALL"
            branch="${branch_label}"
            override_note="${feature_note}"
            mode_label="API (${ENVIRONMENT_INPUT}) — all data products"
            is_all="true"
          elif [ -n "${ids_input}" ]; then
            IFS=' ' read -ra ID_ARRAY <<< "${ids_input}"
            ID_COUNT=${#ID_ARRAY[@]}
            branch="${branch_label}"
            override_note="${feature_note}"
            if [ "${ID_COUNT}" -eq 1 ]; then
              data_product_id="${ID_ARRAY[0]}"
              display_label="${data_product_id}"
              mode_label="API (${ENVIRONMENT_INPUT})"
              is_all="false"
            else
              data_product_ids="${ids_input}"
              display_label="${ids_input}"
              mode_label="API (${ENVIRONMENT_INPUT}) — subset (${ID_COUNT} data products)"
              is_all="true"
            fi
          else
            # Single DP from data_product_id input. Auto-detect from
            # DP-convention branches; otherwise use input.
            if [ "${is_feature_branch}" == "true" ] && [ -n "${DETECTED_DP}" ]; then
              data_product_id="${DETECTED_DP}"
              branch="${DETECTED_BRANCH}"
              if [ "${DP_ID_INPUT}" != "${data_product_id}" ]; then
                override_note="Auto-detected from branch (input '${DP_ID_INPUT}' was ignored)"
                echo "ℹ️  Note: Ignoring input data_product_id='${DP_ID_INPUT}'"
                echo "   Auto-detected from branch: ${data_product_id}"
              else
                override_note="Auto-detected from branch"
              fi
            else
              data_product_id="${DP_ID_INPUT}"
              branch="${branch_label}"
              override_note="${feature_note}"
            fi
            display_label="${data_product_id}"
            mode_label="API (${ENVIRONMENT_INPUT})"
            is_all="false"
          fi

          {
            echo "skip=false"
            echo "data_product_id=${data_product_id}"
            echo "data_product_ids=${data_product_ids}"
            echo "display_label=${display_label}"
            echo "branch=${branch}"
            echo "override_note=${override_note}"
            echo "mode=${mode_label}"
            echo "source_name=${ENVIRONMENT_INPUT}"
            echo "is_all=${is_all}"
          } >> "$GITHUB_OUTPUT"

          echo "📦 Data Product: ${display_label}"
          echo "🌿 Branch: ${branch}"
          if [ "${PUBLISH_PAGES}" == "true" ]; then
            echo "🚀 Publish: ${PUBLISH_BRANCH}"
          else
            echo "📦 Publish: workflow artifact only"
          fi

      - name: Load database config
        id: db-config
        uses: ./.github/actions/load_db_config

      - name: Snapshot gh-pages tip before deploy
        if: ${{ inputs.publish_pages && steps.params.outputs.skip != 'true' }}
        # Captured here (not in the deploy step) so we have the SHA the
        # frontend was at when this run started — used later for both the
        # static-file integrity check and the targeted force-with-lease.
        # We pin the expected remote tip explicitly rather than rely on the
        # no-arg --force-with-lease (which compares the remote ref to its
        # remote-tracking ref): if origin/gh-pages moves between checkout
        # and push (e.g. an implicit fetch by another step or action), the
        # default form would happily overwrite the newer tip. Pinning to
        # ORIG_SHA fails fast in that case.
        id: ghp-snapshot
        working-directory: gh-pages-deploy
        env:
          BRANCH_EXISTS: ${{ steps.ghp-branch.outputs.exists }}
        run: |
          # Empty for a branch that doesn't exist yet: the push then leases
          # "must not exist", so a concurrent first publish can't be clobbered.
          ORIG_SHA=""
          if [ "${BRANCH_EXISTS}" == "true" ]; then
            ORIG_SHA="$(git rev-parse HEAD)"
          fi
          echo "orig_sha=${ORIG_SHA}" >> "$GITHUB_OUTPUT"
          echo "📌 gh-pages tip: ${ORIG_SHA:-(new branch)}"

      - name: Run full workflow (export + enrichment)
        if: ${{ steps.params.outputs.skip != 'true' }}
        env:
          # Dynamic lookup from config (works for both workflow_dispatch and workflow_call)
          TOKEN_GOODDATA: ${{ secrets.TOKEN_GOODDATA }}
          # Every value the command construction reads flows through env: —
          # `${{ … }}` substitutes into the env block at YAML render time
          # (safe; the value becomes string content of an env var), NOT into
          # the run script source (which would let a stray quote in the
          # substituted value terminate a surrounding string and inject
          # code). The previous shape carried `cli_args` as a pre-built
          # command string and did `CMD="${{ steps.params.outputs.cli_args }}"`
          # — that's a script-source substitution and was the actual
          # injection vector. All inputs that fed cli_args were validated by
          # regex in the params step, but defense-in-depth + clarity wins.
          IS_ALL: ${{ steps.params.outputs.is_all }}
          DATA_PRODUCT_ID: ${{ steps.params.outputs.data_product_id }}
          DATA_PRODUCT_IDS: ${{ steps.params.outputs.data_product_ids }}
          DISPLAY_LABEL: ${{ steps.params.outputs.display_label }}
          BRANCH: ${{ steps.params.outputs.branch }}
          MODE: ${{ steps.params.outputs.mode }}
          SOURCE_NAME: ${{ steps.params.outputs.source_name }}
          ENVIRONMENT_INPUT: ${{ inputs.environment }}
          INCLUDE_CONTENT: ${{ inputs.include_content }}
        run: |
          echo "Data Product: $DISPLAY_LABEL"
          echo "Branch: $BRANCH"
          echo "Mode: $MODE"

          if [ -z "$TOKEN_GOODDATA" ]; then
            echo "::error::TOKEN_GOODDATA secret is not set"
            exit 1
          fi

          # Build the gd-db invocation as a bash array. Tokens reach exec via
          # `"${CMD[@]}"` (quoted array expansion) so whitespace and other
          # metachars inside any single argument are preserved verbatim
          # rather than re-parsed. Unquoted `$DATA_PRODUCT_IDS` is the lone
          # word-splitting hot spot — gated by the params step's regex
          # (^[a-z0-9_]+( [a-z0-9_]+)*$), which guarantees the split yields
          # only plain DP-id tokens.
          CMD=(gd-db)
          if [ -n "$DATA_PRODUCT_IDS" ]; then
            # shellcheck disable=SC2206  # intentional word-split, validated upstream
            CMD+=(--data-product-id $DATA_PRODUCT_IDS)
          elif [ "$IS_ALL" == "true" ]; then
            CMD+=(--data-product-all)
          else
            CMD+=(--data-product-id "$DATA_PRODUCT_ID")
          fi
          CMD+=(--env "$ENVIRONMENT_INPUT")

          if [ "$INCLUDE_CONTENT" == "true" ]; then
            CMD+=(--include-content)
          fi

          # Always merge per-data-product. Single DP: --merge-per-dp picks
          # output/<dp>.db; the CLI needs --source-name. All DPs:
          # _run_all_data_products derives source_name from --env / --local
          # and picks per-DP targets per iteration.
          CMD+=(--merge-per-dp)
          if [ "$IS_ALL" != "true" ]; then
            CMD+=(--source-name "$SOURCE_NAME")
            echo "Merging into per-DP database as '$SOURCE_NAME'"
          else
            echo "Merging into per-DP databases (one per data product)"
          fi

          echo ""
          echo "Running: ${CMD[*]}"
          echo ""

          "${CMD[@]}"

          echo "✅ Full workflow completed"

      - name: Upload export artifact (single DP)
        if: ${{ steps.params.outputs.skip != 'true' && steps.params.outputs.is_all != 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: metadata-db-${{ steps.params.outputs.data_product_id }}-${{ inputs.environment }}-${{ github.run_id }}
          overwrite: true
          # Per-DP merged DB (output/<dp>.db); also deployed when requested.
          path: ${{ steps.db-config.outputs.output_dir }}/${{ steps.params.outputs.data_product_id }}.db
          retention-days: 30
          if-no-files-found: error

      - name: Upload export artifact (all DPs — per-data-product files)
        if: ${{ steps.params.outputs.skip != 'true' && steps.params.outputs.is_all == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: metadata-db-all-${{ inputs.environment }}-${{ github.run_id }}
          overwrite: true
          # Per-DP merged DBs only. Excludes:
          #  - metadata.db: transient single-source export.
          #  - *_master.db: per-workspace enrichment snapshots (workspace IDs
          #    are <dp>_<branch>; is_all=true is master-only so *_master.db
          #    is the correct shape).
          path: |
            ${{ steps.db-config.outputs.output_dir }}/*.db
            !${{ steps.db-config.outputs.output_dir }}/${{ steps.db-config.outputs.single_filename }}
            !${{ steps.db-config.outputs.output_dir }}/*_master.db
          retention-days: 30
          if-no-files-found: error

      - name: Deploy databases to gh-pages (orphan force-push)
        id: deploy-pages
        if: ${{ inputs.publish_pages && steps.params.outputs.skip != 'true' }}
        # One file per (env, data product): this run's export replaces exactly
        # the data/<env>/<dp>.db files it produced; every other file on the
        # branch stays. gd-pages also installs the frontend of the pinned
        # gdcloud, splits a pre-split data/<dp>.db, and rewrites metadata.json.
        # Then orphan-reset gh-pages to keep history flat (DB blobs would
        # otherwise bloat the repo by ~100 MB per export).
        env:
          # Env-lifted so values reach the script via $VAR (no command
          # substitution, no metachar re-eval) instead of via GH-expression
          # substitution into the shell source. The params step already
          # validated environment against ^[a-z0-9_-]+$, so this is
          # belt-and-suspenders — but it keeps every step that consumes
          # user input on the same defensive shape.
          ENVIRONMENT_INPUT: ${{ inputs.environment }}
          BRANCH: ${{ steps.params.outputs.branch }}
          DISPLAY_LABEL: ${{ steps.params.outputs.display_label }}
          ORIG_SHA: ${{ steps.ghp-snapshot.outputs.orig_sha }}
          BRANCH_EXISTS: ${{ steps.ghp-branch.outputs.exists }}
          OUTPUT_DIR: ${{ steps.db-config.outputs.output_dir }}
        run: |
          set -euo pipefail
          # Resolved before the cd below; output_dir may be relative
          OUTPUT_ABS="$(cd "${OUTPUT_DIR}" && pwd)"
          cd gh-pages-deploy
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git checkout --orphan tmp_deploy
          if [ "${BRANCH_EXISTS}" != "true" ]; then
            # Checked out from the default ref: start the site from nothing
            git rm -r -f -q --sparse .
          fi

          # gd-pages skips any output/*.db without a _sources registry (the
          # transient metadata.db, per-workspace <workspace_id>.db snapshots)
          # and exits non-zero when none of them had anything to publish.
          shopt -s nullglob
          gd-pages publish --sparse --site . --branch "${BRANCH}" "${OUTPUT_ABS}"/*.db

          # SQLite sidecars are matched by neither `git add -f` below nor the
          # site's .gitignore; never commit one.
          find data -name '*.db-*' -delete

          echo "✅ Prepared deploy"
          ls -lhR data/

          git add -A
          # The site's .gitignore keeps databases out of accidental local
          # commits — force-add the ones just published.
          git add --sparse -f data/*/*.db data/metadata.json
          git commit -q -m "Update database export (per-env, orphan)

          Data Product: ${DISPLAY_LABEL}
          Environment: ${ENVIRONMENT_INPUT}
          Branch: ${BRANCH}
          Mode: per-environment
          Export Date: $(date -u '+%Y-%m-%d %H:%M:%S UTC')

          🤖 Generated by GitHub Actions"
          git branch -M "$PUBLISH_BRANCH"
          # Pin the expected remote tip; the no-arg form would compare against
          # the local remote-tracking ref, which could have moved during the
          # run and silently allow an overwrite.
          git push --force-with-lease="${PUBLISH_BRANCH}:${ORIG_SHA}" origin "$PUBLISH_BRANCH"
          echo "✅ Published to $PUBLISH_BRANCH (orphan, previous tip: ${ORIG_SHA:-none, new branch})"

      - name: Generate summary
        if: always()
        env:
          # User-input-derived values lifted to env: (same defensive shape as
          # the Resolve parameters / Run / Deploy steps). github.* and
          # github.event.* fields are GH-controlled and stay inline.
          ENVIRONMENT_INPUT: ${{ inputs.environment }}
          DISPLAY_LABEL: ${{ steps.params.outputs.display_label }}
          OVERRIDE_NOTE: ${{ steps.params.outputs.override_note }}
          BRANCH: ${{ steps.params.outputs.branch }}
          MODE: ${{ steps.params.outputs.mode }}
          IS_ALL: ${{ steps.params.outputs.is_all }}
          DATA_PRODUCT_ID: ${{ steps.params.outputs.data_product_id }}
          SOURCE: ${{ steps.params.outputs.source_name }}
          OUTPUT_DIR: ${{ steps.db-config.outputs.output_dir }}
          SKIP: ${{ steps.params.outputs.skip }}
          PUBLISH_PAGES: ${{ inputs.publish_pages }}
          PAGES_DEPLOY_OUTCOME: ${{ steps.deploy-pages.outcome }}
        run: |
          echo "## Metadata Database Export Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Stale mode with nothing to do: report the no-op and stop. Nothing
          # was exported or deployed, so the size/view stats below don't apply.
          if [ "${SKIP}" == "true" ]; then
            echo "✅ **Nothing stale for \`${ENVIRONMENT_INPUT}\`** — no export needed." >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Every deployed data product is already current on gh-pages." >> $GITHUB_STEP_SUMMARY
            exit 0
          fi
          # Show trigger type
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "- **Triggered:** Manual run" >> $GITHUB_STEP_SUMMARY
          elif [ "${{ github.event_name }}" == "workflow_call" ]; then
            echo "- **Triggered:** Called from \`${{ github.workflow }}\`" >> $GITHUB_STEP_SUMMARY
          else
            echo "- **Triggered:** \`${{ github.event_name }}\`" >> $GITHUB_STEP_SUMMARY
          fi
          echo "- **Data Product:** \`${DISPLAY_LABEL}\`" >> $GITHUB_STEP_SUMMARY
          if [ -n "${OVERRIDE_NOTE}" ]; then
            echo "  - _${OVERRIDE_NOTE}_" >> $GITHUB_STEP_SUMMARY
          fi
          echo "- **Environment:** \`${ENVIRONMENT_INPUT}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch:** \`${BRANCH}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Source:** \`${MODE}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Export Date:** \`$(date -u '+%Y-%m-%d %H:%M:%S UTC')\`" >> $GITHUB_STEP_SUMMARY

          # --data-product-all: aggregate across per-DP merged files. Skip
          # files without the modern `_sources` schema (metadata.db
          # transient, <workspace_id>.db snapshots). Merged DBs prefix
          # views with <source>__<dp>__; only count this run's source.
          if [ "${IS_ALL}" == "true" ]; then
            shopt -s nullglob
            TOTAL_BYTES=0
            VIEW_COUNT=0
            for db in "${OUTPUT_DIR}"/*.db; do
              has_modern_sources=$(sqlite3 "${db}" \
                "SELECT 1 FROM _sources WHERE updated_at_utc IS NOT NULL LIMIT 1" \
                2>/dev/null || true)
              [ -z "${has_modern_sources}" ] && continue
              DP_ID="$(basename "${db}" .db)"
              VIEW_LIKE="${SOURCE}__${DP_ID}__v_%"
              TOTAL_BYTES=$(( TOTAL_BYTES + $(stat -c%s "${db}") ))
              VIEW_COUNT=$(( VIEW_COUNT + $(sqlite3 "${db}" "SELECT COUNT(*) FROM sqlite_master WHERE type='view' AND name LIKE '${VIEW_LIKE}';" 2>/dev/null || echo 0) ))
            done
            DB_SIZE=$(numfmt --to=iec-i --suffix=B --padding=1 "${TOTAL_BYTES}" 2>/dev/null || echo "${TOTAL_BYTES}B")
            echo "- **Databases Total Size:** \`${DB_SIZE}\` (sum across per-DP files)" >> $GITHUB_STEP_SUMMARY
            echo "- **Views Created:** \`${VIEW_COUNT}\`" >> $GITHUB_STEP_SUMMARY
          else
            # Single-DP run. Per-DP merged DB is the user-facing artifact.
            # Merged DBs prefix tables/views with <source>__<dp>__; count
            # only this run's source so the number isn't multiplied by the
            # count of envs already merged into the per-DP file.
            DP_ID="${DATA_PRODUCT_ID}"
            DB_PATH="${OUTPUT_DIR}/${DP_ID}.db"
            VIEW_LIKE="${SOURCE}__${DP_ID}__v_%"
            if [ -f "${DB_PATH}" ]; then
              DB_SIZE=$(du -h "${DB_PATH}" | cut -f1)
              echo "- **Database Size:** \`${DB_SIZE}\`" >> $GITHUB_STEP_SUMMARY
              VIEW_COUNT=$(sqlite3 "${DB_PATH}" "SELECT COUNT(*) FROM sqlite_master WHERE type='view' AND name LIKE '${VIEW_LIKE}';" 2>/dev/null || echo "0")
              echo "- **Views Created:** \`${VIEW_COUNT}\`" >> $GITHUB_STEP_SUMMARY
            fi
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Download" >> $GITHUB_STEP_SUMMARY
          echo "The enriched SQLite database is available as an artifact in this workflow run." >> $GITHUB_STEP_SUMMARY
          if [ "${PUBLISH_PAGES}" == "true" ] && [ "${PAGES_DEPLOY_OUTCOME}" == "success" ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### GitHub Pages" >> $GITHUB_STEP_SUMMARY
            echo "The database has been deployed to GitHub Pages and can be browsed at:" >> $GITHUB_STEP_SUMMARY
            echo "\`https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/\`" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Available Views" >> $GITHUB_STEP_SUMMARY
          echo "See the workflow execution logs above for the complete list of views created." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Or query the database:" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`sql" >> $GITHUB_STEP_SUMMARY
          echo "SELECT name FROM sqlite_master WHERE type='view' ORDER BY name;" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
