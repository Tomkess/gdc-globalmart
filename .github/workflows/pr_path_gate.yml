# Generated by `gd-workflows adopt`; edit gd-cloud-tooling, not this package-owned workflow.
name: "gdcloud · pr_path_gate"

# Installed by `gd-workflows adopt` from the pinned gdcloud package and
# overwritten on every adopt — do not edit. Project-specific settings live
# in the caller, pr_path_gate.yml; a change to the job logic belongs upstream in
# gd-cloud-tooling, or the engine is unsubscribed in config.yml (workflows:
# unsubscribed:). The version these engines came from is recorded in
# .github/gdcloud-ci.version, which setup_python checks against the installed
# package on every run.

on:
  workflow_call:
    inputs:
      patterns:
        description: 'grep -E regex matched against each changed file path. One alternative per line; blank lines are dropped before they are joined with `|`, so an alternative a caller compiled away leaves no empty branch behind. A single-line value is still a whole regex, e.g. ''^gd_data_product/[^/]+/(ldm/|config\.env\.yml$)''.'
        required: true
        type: string
    outputs:
      changed:
        description: 'true if any changed file matches `patterns`, else false'
        value: ${{ jobs.paths.outputs.changed }}

jobs:
  paths:
    runs-on: ubuntu-latest
    # A called workflow's token can never exceed the calling job's, so each
    # caller declares the same scope as its ceiling. `pull-requests: read` used
    # to be needed here; the gate now resolves the diff from the local clone,
    # so `contents: read` is the whole requirement.
    permissions:
      contents: read       # Required by actions/checkout
    outputs:
      changed: ${{ steps.check.outputs.changed }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0       # check_pr_paths diffs vs origin/<base>
          filter: blob:none    # Blobless: history only — ~1s vs shallow

      - name: Match the PR diff against the patterns
        id: check
        uses: ./.github/actions/check_pr_paths
        with:
          patterns: ${{ inputs.patterns }}
