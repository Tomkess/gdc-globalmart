name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # gd-cloud-tooling is private: `uv sync` fetches the pinned gdcloud through this token
      # (FEAT-019). Scoped to github.com/gooddata/ and removed when the step exits.
      - name: Sync dependencies
        env:
          GH_DEP_TOKEN: ${{ secrets.TOKEN_GITHUB_GDCLOUD }}
        run: |
          dep_url="url.https://x-access-token:${GH_DEP_TOKEN}@github.com/gooddata/"
          trap 'git config --global --remove-section "$dep_url" 2>/dev/null || true' EXIT
          git config --global "${dep_url}.insteadOf" "https://github.com/gooddata/"
          uv sync --locked --all-extras --dev

      - name: Lint
        run: uv run ruff check src tests gd_plugin

      - name: Type check
        run: uv run mypy

      - name: Test
        run: uv run pytest tests/ -q

      # Coverage: every dashboard and visualization in the parent belongs to a domain, is
      # declared shared, or is excluded with a written reason. A PR that adds a dashboard
      # without assigning it fails here. --strict also rejects placeholder reasons, so a
      # freshly bootstrapped manifest cannot go green unreviewed. Offline, no credentials.
      - name: Domain manifest covers the parent
        run: uv run globalmart domains validate --strict

      # The derived children must match what the parent plus the manifest produce. A
      # hand-edited generated file, or a parent change nobody re-split, fails the PR.
      # Offline: reads gd_data_product/globalmart/, never a live host. Its formatting is gated by
      # gdcloud's "GoodData YAML Formatting Check" workflow (gd-format-yaml --check).
      - name: Domain children are current
        run: uv run globalmart split --check

      # ADR 008 moved the rows out of the repo, so there are no bytes to hash. What is
      # committed is the contract — which tables exist, their row counts and their columns —
      # and it must agree with the DDL. Every SQL-backed dataset must also reference a table
      # the DDL defines. Offline: no credentials, no warehouse.
      - name: Contract agrees with the DDL and SQL datasets resolve
        run: uv run globalmart data verify

      # Every dashboard date filter must be bound to the date dataset its own content
      # depends on. Unbound, a filter silently does nothing — which is how 32 dashboards
      # shipped a date filter that changed no number for two years. A dashboard added
      # without a bound filter fails the PR that added it. Offline.
      - name: Dashboard date filters are bound
        run: uv run globalmart datefilters bind --check

      # The compiled memory items must match the authored Markdown. Editing a knowledge
      # document without rebuilding fails here. Offline.
      - name: Knowledge is compiled
        run: uv run globalmart knowledge build --check

      # The documentation corpus satisfies its authoring contract: front matter complete,
      # one Diátaxis kind per document, header-based sections within the size bounds the
      # retrieval research implies, no published-filename collision. Also checks that every
      # retrieval question's expected facts still appear verbatim in the document they cite,
      # so rewriting a load-bearing sentence fails here rather than degrading a live suite.
      # Offline: no credentials, no host.
      - name: Documentation corpus is valid
        run: uv run globalmart knowledge-docs build

      # The gate this feature exists for: every dataset, metric, visualization and dashboard
      # in the parent is documented by docs/knowledge-corpus/ or excluded in
      # config/corpus.yaml with a written reason. Renaming an object without touching its
      # documentation fails the PR that renamed it, because the covers: pattern stops
      # matching. --strict also rejects placeholder reasons. Offline, reads the committed
      # tree and never a live host.
      - name: Documentation covers the workspace
        run: uv run globalmart knowledge-docs coverage --strict

  # Data before workspace before knowledge (FEAT-018 order, ADR 011). Workflow 3 deploys on merge,
  # so a stale warehouse must stop the merge, not the deploy. One MotherDuck schema backs all four
  # environments, so dev's view of it is everyone's. Read-only: --check never generates or loads.
  data-current:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync dependencies
        env:
          GH_DEP_TOKEN: ${{ secrets.TOKEN_GITHUB_GDCLOUD }}
        run: |
          dep_url="url.https://x-access-token:${GH_DEP_TOKEN}@github.com/gooddata/"
          trap 'git config --global --remove-section "$dep_url" 2>/dev/null || true' EXIT
          git config --global "${dep_url}.insteadOf" "https://github.com/gooddata/"
          uv sync --locked --all-extras --dev

      # The freshness check reads the warehouse only. Loading the profile still requires a
      # GoodData token, which this job never uses, so it gets a placeholder rather than a
      # secret. MOTHERDUCK_TOKEN is the read-write one until a read-only token exists.
      #
      # 45 days, deliberately looser than data-currency.yml's 31. The weekly refresh only fires
      # once data is past 31 days, so a gate at 31 would go red the day the data ages out and stay
      # red until the next Monday run. At 45 the gate fails only when the refresh itself has been
      # failing for two weeks — which is the thing worth blocking merges over.
      - name: Warehouse is current
        env:
          GLOBALMART_TOKEN__GDCLOUD_DEV: unused-by-the-freshness-check
          MOTHERDUCK_TOKEN: ${{ secrets.MOTHERDUCK_TOKEN }}
        run: uv run globalmart data ensure --target gdcloud-dev --max-age-days 45 --check
