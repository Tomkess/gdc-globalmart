# Generated by `gd-workflows adopt`; edit config.yml or gd-cloud-tooling,
# not this package-owned workflow. Re-run `make dev` after a pin change.
name: Notify Slack - PR Review Requested

# Pings the review subteam on opened/ready_for_review, except for the authors
# listed in .github/notify_on_ready.yml (which says why). A comment starting a
# line with `@notify` (or `/notify`) always sends, for anyone, and re-pings a
# quiet PR.
# NOTE: issue_comment only fires from the copy of this file on the default
# branch, so trigger changes take effect only once merged to master.

on:
  issue_comment:
    types: [created]
  pull_request:
    types: [opened, ready_for_review]

  workflow_call:

jobs:
  gate:
    runs-on: ubuntu-latest
    # Event shape only — a cheap prefilter. The exact command match and the
    # exemption list both need a shell (and a checkout), so they live in `decide`.
    if: >-
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request &&
       (contains(github.event.comment.body, '@notify') ||
        contains(github.event.comment.body, '/notify')) &&
       contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'),
                github.event.comment.author_association)) ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.draft == false)
    permissions:
      contents: read
      issues: write
    outputs:
      notify: ${{ steps.decide.outputs.notify }}
      pr_number: ${{ steps.decide.outputs.pr_number }}
    steps:
      - name: Checkout Default Branch
        uses: actions/checkout@v7
        with:
          # Read the list as master has it — a PR must not be able to silence
          # (or un-silence) itself by editing its own head.
          ref: ${{ github.event.repository.default_branch }}

      - name: Decide Whether To Notify
        id: decide
        env:
          EVENT: ${{ github.event_name }}
          COMMENT_PR: ${{ github.event.issue.number }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          READY_PR: ${{ github.event.pull_request.number }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          if [[ "$EVENT" == "issue_comment" ]]; then
            echo "pr_number=$COMMENT_PR" >> "$GITHUB_OUTPUT"

            # The job's `if` matches `@notify` anywhere in the body, so a comment
            # merely mentioning the command lands here too. Require it to start a
            # line — quoting the docs in a review thread must not ping the subteam.
            if grep -qiE '^[[:space:]]*[@/]notify\b' <<<"$COMMENT_BODY"; then
              # Explicit ask always sends — exemption list or not, re-pings too
              echo "notify=true" >> "$GITHUB_OUTPUT"
              echo "▶️ @notify command — sending"
            else
              echo "notify=false" >> "$GITHUB_OUTPUT"
              echo "⏭️ Comment mentions @notify without issuing it — not sending"
            fi
            exit 0
          fi

          echo "pr_number=$READY_PR" >> "$GITHUB_OUTPUT"

          LIST=.github/notify_on_ready.yml
          # One flat list, so read it line-wise rather than pull in a YAML parser.
          # The `-f` guard has to be an `if`, not `EXCEPT=$([[ -f … ]] && …)`: under
          # `bash -e` the false guard fails that assignment and kills the step, where
          # a missing list should only ever mean nobody is exempt.
          EXCEPT=""
          if [[ -f "$LIST" ]]; then
            EXCEPT=$(sed 's/#.*//' "$LIST" |
              sed -nE 's/^[[:space:]]*-[[:space:]]*([A-Za-z0-9._-]+)[[:space:]]*$/\1/p')
          fi

          # GitHub logins are case-insensitive; -xF = whole login, literal
          if [[ -n "$EXCEPT" ]] && grep -qixF -- "$PR_AUTHOR" <<<"$EXCEPT"; then
            echo "notify=false" >> "$GITHUB_OUTPUT"
            echo "⏭️ $PR_AUTHOR is exempt from the automatic ping" \
                 "— comment @notify on the PR to send it"
          else
            echo "notify=true" >> "$GITHUB_OUTPUT"
            echo "✅ Notifying for $PR_AUTHOR"
          fi

      - name: Acknowledge Command
        if: github.event_name == 'issue_comment' && steps.decide.outputs.notify == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMENT_ID: ${{ github.event.comment.id }}
          # The reaction is cosmetic and soft-fails, so don't spend the wrapper's
          # full 21s backoff on it — one retry covers a transient blip.
          GH_API_ATTEMPTS: 2
        run: |
          .github/scripts/gh_api_retry.sh --silent -X POST \
            "repos/$GITHUB_REPOSITORY/issues/comments/$COMMENT_ID/reactions" \
            -f content=eyes || echo "::warning::Could not react to the comment"

  notify:
    needs: gate
    if: needs.gate.outputs.notify == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout Default Branch
        uses: actions/checkout@v7
        with:
          # Quotes, gh_api_retry.sh and the notify action from master on both
          # paths — issue_comment can only ever run master's copy anyway.
          ref: ${{ github.event.repository.default_branch }}

      - name: Fetch PR Details
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ needs.gate.outputs.pr_number }}
        run: |
          # issue_comment carries no pull_request object — read it from the API.
          # Kept as a file rather than step outputs: the body needs a heredoc
          # delimiter, and a body line matching it would close the block early and
          # let the rest of the body set the other outputs — a spoofable PR link.
          .github/scripts/gh_api_retry.sh \
            "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" > "$RUNNER_TEMP/pr.json"

      - name: Pick Random Quote
        id: quote
        run: |
          # Pick a random line from TSV (skip header), split on tab
          # quotes.tsv sits beside the action, so it is only on disk when the
          # actions are vendored. A missing quote is not worth failing a
          # notification for.
          QUOTES=.github/actions/notify_slack/quotes.tsv
          if [[ -f "$QUOTES" ]]; then
            LINE=$(tail -n +2 "$QUOTES" | shuf -n 1)
          else
            LINE=$(printf 'Ship it.\tanon')
          fi
          QUOTE=$(echo "$LINE" | cut -f1)
          AUTHOR=$(echo "$LINE" | cut -f2)

          # Append " — Author" only if author is known
          if [[ "$AUTHOR" != "Unknown" ]]; then
            QUOTE="$QUOTE — $AUTHOR"
          fi

          echo "text<<QUOTE_EOF" >> "$GITHUB_OUTPUT"
          echo "$QUOTE" >> "$GITHUB_OUTPUT"
          echo "QUOTE_EOF" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: ./.github/actions/setup_python
        with:
          github_token: ${{ secrets.TOKEN_GITHUB_GDCLOUD }}

      # Parse config.yml through the tooling's real YAML and hierarchical
      # lookup implementation. Keeping another regex parser here would make
      # quoted values, nesting, and future config changes behave differently.
      - name: Load Slack configuration
        id: slack_config
        uses: ./.github/actions/load_config

      - name: Extract Jira Ticket
        id: jira
        run: |
          # Extract Atlassian Jira browse URL from PR body, derive ticket ID from it
          PR_BODY=$(jq -r '.body // ""' "$RUNNER_TEMP/pr.json")
          URL=$(grep -oE 'https://[^)]+atlassian[^)]+/browse/[A-Z][A-Z0-9]+-[0-9]+' \
            <<<"$PR_BODY" | head -1)
          if [[ -n "$URL" ]]; then
            TICKET="${URL##*/browse/}"
            echo "link=  |  <$URL|$TICKET>" >> "$GITHUB_OUTPUT"
          else
            echo "link=" >> "$GITHUB_OUTPUT"
          fi

      - name: Build Slack Payload
        id: payload
        env:
          JIRA_LINK: ${{ steps.jira.outputs.link }}
          QUOTE: ${{ steps.quote.outputs.text }}
          SUBTEAM_ID: ${{ steps.slack_config.outputs.slack_review_subteam_id }}
        run: |
          # Read the PR fields straight from the API response, so titles, branches
          # and quotes holding quotes, backslashes or newlines are escaped into
          # valid JSON by jq. -c keeps it single-line for GITHUB_OUTPUT.
          # Empty subteam -> no mention, rather than a dangling <!subteam^>
          MENTION=""
          if [[ -n "$SUBTEAM_ID" ]]; then
            MENTION="👥 <!subteam^${SUBTEAM_ID}>  |  "
          fi
          PAYLOAD=$(jq -c \
            --arg jira "$JIRA_LINK" \
            --arg quote "$QUOTE" \
            --arg mention "$MENTION" \
            '[
              {type: "section", text: {type: "mrkdwn",
                text: ("*Title:* " + .title + "\n*Author:* " + .user.login + "\n*Branch:* `" + .head.ref + "`")}},
              {type: "section", text: {type: "mrkdwn",
                text: ($mention + "<" + .html_url + "|Review PR>" + $jira)}},
              {type: "context", elements: [
                {type: "mrkdwn", text: ("💬 _" + $quote + "_")}]}
            ]' "$RUNNER_TEMP/pr.json")
          echo "json=$PAYLOAD" >> "$GITHUB_OUTPUT"

      - name: Notify Slack
        uses: ./.github/actions/notify_slack
        with:
          webhook_url: ${{ secrets[steps.slack_config.outputs.slack_webhook_variable] || secrets.SLACK_WEBHOOK_PR }}
          # Not "PR Ready for Review": an @notify re-ping is often days later
          header: "📋 PR Review Requested"
          payload: ${{ steps.payload.outputs.json }}
