# Generated by `gd-workflows adopt`; edit config.yml or gd-cloud-tooling,
# not this package-owned workflow. Re-run `make dev` after a pin change.
name: Auto - gdcloud pin freshness

# Scheduled because a new upstream tag should not fail an unrelated PR.

on:
  schedule:
    # Monday 06:00 UTC.
    - cron: '0 6 * * 1'
  workflow_dispatch: {}

  workflow_call:
    inputs:
      include_major:
        description: 'Fail on major upgrades too.'
        required: false
        type: boolean
        default: false

concurrency:
  group: auto-gdcloud-pin
  cancel-in-progress: false

jobs:
  pin:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      # A pin too old to provide `pin-check` correctly fails this watchdog.
      - name: Setup Python Environment
        uses: ./.github/actions/setup_python
        with:
          github_token: ${{ secrets.TOKEN_GITHUB_GDCLOUD }}

      # A bundle consumer installs gdcloud from a vendored wheel and pins no
      # git ref; pin-check reports that as not applicable and exits 0, so this
      # scheduled job stays green rather than failing every Monday.
      - name: Check the gdcloud pin
        id: pin
        env:
          GH_DEP_TOKEN: ${{ secrets.TOKEN_GITHUB_GDCLOUD }}
        run: |
          set -o pipefail
          if gd-workflows pin-check . --require-remote \
              ${{ inputs.include_major && '--include-major' || '' }} 2>&1 \
              | tee pin-check.log; then
            echo "stale=false" >> "$GITHUB_OUTPUT"
          else
            echo "stale=true" >> "$GITHUB_OUTPUT"
            exit 1
          fi

      # Preserve the failing verdict in the job summary.
      - name: Summary
        if: always()
        run: |
          {
            echo "## gdcloud pin"
            echo
            echo '```'
            cat pin-check.log 2>/dev/null || echo "(the check did not run)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
