# Generated by `gd-workflows adopt`; edit config.yml or gd-cloud-tooling,
# not this package-owned workflow. Re-run `make dev` after a pin change.
name: GoodData YAML Formatting Check

# NOTE: do NOT add `paths:` here. GitHub evaluates trigger-level path filters
# against the synchronize push delta, not the PR's full diff vs base — after
# a rebase that doesn't re-touch the gated paths in the new push, the workflow
# would silently skip even when the PR carries those changes overall (see PR
# #1075 for the model_validation regression). The path-aware gate is
# implemented below via `check_pr_paths`, which queries the PR's full diff
# and short-circuits cheaply.
on:
  pull_request:
    types: [opened, synchronize, reopened]

  workflow_call:

jobs:
  # Cheap gate that runs on every PR and exposes `changed` to the downstream
  # `check-formatting` job. Two-job layout gives the downstream a true
  # "Skipped" status on irrelevant PRs.
  #
  # Patterns match the original `paths:` list — DP analytics_model + ldm YAML
  # and the formatter itself. Gate mechanics live in pr_path_gate.yml.
  gate:
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/pr_path_gate.yml
    permissions:
      contents: read       # Ceiling for the called workflow's token
    with:
      patterns: '^gd_data_product/[^/]+/(analytics_model|ldm)/.+\.yaml$|^\.github/workflows/(gdcloud__)?check_gd_formatting_yaml\.yml$'

  check-formatting:
    needs: gate
    if: github.event_name == 'pull_request' && needs.gate.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0       # detect_dp_changes runs git diff vs base
          filter: blob:none    # Blobless: history only — ~1s vs shallow

      - name: Setup Python Environment
        uses: ./.github/actions/setup_python
        with:
          github_token: ${{ secrets.TOKEN_GITHUB_GDCLOUD }}

      # Resolve affected DPs: branch primary DP ∪ DPs from PR diff. A
      # `example_dp--x` PR that also touches `gd_data_product/sibling_dp/`
      # files fans out to both.
      - name: Detect affected data products
        id: dps
        uses: ./.github/actions/detect_dp_changes

      # Multi-DP uses --data-product-id A B … (nargs='+') to keep work inside
      # one Python process; per-DP iteration happens in formatting_yaml.py via
      # args.selected_data_products.
      - name: Check YAML formatting
        env:
          DP_LIST: ${{ steps.dps.outputs.dp_list }}
          HAS_CHANGES: ${{ steps.dps.outputs.has_changes }}
        run: |
          if [[ "$HAS_CHANGES" != "true" ]]; then
            echo "No DP files detected — checking all data products"
            gd-format-yaml --check --data-product-all
          else
            # shellcheck disable=SC2086  # word-split DP_LIST into separate args
            gd-format-yaml --check --data-product-id $DP_LIST
          fi

      - name: Show diff if formatting issues found
        if: failure()
        env:
          DP_LIST: ${{ steps.dps.outputs.dp_list }}
          DP_COUNT: ${{ steps.dps.outputs.dp_count }}
        run: |
          # No `git diff --stat` here: the check runs gd-format-yaml --check,
          # which reports without rewriting, so the tree is clean and the diff
          # would print nothing under its own heading. The failing step above
          # already lists the offending files.
          if [[ "$DP_COUNT" == "1" ]]; then
            DP_ID=$(echo "$DP_LIST" | awk '{print $1}')
            echo "Run this locally to fix:"
            echo "  gd-format-yaml --data-product-id $DP_ID"
          else
            echo "Affected data products: ${DP_LIST:-(all)}"
            echo ""
            echo "Run this locally to fix:"
            echo "  gd-format-yaml --data-product-all"
          fi
