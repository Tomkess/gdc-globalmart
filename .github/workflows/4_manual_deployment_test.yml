# Generated by `gd-workflows adopt`; edit config.yml or gd-cloud-tooling,
# not this package-owned workflow. Re-run `make dev` after a pin change.
name: 4 - Manual deployment of master branch to test environment
run-name: "4 - Deploy to test [${{ inputs.data_product_id }}]${{ inputs.version && format(' {0}', inputs.version) || '' }}"

on:
  workflow_dispatch:
    inputs:
      data_product_id:
        description: 'Data product to deploy'
        required: true
        type: choice
        options:
          - 'globalmart'
        default: 'globalmart'
      version:
        description: 'Version to deploy (leave empty for latest version, or specify like v1.5 for downgrade)'
        required: false
        type: string
        default: ''
      skip_validation:
        description: 'Skip pre-deployment model validation (not recommended)'
        required: false
        type: boolean
        default: false

  workflow_call:
    inputs:
      data_product_id:
        description: 'Data product to deploy'
        required: true
        type: string
      version:
        description: 'Version to deploy (leave empty for latest version, or specify like v1.5 for downgrade)'
        required: false
        type: string
        default: ''
      skip_validation:
        description: 'Skip pre-deployment model validation (not recommended)'
        required: false
        type: boolean
        default: false

# Permissions for reusable workflow calls and deployment operations
concurrency:
  group: deploy-test-${{ inputs.data_product_id }}
  cancel-in-progress: false

permissions:
  actions: read         # Required by model_validation.yml (validation-summary job)
  contents: write       # Required to push deployment tracking tags
  pull-requests: read   # PR changelog in deployment summary

jobs:
  # Refuses a non-default branch before any job holding a credential runs.
  # No secrets are passed: the gate needs none.
  branch_gate:
    permissions:
      contents: read
    uses: ./.github/workflows/branch_gate.yml

  # Deployment plan: visible BEFORE the deployment starts (mirrors workflow 5 pattern)
  # Defined first so its Step Summary appears above validation results
  deployment_info:
    needs: branch_gate
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get-version.outputs.version }}
      # Published so the reusable-workflow jobs below can gate on the same
      # verdict; a job-level `if:` cannot reach another job's step outputs.
      is_default_branch: ${{ steps.config.outputs.is_default_branch }}
      default_branch: ${{ steps.config.outputs.default_branch }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-tags: true  # Tags for version management and changelog

      - name: Setup Python Environment
        uses: ./.github/actions/setup_python
        with:
          github_token: ${{ secrets.TOKEN_GITHUB_GDCLOUD }}

      - name: Load Configuration
        id: config
        uses: ./.github/actions/load_config
        with:
          environment: test
          data_product_id: ${{ inputs.data_product_id }}

      - name: Verify allowed branch
        # Only an explicit 'false' blocks: an older pinned load_config has no
        # such output, and '' must not reject the branch branch_gate passed.
        if: ${{ steps.config.outputs.is_default_branch == 'false' }}
        run: |
          echo "❌ This workflow must be run from the default branch."
          echo "   Configured default: ${{ steps.config.outputs.default_branch }}"
          echo "   Current branch:     ${{ github.ref_name }}"
          echo "   Switch to it and re-trigger the deployment."
          exit 1

      - name: Get Deployment Version
        id: get-version
        uses: ./.github/actions/version_management
        with:
          action: ${{ inputs.version != '' && 'validate_version' || 'get_latest_version' }}
          data_product_id: ${{ inputs.data_product_id }}
          version: ${{ inputs.version }}
          skip_setup: 'true'

      - name: Pre-deployment Summary
        uses: ./.github/actions/deployment_summary
        with:
          phase: pre
          environment: test
          data_product_id: ${{ inputs.data_product_id }}
          version: ${{ steps.get-version.outputs.version }}
          branch: ${{ github.ref_name }}
          triggered_by: ${{ github.actor }}
          deployment_type: ${{ inputs.version != '' && 'specific' || 'latest' }}
          validation_status: ${{ inputs.skip_validation && '⚠️ **SKIPPED**' || '' }}
          repo_url: ${{ github.server_url }}/${{ github.repository }}

  # Pre-deployment validation: validate local LDM against test PDM
  validate_models:
    needs: deployment_info
    if: >-
      ${{ !inputs.skip_validation &&
      needs.deployment_info.outputs.is_default_branch != 'false' }}
    uses: ./.github/workflows/model_validation.yml
    with:
      env: "test"
      data_product_id: ${{ inputs.data_product_id }}
      mode: "ldm-deploy"
      ref: ${{ inputs.version }}
    secrets: inherit

  # Informational: validate LDM dataset SQL against data source (non-blocking)
  validate_sql:
    needs: deployment_info
    if: ${{ needs.deployment_info.outputs.is_default_branch != 'false' }}
    uses: ./.github/workflows/model_validation.yml
    with:
      env: "test"
      data_product_id: ${{ inputs.data_product_id }}
      mode: "ldm-sql"
      ref: ${{ inputs.version }}
    secrets: inherit

  # Informational: validate base LDM SQL without env overrides (non-blocking)
  validate_sql_base:
    needs: deployment_info
    if: ${{ needs.deployment_info.outputs.is_default_branch != 'false' }}
    uses: ./.github/workflows/model_validation.yml
    with:
      env: "test"
      data_product_id: ${{ inputs.data_product_id }}
      mode: "ldm-sql"
      skip_overrides: true
      ref: ${{ inputs.version }}
    secrets: inherit

  # Actual deployment job
  deploy_workspace:
    runs-on: ubuntu-latest
    permissions:
      actions: write      # Required to dispatch enabled follow-up workflows
      contents: write     # Required to push deployment tracking tags
      pull-requests: read # PR changelog in deployment summary
    environment: ${{ fromJSON('{"dev":"develop","test":"staging","preprod":"preprod","prod":"production"}')['test'] }}
    # Only run after validation passes (or if validation is skipped)
    needs: [validate_models, deployment_info]
    if: |
      always() &&
      needs.deployment_info.outputs.is_default_branch != 'false' &&
      (needs.deployment_info.result == 'success') &&
      (needs.validate_models.result == 'success' || inputs.skip_validation)
    env:
      TOKEN_GOODDATA: ${{ secrets.TOKEN_GOODDATA }}

    steps:
      - name: Pre-deployment Status
        run: |
          if [[ "${{ inputs.skip_validation }}" == "true" ]]; then
            echo "⚠️ WARNING: Model validation was skipped!"
            echo "::warning::Pre-deployment model validation was skipped - proceeding without validation"
          else
            echo "✅ Model validation completed successfully"
            echo "Validation result: ${{ needs.validate_models.outputs.validation_result }}"
            echo "Critical issues: ${{ needs.validate_models.outputs.critical_issues_found }}"
          fi

      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-tags: true  # Fetch tags without full history (for version management)

      - name: Setup Python Environment
        uses: ./.github/actions/setup_python
        with:
          github_token: ${{ secrets.TOKEN_GITHUB_GDCLOUD }}

      - name: Load Configuration
        uses: ./.github/actions/load_config
        id: config
        with:
          environment: test
          data_product_id: ${{ inputs.data_product_id }}
          keys: "master_workspace_id"

      - name: Checkout Data Product at Specific Version
        if: ${{ inputs.version != '' }}
        env:
          # Routed through env, never interpolated into the script body: this
          # is a free-text dispatch input and the job holds deploy credentials.
          RAW_VERSION: ${{ inputs.version }}
        run: |
          VERSION="$(echo -n "$RAW_VERSION" | xargs)"
          # Same shape workflow 5 enforces on its content ref — reject anything
          # that is not a version tag before it reaches git.
          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
            echo "❌ Invalid version '$VERSION' — expected vN.N or vN.N.N"
            exit 1
          fi
          echo "🔄 Checking out data product files at version $VERSION"
          git checkout "$VERSION" -- gd_data_product/
          echo "✅ Data product files at $VERSION, actions/scripts at latest default branch"

      - name: Deploy new version of ${{ inputs.data_product_id }} to GoodData
        timeout-minutes: 20
        run: |
          gd-upload \
          --environment "test" \
          --data-product-id "${{ inputs.data_product_id }}" \
          --branch "${{ steps.config.outputs.default_branch }}"

      - name: Track Test Deployment
        id: track-deployment
        uses: ./.github/actions/version_management
        with:
          action: track_deployment
          environment: test
          data_product_id: ${{ inputs.data_product_id }}
          version: ${{ needs.deployment_info.outputs.version }}
          github_token: ${{ secrets[steps.config.outputs.github_token_variable] }}
          skip_setup: 'true'

      - name: Post-deployment Summary
        uses: ./.github/actions/deployment_summary
        with:
          phase: post
          environment: test
          data_product_id: ${{ inputs.data_product_id }}
          version: ${{ steps.track-deployment.outputs.version }}
          deployment_tag: ${{ steps.track-deployment.outputs.deployment_tag }}

      # Auxiliary follow-ups are fire-and-forget: the deployment already
      # succeeded, so their failure must not fail the run (mirrors workflow 5).
      - name: Trigger Version Comparison Report
        if: ${{ success() && github.repository != '__gdcloud_disabled__' }}
        continue-on-error: true
        uses: ./.github/actions/trigger_version_comparison
        with:
          data_product_id: ${{ inputs.data_product_id }}
          environment: test
          trigger_reason: "Test deployment (Workflow 4)"
          default_branch: ${{ steps.config.outputs.default_branch }}
          github_token: ${{ secrets[steps.config.outputs.github_token_variable] }}

      # Self-scoping + coalescing: the export resolves which DPs are stale for
      # this env, so a multi-DP release fan-out refreshes exactly the changed
      # DPs in one run instead of queuing one dispatch per DP. No per-DP arg.
      - name: Trigger DB Export
        if: ${{ success() && github.repository == '__gdcloud_disabled__' }}
        continue-on-error: true
        uses: ./.github/actions/trigger_db_export
        with:
          environment: test
          default_branch: ${{ steps.config.outputs.default_branch }}
          github_token: ${{ secrets[steps.config.outputs.github_token_variable] }}
