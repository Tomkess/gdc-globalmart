# Generated by `gd-workflows adopt`; edit config.yml or gd-cloud-tooling,
# not this package-owned workflow. Re-run `make dev` after a pin change.
name: YAML Lint

# Plain `yamllint .` over the repo's .yamllint (scaffolded at adoption; the
# gdcloud package default matches it). The local auto-fixer, gd-format-yaml,
# uses the SAME engine + config, so what it fixes locally is exactly what this
# gate checks. Self-contained on purpose: the source project delegated to an
# org-internal reusable workflow, which no repo outside that org can call.

on:
  pull_request:
    branches:
      - master
      - main

  workflow_call:

jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: yamllint
        run: pipx run yamllint .
