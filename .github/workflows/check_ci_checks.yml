# Generated by `gd-workflows adopt`; edit config.yml or gd-cloud-tooling,
# not this package-owned workflow. Re-run `make dev` after a pin change.
name: CI Checks

# NOTE: do NOT add `paths:` here. GitHub evaluates trigger-level path filters
# against the synchronize push delta, not the PR's full diff vs base — after
# a rebase that doesn't re-touch the gated paths in the new push, the workflow
# would silently skip even when the PR carries those changes overall (see PR
# #1075 for the model_validation regression). The path-aware gate is
# implemented below via `check_pr_paths`, which queries the PR's full diff
# and short-circuits cheaply.
on:
  pull_request:
    types: [opened, synchronize, reopened]

  workflow_call:

jobs:
  # Cheap gate that runs on every PR and exposes `changed` to the downstream
  # `ci-checks` job. Two-job layout (rather than a single job with per-step
  # `if:` guards) is what gives the downstream job a true "Skipped" status on
  # PRs without relevant changes — GitHub then groups it under the collapsed
  # "X skipped checks" panel instead of reporting a misleading "Successful in
  # 10s" run.
  #
  # Patterns match the original `paths:` list — DP YAML files, config files
  # (common + per-DP), CI-checks tooling, shared library, CI SQL views, and the
  # workflow itself. One alternative per line: the blanks are dropped before
  # joining, so an input that compiles to nothing adds no branch rather than an
  # empty one, which would match every path. Mechanics live in pr_path_gate.yml.
  gate:
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/pr_path_gate.yml
    permissions:
      contents: read       # Ceiling for the called workflow's token
    with:
      patterns: |
        ^gd_data_product/([^/]+/(analytics_model/(metrics|analytical_dashboards|visualization_objects|filter_contexts)|ldm/datasets)/[^/]+\.yaml|([^/]+/)?config\.(ci_checks|shared)\.yml)$
        ${{ 'gd_data_product_shared' != '' && format('^{0}/', 'gd_data_product_shared') || '' }}
        ^\.github/workflows/(gdcloud__)?check_ci_checks\.yml$
        ${{ '^gd_plugin/|^config\.yml$|^pyproject\.toml$|^layouts/workspaces/globalmart/|^gd_data_product/([^/]+/)?config\.env\.yml$' }}

  ci-checks:
    needs: gate
    # Runs on relevant changes and on a gate that did not succeed; skips only
    # when the gate ran and found nothing relevant.
    if: ${{ !cancelled() && github.event_name == 'pull_request' && (needs.gate.result != 'success' || needs.gate.outputs.changed == 'true') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write   # sticky PR comments (check findings, unused objects)

    steps:
      # A gate that failed to check out or resolve the diff must fail this
      # required status, not skip it: GitHub counts a skipped required check
      # as satisfied, so the checks would pass without running.
      - name: Fail when the path gate did not succeed
        if: needs.gate.result != 'success'
        env:
          GATE_RESULT: ${{ needs.gate.result }}
        run: |
          echo "::error::The path gate ended with '$GATE_RESULT', so the changed files are unknown."
          exit 1

      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0       # Needed for git diff to find changed files
          filter: blob:none    # Blobless clone: skip file contents for history;
                               # HEAD working tree is still materialized normally.

      - name: Setup Python Environment
        uses: ./.github/actions/setup_python
        with:
          full_deps: true  # Required for metadata_db export
          github_token: ${{ secrets.TOKEN_GITHUB_GDCLOUD }}

      # Resolve affected DPs: branch primary DP ∪ DPs from PR diff. A
      # `example_dp--x` PR that also touches `gd_data_product/sibling_dp/`
      # files fans out to both. Tooling-only PRs (no DP files, no branch DP)
      # fall through to --data-product-all below.
      - name: Detect affected data products
        id: dps
        uses: ./.github/actions/detect_dp_changes

      # Run all CI checks. gd-ci runs the offline LDM integrity check per DP
      # as a finding, then exports the metadata database with CI views
      # included. Individual checks can be enabled/disabled in
      # config.ci_checks.yml.
      #
      # --info-json in every path: a multi-DP run writes info_checks.<dp>.json
      # per DP (gd-ci names them, so DPs can't clobber). The check-findings PR
      # comment reads all of them plus the execution summary at info_checks.json;
      # the unused-objects comment stays single-DP.
      #
      # Multi-DP uses --data-product-id A B … (nargs='+'): gd-ci runs the
      # cross-DP checks (`shared_in_sync`) ONCE, then loops the per-DP checks
      # in one process. A failing product is recorded as a finding and the
      # loop continues, so one red product cannot hide the others.
      - name: Run CI Checks
        id: ci-checks
        env:
          DP_LIST: ${{ steps.dps.outputs.dp_list }}
          DP_COUNT: ${{ steps.dps.outputs.dp_count }}
          HAS_CHANGES: ${{ steps.dps.outputs.has_changes }}
          BASE_REF: ${{ github.base_ref }}
          PYTHONUNBUFFERED: '1'   # phase timestamps in the log stay real
        run: |
          REPORT_DIR=$(mktemp -d "$RUNNER_TEMP/gdcloud-ci-checks.XXXXXX")
          echo "report_dir=$REPORT_DIR" >> "$GITHUB_OUTPUT"
          if [[ "$HAS_CHANGES" != "true" ]]; then
            gd-ci run --data-product-all --base-branch "$BASE_REF" \
              --info-json "$REPORT_DIR/info_checks.json"
          elif [[ "$DP_COUNT" == "1" ]]; then
            read -r DP_ID _ <<< "$DP_LIST"
            gd-ci run \
              --data-product-id "$DP_ID" \
              --base-branch "$BASE_REF" \
              --info-json "$REPORT_DIR/info_checks.json"
          else
            # shellcheck disable=SC2086  # word-split DP_LIST into separate args
            gd-ci run --data-product-id $DP_LIST --base-branch "$BASE_REF" \
              --info-json "$REPORT_DIR/info_checks.json"
          fi

          # One extraction for every path: the unused-objects comment is
          # single-DP and reads the unsuffixed file. A sweep's unsuffixed file
          # holds only execution findings, so absent unused objects means zero.
          # Format: {"objects_not_used": {"visualizations": {...}, "total_count": N}}
          count=$(jq -r '.objects_not_used.total_count // 0' "$REPORT_DIR/info_checks.json" \
            2>/dev/null || echo 0)
          echo "objects_not_used_count=$count" >> "$GITHUB_OUTPUT"

      # Every failed check, plus any richer plugin renderer, in one sticky
      # comment. Deliberately runs after a red check; `posted` is
      # what separates "nothing blocks, mark the comment clean" from "the
      # check never got as far as writing a report", where a clean comment
      # would make a red PR look fixed.
      - name: Build check-findings comment body
        id: findings_comment
        if: ${{ !cancelled() && steps.ci-checks.outcome != 'skipped' }}
        env:
          REPORT_DIR: ${{ steps.ci-checks.outputs.report_dir }}
          CHECK_OUTCOME: ${{ steps.ci-checks.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          shopt -s nullglob
          reports=("$REPORT_DIR"/info_checks*.json)
          if [[ ${#reports[@]} -eq 0 ]]; then
            echo "No info-json report written - leaving any existing comment alone."
            echo "posted=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Render to a file first: a non-zero exit inside the heredoc group
          # would leave an unterminated delimiter in $GITHUB_OUTPUT, whose
          # opaque "Matching delimiter not found" buries the real error.
          gd-ci pr-comment "${reports[@]}" > comment.md
          if [[ "$CHECK_OUTCOME" != 'success' && ! -s comment.md ]]; then
            echo "CI checks failed before producing complete findings. See the check run." > comment.md
          fi
          if [[ -s comment.md ]]; then
            # shellcheck disable=SC2016  # literal Markdown backticks, not command substitution
            printf '\nCommit: `%s` · [Check run](%s)\n' "$HEAD_SHA" "$RUN_URL" >> comment.md
            cat comment.md >> "$GITHUB_STEP_SUMMARY"
          fi
          # Random delimiter: the body renders titles and ids taken from repo
          # YAML, which a pull request can edit. A line equal to a FIXED
          # delimiter would close the value early and let the rest parse as
          # further name=value output assignments.
          DELIM="STICKY_EOF_$(openssl rand -hex 16)"
          {
            echo "body<<$DELIM"
            cat comment.md
            echo "$DELIM"
          } >> "$GITHUB_OUTPUT"
          echo "posted=true" >> "$GITHUB_OUTPUT"

      # Gated on the build step succeeding: an empty body marks the comment clean,
      # so a failed render must leave the previous findings in place.
      - name: Post PR comment for check findings
        if: ${{ !cancelled() && steps.findings_comment.outputs.posted == 'true' }}
        uses: ./.github/actions/sticky_comment
        with:
          marker: '<!-- ci-check-findings -->'
          body: ${{ steps.findings_comment.outputs.body }}

      # PR comment is only meaningful when the run was single-DP — multi-DP
      # would need a comment-per-DP design we don't have today.
      - name: Build unused-objects comment body
        id: unused_comment
        if: >-
          steps.ci-checks.outputs.objects_not_used_count != '0' &&
          steps.dps.outputs.dp_count == '1'
        uses: actions/github-script@v9
        env:
          # Gated on dp_count == '1' above, so DP_LIST holds exactly one ID.
          DP_LIST: ${{ steps.dps.outputs.dp_list }}
          REPORT_DIR: ${{ steps.ci-checks.outputs.report_dir }}
        with:
          script: |
            const fs = require('fs');
            const infoChecks = JSON.parse(fs.readFileSync(`${process.env.REPORT_DIR}/info_checks.json`, 'utf8'));
            const unusedObjects = infoChecks.objects_not_used || {};
            const unusedViz = unusedObjects.visualizations?.items || [];
            const unusedFC = unusedObjects.filter_contexts?.items || [];

            function renderTable(items, heading, description, dirName) {
              if (!items.length) return '';
              let s = `### ${heading} (${items.length})\n\n${description}:\n\n`;
              s += '| Title | File |\n|-------|------|\n';
              for (const item of items) {
                s += `| ${item.title || '(no title)'} | \`${dirName}/${item.id}.yaml\` |\n`;
              }
              return s + '\n';
            }

            const dpId = process.env.DP_LIST.trim();
            let body = `## Unused Objects\n\n`;
            body += `Data product: \`${dpId}\`\n\n`;
            body += renderTable(unusedViz, 'Visualizations', 'Not placed on any dashboard', 'visualization_objects');
            body += renderTable(unusedFC, 'Filter Contexts', 'Not used by any dashboard', 'filter_contexts');
            body += '**Note:** This is informational only. Unused objects may be intentional.';
            core.setOutput('body', body);
            await core.summary.addRaw(body).write();

      - name: Post PR comment for unused objects
        if: >-
          steps.ci-checks.outputs.objects_not_used_count != '0' &&
          steps.dps.outputs.dp_count == '1'
        uses: ./.github/actions/sticky_comment
        with:
          marker: '<!-- objects-not-used-check -->'
          body: ${{ steps.unused_comment.outputs.body }}

      # An empty body tells sticky_comment to mark its comment clean. Without
      # this, a clean rerun leaves an obsolete unused-object report on the PR.
      - name: Remove stale unused-objects comment
        if: >-
          steps.ci-checks.outputs.objects_not_used_count == '0' &&
          steps.dps.outputs.dp_count == '1'
        uses: ./.github/actions/sticky_comment
        with:
          marker: '<!-- objects-not-used-check -->'
          body: ''

      - name: Show fix instructions if check fails
        if: failure()
        env:
          DP_LIST: ${{ steps.dps.outputs.dp_list }}
        run: |
          echo "CI check(s) failed!"
          echo ""
          if [[ -n "$DP_LIST" ]]; then
            echo "Affected data products: $DP_LIST"
            echo ""
            echo "Run locally to debug:"
            echo "  gd-ci run --data-product-id $DP_LIST --all"
            echo ""
            echo "Check configuration in:"
            for dp in $DP_LIST; do
              echo "  gd_data_product/${dp}/config.ci_checks.yml"
            done
          else
            echo "Affected data products: (all)"
            echo ""
            echo "Run locally to debug:"
            echo "  gd-ci run --data-product-all --all"
          fi
