# Generated by `gd-workflows adopt`; edit config.yml or gd-cloud-tooling,
# not this package-owned workflow. Re-run `make dev` after a pin change.
name: Auto-Update en-US Translation Source
run-name: "Auto-update en-US source @ ${{ github.ref_name }} (${{ github.sha }})"

# en-US.yml is a pure mechanical extraction of the DP model's translatable
# strings (gd-translate generate --english-only) — never hand-authored, only
# rubber-stamped. So we regenerate it post-merge and auto-commit, the same way
# tag docs are handled (auto_update_tag_docs.yml), instead of a staleness gate.
# Batch/deploy never touch en-US.yml, so without this it silently drifts from
# the model whenever a dashboard/metric/LDM change lands without a manual regen.

on:
  push:
    branches:
      - master
      - main
    paths:
      # The model that get_texts_to_translate reads (titles/descriptions/labels)
      - 'gd_data_product/**/analytics_model/**'
      - 'gd_data_product/**/ldm/**'
      # en-US source itself (catches a manual edit so regen overwrites it)
      - 'gd_data_product/**/translations/en-US.yml'
      # Extraction code — a change here can change what strings are emitted

# Serialize so back-to-back merges don't race when pushing the auto-commit.
  workflow_call:

concurrency:
  group: auto-update-en-us
  cancel-in-progress: false

jobs:
  update-en-us:
    if: ${{ github.repository == '__gdcloud_disabled__' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Required when the built-in GITHUB_TOKEN commits updates

    steps:
      # First checkout with default token so load_config can read repo content.
      - name: Initial Checkout
        uses: actions/checkout@v7

      - name: Setup Python Environment
        uses: ./.github/actions/setup_python
        with:
          github_token: ${{ secrets.TOKEN_GITHUB_GDCLOUD }}

      - name: Load Configuration
        uses: ./.github/actions/load_config
        with:
          # Pinned load_config emits these only when requested; unrequested reads "".
          keys: "slack_webhook_variable"
        id: config

      # Re-checkout with config token so we can push the auto-commit back to master.
      # This wipes .venv via git clean, so we reinstall after.
      - name: Checkout With Config Token
        uses: actions/checkout@v7
        with:
          token: ${{ secrets[steps.config.outputs.github_token_variable] }}

      - name: Reinstall Python Environment
        uses: ./.github/actions/setup_python
        with:
          github_token: ${{ secrets.TOKEN_GITHUB_GDCLOUD }}

      # Where extraction records any unclassified widget-content blob it had to
      # pass through to the translators (see the Slack step). Exported through
      # $GITHUB_ENV rather than declared in jobs.<id>.env, because the `runner`
      # context is not available there — and $RUNNER_TEMP survives the second
      # checkout's git clean, which a path inside the workspace would not.
      - name: Set blob-report path
        run: echo "TRANSLATION_BLOB_REPORT=$RUNNER_TEMP/blob_warnings.jsonl" >> "$GITHUB_ENV"

      # Regenerate all configured translation DPs; commit only changed sources.
      - name: Regenerate and commit en-US sources
        uses: ./.github/actions/regenerate_and_commit
        with:
          command: |
            DPS=$(python -c "from gdcloud.utils.config import get_translations_data_products as g; print(' '.join(g()))")
            echo "Translation-enabled data products: $DPS"
            for dp in $DPS; do
              gd-translate generate --english-only --local --data-product-id "$dp" --no-zip
            done
          paths: gd_data_product/*/translations/en-US.yml
          commit-message: "chore(translations): auto-update en-US source [skip ci]"
          actor: ${{ github.actor }}

      # An unclassified blob means a new widget type is being shipped to the
      # translators with its JSON keys intact — they come back translated and the
      # widget renders as raw text (an upstream ticket). The ::warning:: annotation this
      # also emits is invisible in practice: nobody opens an auto-commit run. So
      # ping the channel instead, naming the type to classify.
      - name: Build blob-warning payload
        id: blobs
        run: |
          set -euo pipefail
          # Read the path from the runner environment, NOT an env context
          # $GITHUB_ENV write lands in the runner's environment for later steps,
          # and whether it also reaches the `env` expression context is exactly
          # the kind of subtlety not to bet on here — an empty REPORT makes the
          # -s test pass and the Slack ping silently never fires, which is the
          # failure mode this whole step exists to prevent.
          REPORT="${TRANSLATION_BLOB_REPORT:-}"
          if [[ -z "$REPORT" ]]; then
            echo "::warning::TRANSLATION_BLOB_REPORT unset — blob reporting did not run."
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ ! -s "$REPORT" ]]; then
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "✅ No unclassified translation blobs."
            exit 0
          fi
          echo "found=true" >> "$GITHUB_OUTPUT"
          # One line per (data product, blob type); the extractor already dedups
          # per type, so this is a handful of rows at most.
          LINES=$(jq -rs 'map("• `" + .data_product_id + "` — " + .signature)
                          | unique | join("\n")' "$REPORT")
          PAYLOAD=$(jq -nc \
            --arg lines "$LINES" \
            --arg url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            '[
              {type: "section", text: {type: "mrkdwn",
                text: ("Unclassified widget-content blob(s) in the en-US source:\n" + $lines)}},
              {type: "section", text: {type: "mrkdwn",
                text: ("Their JSON keys go to the translators verbatim and come back translated, breaking the widget. Classify each in the toolkit (gdcloud translations constants) before the next `delta --emit`.  |  <" + $url + "|Run log>")}}
            ]')
          echo "json=$PAYLOAD" >> "$GITHUB_OUTPUT"

      - name: Notify Slack
        if: steps.blobs.outputs.found == 'true'
        uses: ./.github/actions/notify_slack
        with:
          webhook_url: ${{ secrets[steps.config.outputs.slack_webhook_variable] }}
          header: "⚠️ Unclassified translation blob"
          payload: ${{ steps.blobs.outputs.json }}
