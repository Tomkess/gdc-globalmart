# Generated by `gd-workflows adopt`; edit config.yml or gd-cloud-tooling,
# not this package-owned workflow. Re-run `make dev` after a pin change.
name: CI Payload Check

# Fails the PR when the toolkit's LIVE CI payload — `.github/scripts/` and the
# vendored `.github/actions/` — no longer matches what the pinned `gdcloud`
# ships. Adoption overwrites those wholesale, so a local edit there is either
# about to be reverted or is a fix that never landed here. Differing workflow
# templates are listed for information only: a template is a copy the project
# owns (see gdcloud/workflow_options/README.md in gd-cloud-tooling).
#
# NOTE: do NOT add `paths:` here. GitHub evaluates trigger-level path filters
# against the synchronize push delta, not the PR's full diff vs base, so a
# rebase that does not re-touch the gated paths would skip the check even when
# the PR carries those changes overall. The path-aware gate is pr_path_gate.yml.
on:
  pull_request:
    types: [opened, synchronize, reopened]

  workflow_call:

jobs:
  # Runs on every PR and exposes `changed` to the downstream job, which then
  # reports a true "Skipped" on PRs that touch neither the CI nor the pin.
  gate:
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/pr_path_gate.yml
    permissions:
      contents: read       # Ceiling for the called workflow's token
    with:
      patterns: '^(\.github/.*|pyproject\.toml|uv\.lock)$'

  check-ci-payload:
    needs: gate
    if: github.event_name == 'pull_request' && needs.gate.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Python Environment
        uses: ./.github/actions/setup_python
        with:
          github_token: ${{ secrets.TOKEN_GITHUB_GDCLOUD }}

      # Vendoring is detected from the checkout, so the same command is right
      # for a project that references the toolkit's actions remotely and for
      # one that copied them in.
      - name: Compare the CI payload with the pinned toolkit
        run: gd-workflows adopt . --check

      # Covers the project's OWN workflows too, which no test in the toolkit
      # can see. Runs even when the payload differs, so both reports land.
      - name: Check the PR-diff contract
        if: always()
        run: gd-workflows contracts .

      - name: Show fix instructions if check fails
        if: failure()
        run: |
          echo "The CI payload in this repo differs from the pinned gdcloud."
          echo ""
          echo "Take the toolkit's version back:"
          echo "  make adopt          # or: uv run gd-workflows adopt ."
          echo ""
          echo "Then commit the result. A change that must stay local belongs"
          echo "in a workflow of this project, not in .github/actions or"
          echo ".github/scripts — those are overwritten on every adopt."
          echo ""
          echo "If the PR-diff contract failed instead, run it locally:"
          echo "  uv run gd-workflows contracts ."
