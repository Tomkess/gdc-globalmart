# Generated by `gd-workflows adopt`; edit config.yml or gd-cloud-tooling,
# not this package-owned workflow. Re-run `make dev` after a pin change.
name: Changed Metrics AFM Smoke

# Runs `gd-validate afm metric --changed` against dev on every PR that
# touches a data-product metric YAML. Catches backend MAQL / dimensionality
# errors that ldm-integrity (structural) and objects_non_existent (reference
# existence) do not — e.g. a country_code vs country_code_alt
# bug.
#
# Parallel by default (afm.smoke's API_MAX_WORKERS=5). Untouched DPs return
# 0 items instantly under --data-product-all, so cross-DP PRs are not slow.
#
# Shared-library changes (gd_data_product_shared/**) are
# intentionally NOT triggers — those fan out across opted-in DPs and need
# a different sampling strategy (separate follow-up).

# NOTE: do NOT add `paths:` here. GitHub evaluates trigger-level path filters
# against the synchronize push delta, not the PR's full diff vs base — after
# a rebase that doesn't re-touch metrics in the new push, the workflow would
# silently skip even when the PR carries metric changes overall (see PR #1075
# for the model_validation regression). The path-aware gate is implemented
# below via `check_pr_paths`, which queries the PR's full diff and
# short-circuits cheaply.
on:
  pull_request:
    types: [opened, synchronize, reopened]

  workflow_call:

jobs:
  # Cheap gate that runs on every PR and exposes `changed` to the downstream
  # `afm-smoke` job. Two-job layout (rather than a single job with per-step
  # `if:` guards) is what gives the downstream job a true "Skipped" status on
  # PRs without metric changes — GitHub then groups it under the collapsed
  # "X skipped checks" panel instead of reporting a misleading "Successful in
  # 10s" run. Gate mechanics live in pr_path_gate.yml.
  gate:
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/pr_path_gate.yml
    permissions:
      contents: read       # Ceiling for the called workflow's token
    with:
      patterns: '^gd_data_product/[^/]+/analytics_model/metrics/.+\.yaml$'

  afm-smoke:
    needs: gate
    if: github.event_name == 'pull_request' && needs.gate.outputs.changed == 'true'
    runs-on: ubuntu-latest
    environment:
      name: ${{ fromJSON('{"dev":"develop","test":"staging","preprod":"preprod","prod":"production"}')['dev'] }}
      deployment: false
    permissions:
      contents: read
    env:
      # CI=true suppresses interactive prompts in shared helpers (e.g.
      # setup_token_for_env). afm-smoke's current arg surface explicitly
      # supplies --env and --data-product-id / --data-product-all, so no
      # prompt fires today — set this defensively per project convention
      # (matches model_validation.yml and other PR-time workflows).
      CI: true

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0       # afm-smoke --changed needs git diff vs base
          filter: blob:none

      - name: Setup Python Environment
        uses: ./.github/actions/setup_python
        with:
          github_token: ${{ secrets.TOKEN_GITHUB_GDCLOUD }}
        # afm.smoke only needs core deps (requests + gooddata-sdk) — no export.

      - name: Load Configuration
        id: config
        uses: ./.github/actions/load_config
        with:
          environment: dev

      # Resolve affected DPs: branch primary DP ∪ DPs from PR diff. The gate
      # above already guaranteed at least one metric YAML changed, so
      # `changed` here is effectively always true.
      - name: Detect affected data products
        id: dps
        uses: ./.github/actions/detect_dp_changes

      # BASE_REF lifted to env: so user-controlled values don't reach `run:`
      # via direct GH expression interpolation (GitHub security hardening guidance).
      #
      # The outer `gate` job already required changed==true (a metric YAML
      # diff), and every metric YAML lives under gd_data_product/<dp>/, so
      # detect_dp_changes will always surface at least one DP here. No
      # --data-product-all fallback is needed.
      #
      # Multi-DP uses --data-product-id A B … (nargs='+') to keep work inside
      # one Python process; per-DP iteration happens in afm/metric.py via
      # args.selected_data_products. Each DP pays one workspace-existence
      # probe even if `--changed` finds zero metrics for it — acceptable
      # overhead (single HTTP call per DP) and keeps the workflow oblivious
      # to which DP owns which touched file.
      #
      # --cap 50 bounds the per-PR cost. A bulk refactor that touches 200
      # metrics would otherwise burn ~10 minutes of CI before the first
      # failure surfaces; with --cap 50 the first failures show up in
      # ~2.5 minutes. The remaining 150 still get coverage locally via
      # `gd-validate precommit` (which never passes --cap) — the cap keeps CI
      # actionable, not as a correctness shortcut. The MAQL-content filter
      # in `_get_changed_metric_ids` further trims tag-only edits before
      # the cap even applies, so the typical PR fits well under 50.
      - name: AFM smoke on changed metrics
        env:
          TOKEN_GOODDATA: ${{ secrets.TOKEN_GOODDATA }}
          BASE_REF: ${{ github.base_ref }}
          # HEAD_REF is the PR's source branch (e.g. 'sibling_dp--feature').
          # pull_request checkouts are detached HEAD so afm-smoke's git-based
          # branch auto-detect returns None; passing --branch explicitly
          # routes the workspace probe to '{dp}_master--<suffix>' instead of
          # the parent '{dp}_master'. Net-new metrics on a feature branch
          # don't exist in the parent until master deploy, so probing the
          # parent would 404 them all and produce a misleading red signal.
          # On non-DP branches (no '{dp}--' prefix) the resolved workspace
          # ends up as the parent — afm-smoke skips with a clear message in
          # --changed mode instead of failing.
          HEAD_REF: ${{ github.head_ref }}
          DP_LIST: ${{ steps.dps.outputs.dp_list }}
        run: |
          # Defensive: the gate said changed=true, so DP_LIST must be
          # non-empty. Without this guard the CLI receives `--data-product-id`
          # with zero values and argparse errors out unhelpfully — explicit
          # error message makes the misconfiguration obvious.
          if [[ -z "$DP_LIST" ]]; then
            echo "::error::gate passed (changed=true) but detect_dp_changes resolved zero DPs"
            exit 1
          fi
          # shellcheck disable=SC2086  # word-split DP_LIST into separate args
          gd-validate afm metric --changed \
            --base-branch "$BASE_REF" \
            --branch "$HEAD_REF" \
            --env dev \
            --cap 50 \
            --data-product-id $DP_LIST

      - name: Show fix instructions if check fails
        if: failure()
        env:
          DP_COUNT: ${{ steps.dps.outputs.dp_count }}
        run: |
          echo "AFM smoke on changed metrics FAILED."
          echo ""
          echo "A metric you touched failed to execute against dev. This is"
          echo "the bug class neither ldm-integrity nor objects_non_existent catches"
          echo "(e.g. MAQL referencing a label that does not belong to the"
          echo "dataset being counted)."
          echo ""
          echo "Reproduce locally (auto-detects DP from your branch):"
          echo "  gd-validate precommit"
          echo "  # or:"
          echo "  gd-validate afm metric --changed --env dev"
          echo ""
          echo "Or target a single metric directly:"
          if [[ "$DP_COUNT" == "1" ]]; then
            echo "  gd-validate afm metric --id <metric_id> --env dev"
          else
            echo "  gd-validate afm metric --id <metric_id> --data-product-id <dp> --env dev"
          fi
          echo ""
          echo "Server-side failure (5xx, \"Server-side problem\", or a read timeout)?"
          echo "The log above ends with a ready-to-run \"/afm-trace <id>\" line per"
          echo "failure. Those ids are W3C traces the backend adopted, so the trace"
          echo "exists in Loki whether or not the request came back. CI cannot read"
          echo "Loki — copy the line and run it locally (needs the base-observability"
          echo "MCP connected; see skills/afm-trace/)."
