# Generated by `gd-workflows adopt`; edit config.yml or gd-cloud-tooling,
# not this package-owned workflow. Re-run `make dev` after a pin change.
name: 3 - Automated deployment to Master (on merge)
# The title is a trigger-time hint; labels resolved by the scope job decide deployment.
run-name: >-
  3: ${{ !github.event.pull_request.merged && 'Closed' || contains(github.event.pull_request.head.ref, '--') && 'Deploy' || 'Merge' }} — ${{ github.event.pull_request.title }}

on:
  pull_request:
    types: [closed]

  workflow_call:

# Apply `set -euo pipefail` to every inline `run:` block in this workflow.
# GH Actions' default for composite `bash` is `-eo pipefail` only; without -u
# a future edit that drops a `:-default` accessor on an env-routed var (every
# step here lifts inputs into env:) would expand to empty and silently
# no-op a fan-out loop instead of failing loud.
concurrency:
  group: deploy-to-master
  cancel-in-progress: false

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

jobs:
  # PR labels define release scope; the branch DP independently defines cleanup.
  check-dp-changes:
    runs-on: ubuntu-latest
    if: github.event.pull_request.merged == true
    permissions:
      contents: read
      pull-requests: read
    outputs:
      data_products: ${{ steps.dps.outputs.data_products }}
      has_changes: ${{ steps.dps.outputs.has_changes }}
      primary_dp: ${{ steps.dps.outputs.primary_dp }}
      org_changed: ${{ steps.org.outputs.changed }}
      primary_branch: ${{ steps.config.outputs.branch }}
      default_branch: ${{ steps.config.outputs.default_branch }}
      github_token_variable: ${{ steps.config.outputs.github_token_variable }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          # Full history, blobless: the org path gate diffs the PR's own commits.
          fetch-depth: 0
          filter: blob:none

      - name: Setup Python Environment
        uses: ./.github/actions/setup_python
        with:
          github_token: ${{ secrets.TOKEN_GITHUB_GDCLOUD }}

      - name: Load Configuration
        uses: ./.github/actions/load_config
        id: config
        with:
          environment: dev

      - name: Resolve release scope from PR labels
        id: dps
        uses: ./.github/actions/detect_dp_changes
        with:
          source: labels

      # A squash or rebase merge leaves the PR head out of the merge commit's
      # history, and its branch may be deleted; GitHub keeps refs/pull/N/head.
      - name: Fetch the PR head
        if: ${{ github.repository == '__gdcloud_disabled__' }}
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: git fetch --no-tags --filter=blob:none origin "+refs/pull/${PR_NUMBER}/head:refs/remotes/origin/pr-head"

      # Org objects are released by path, not label: gd_organization/ changed.
      - name: Detect org changes
        id: org
        if: ${{ github.repository == '__gdcloud_disabled__' }}
        uses: ./.github/actions/check_pr_paths
        with:
          patterns: '^gd_organization/'
          base_sha: ${{ github.event.pull_request.base.sha }}
          head_sha: ${{ github.event.pull_request.head.sha }}

  # Before the data products deploy: their content can point at org objects
  # (a workspace's ACTIVE_THEME, an export template).
  deploy-org:
    name: Upload org objects
    needs: [check-dp-changes, prepare-release]
    if: ${{ needs.check-dp-changes.outputs.org_changed == 'true' && needs.prepare-release.result == 'success' }}
    runs-on: ubuntu-latest
    environment: ${{ fromJSON('{"dev":"develop","test":"staging","preprod":"preprod","prod":"production"}')['dev'] }}
    permissions:
      contents: write  # deploy-dev-org-<version> tracking tag
    env:
      TOKEN_GOODDATA: ${{ secrets.TOKEN_GOODDATA }}
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-tags: true

      - name: Setup Python Environment
        uses: ./.github/actions/setup_python
        with:
          github_token: ${{ secrets.TOKEN_GITHUB_GDCLOUD }}

      - name: Upload org objects to dev
        uses: ./.github/actions/org_upload
        with:
          environment: dev
          version: ${{ needs.prepare-release.outputs.version }}
          allow_empty: 'true'

      - name: Track org release
        uses: ./.github/actions/version_management
        with:
          action: track_deployment
          environment: dev
          data_product_id: org
          version: ${{ needs.prepare-release.outputs.version }}
          github_token: ${{ secrets[needs.check-dp-changes.outputs.github_token_variable] }}
          skip_setup: 'true'

  # Feature-workspace cleanup runs independently of deploy scope.
  #
  # The workspace was provisioned at PR creation (workflow 1) tied to the
  # branch name, not to deploy labels. If the merged PR ends up with a
  # label set that doesn't include the branch DP (e.g. `TOOLING`-only PR
  # on a `example_dp--cleanup` branch — diff turned out to be pure
  # tooling, no analytics content shipped), the deploy job below is skipped,
  # but the feature workspace still needs to be reaped. Keeping cleanup
  # in its own job decouples "what gets shipped" (labels) from "what gets
  # garbage-collected" (branch name) so neither concern starves the other.
  cleanup-feature-workspace:
    needs: check-dp-changes
    if: needs.check-dp-changes.outputs.primary_dp != ''
    runs-on: ubuntu-latest
    environment: ${{ fromJSON('{"dev":"develop","test":"staging","preprod":"preprod","prod":"production"}')['dev'] }}
    permissions:
      contents: read
    env:
      TOKEN_GOODDATA: ${{ secrets.TOKEN_GOODDATA }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}

      - name: Setup Python Environment
        uses: ./.github/actions/setup_python
        with:
          github_token: ${{ secrets.TOKEN_GITHUB_GDCLOUD }}

      # Safety net: snapshot the feature workspace layout before we reap it.
      # Mirrors the backup-before-mutate step in workflow 2b
      # (`gd-backup --data-product-id … --branch …`, the feature-workspace path
      # that resolves the same `<dp>_master--<suffix>` id `gd-delete --branch`
      # targets below). If someone realises after merge that the branch
      # workspace still held wanted state, it's recoverable from the artifact.
      # Runs before the delete on purpose: a hard backup failure stops the job
      # before anything is destroyed. A non-existent workspace is a skip (exit
      # 0), so this never blocks cleanup spuriously.
      - name: Backup Feature Workspace (pre-delete safety net)
        env:
          TOKEN_GOODDATA: ${{ secrets.TOKEN_GOODDATA }}
          PRIMARY_DP: ${{ needs.check-dp-changes.outputs.primary_dp }}
          PRIMARY_BRANCH: ${{ needs.check-dp-changes.outputs.primary_branch }}
        run: |
          gd-backup \
            --environment dev \
            --data-product-id "$PRIMARY_DP" \
            --branch "$PRIMARY_BRANCH" \
            --output-dir backups

      - name: Upload Feature Workspace Backup
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: feature-workspace-backup-dev-${{ needs.check-dp-changes.outputs.primary_dp }}-${{ github.run_number }}-${{ github.run_attempt }}
          path: backups/
          retention-days: 30
          if-no-files-found: warn

      - name: Delete Feature Branch Workspace
        env:
          PRIMARY_DP: ${{ needs.check-dp-changes.outputs.primary_dp }}
          PRIMARY_BRANCH: ${{ needs.check-dp-changes.outputs.primary_branch }}
        run: |
          gd-delete \
            --environment dev \
            --data-product-id "$PRIMARY_DP" \
            --branch "$PRIMARY_BRANCH"

  # A version is cut for data-product changes and for org changes alike, so an
  # org-only merge still gets a tag for 4a/5a to release.
  prepare-release:
    needs: check-dp-changes
    if: >-
      ${{ needs.check-dp-changes.outputs.has_changes == 'true'
        || needs.check-dp-changes.outputs.org_changed == 'true' }}
    runs-on: ubuntu-latest
    environment: ${{ fromJSON('{"dev":"develop","test":"staging","preprod":"preprod","prod":"production"}')['dev'] }}
    permissions:
      contents: write
    outputs:
      version: ${{ steps.create-version.outputs.version }}
      previous_version: ${{ steps.create-version.outputs.previous_version }}
    env:
      DATA_PRODUCTS: ${{ needs.check-dp-changes.outputs.data_products }}
      DEFAULT_BRANCH: ${{ needs.check-dp-changes.outputs.default_branch }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-tags: true

      - name: Setup Python Environment
        uses: ./.github/actions/setup_python
        with:
          github_token: ${{ secrets.TOKEN_GITHUB_GDCLOUD }}

      - name: Validate independent deployment targets
        if: ${{ needs.check-dp-changes.outputs.has_changes == 'true' }}
        run: python .github/scripts/deployment_results.py validate-targets

      - name: Create Version Tag
        id: create-version
        uses: ./.github/actions/version_management
        with:
          action: create_tag
          github_token: ${{ secrets[needs.check-dp-changes.outputs.github_token_variable] }}
          skip_setup: 'true'

      - name: Pre-deployment Plan
        if: ${{ needs.check-dp-changes.outputs.has_changes == 'true' }}
        env:
          VERSION: ${{ steps.create-version.outputs.version }}
          PREVIOUS_VERSION: ${{ steps.create-version.outputs.previous_version }}
        run: python .github/scripts/deployment_results.py plan

  deploy:
    name: Deploy released data product
    needs: [check-dp-changes, prepare-release, deploy-org]
    # Waits for the org upload when it ran; only a failed one blocks.
    if: >-
      ${{ !cancelled()
        && needs.check-dp-changes.outputs.has_changes == 'true'
        && needs.prepare-release.result == 'success'
        && needs.deploy-org.result != 'failure' }}
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        data_product_id: ${{ fromJSON(needs.check-dp-changes.outputs.data_products) }}
    runs-on: ubuntu-latest
    environment: ${{ fromJSON('{"dev":"develop","test":"staging","preprod":"preprod","prod":"production"}')['dev'] }}
    permissions:
      actions: write
      contents: write
      pull-requests: read
    env:
      TOKEN_GOODDATA: ${{ secrets.TOKEN_GOODDATA }}
      DATA_PRODUCT_ID: ${{ matrix.data_product_id }}
      VERSION: ${{ needs.prepare-release.outputs.version }}
      DEPLOY_COMMIT: ${{ github.event.pull_request.merge_commit_sha }}
      DEFAULT_BRANCH: ${{ needs.check-dp-changes.outputs.default_branch }}
      VERSION_COMPARISON_ENABLED: ${{ github.repository != '__gdcloud_disabled__' }}
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-tags: true

      - name: Setup Python Environment
        id: setup
        uses: ./.github/actions/setup_python
        with:
          github_token: ${{ secrets.TOKEN_GITHUB_GDCLOUD }}

      - name: Changelog (PRs since last deployment)
        env:
          GH_TOKEN: ${{ github.token }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          # DP IDs may contain hyphens, so timestamp fields are counted from the end.
          PREV_TAG=$(
            git tag -l "deploy-dev-${DATA_PRODUCT_ID}-v*" |
              while IFS= read -r tag; do
                printf '%s\t%s\n' "${tag: -15}" "$tag"
              done |
              sort -k1,1 -k2,2V |
              tail -1 |
              cut -f2- || true
          )
          FROM_VERSION=$(echo "$PREV_TAG" | grep -oP 'v\d+\.\d+(\.\d+)?' || true)
          if [[ -z "$PREV_TAG" ]]; then
            echo "First dev deployment for $DATA_PRODUCT_ID" >> "$GITHUB_STEP_SUMMARY"
          elif [[ -n "$FROM_VERSION" && "$FROM_VERSION" != "$VERSION" ]]; then
            gd-version --data-product-id "$DATA_PRODUCT_ID" \
              --changelog "$FROM_VERSION" --version "$VERSION" \
              --repo-url "$REPO_URL" || true
          fi

      - name: Deploy Data Product
        id: upload
        timeout-minutes: 20
        run: |
          gd-upload --environment dev --data-product-id "$DATA_PRODUCT_ID" \
            --branch "$DEFAULT_BRANCH"

      # Tracking verifies the tag exists; this also binds it to the uploaded commit.
      - name: Fetch shared release version
        id: fetch-version
        if: ${{ !cancelled() && steps.upload.outcome == 'success' }}
        run: |
          git fetch --no-tags origin "refs/tags/$VERSION:refs/tags/$VERSION"
          if [[ "$(git rev-parse "$VERSION^{commit}")" != "$DEPLOY_COMMIT" ]]; then
            echo "::error::Release tag does not point to the deployed commit"
            exit 1
          fi

      - name: Track Deployment
        id: track
        if: ${{ !cancelled() && steps.upload.outcome == 'success' && steps.fetch-version.outcome == 'success' }}
        uses: ./.github/actions/version_management
        with:
          action: track_deployment
          version: ${{ needs.prepare-release.outputs.version }}
          environment: dev
          data_product_id: ${{ matrix.data_product_id }}
          github_token: ${{ secrets[needs.check-dp-changes.outputs.github_token_variable] }}
          skip_setup: 'true'

      # Follow-ups read live workspace state, so a failed tracking tag must not block them.
      - name: Trigger Version Comparison
        id: comparison
        if: ${{ !cancelled() && steps.upload.outcome == 'success' && github.repository != '__gdcloud_disabled__' }}
        uses: ./.github/actions/trigger_version_comparison
        with:
          data_product_id: ${{ matrix.data_product_id }}
          environment: dev
          trigger_reason: Merge to master deployment (Workflow 3)
          default_branch: ${{ needs.check-dp-changes.outputs.default_branch }}
          github_token: ${{ secrets[needs.check-dp-changes.outputs.github_token_variable] }}

      # Setup failures leave no artifact; collection reports the missing DP.
      - name: Record deployment result
        if: ${{ always() && steps.setup.outcome == 'success' }}
        env:
          UPLOAD_OUTCOME: ${{ steps.upload.outcome }}
          TRACK_OUTCOME: ${{ steps.track.outcome }}
          COMPARISON_OUTCOME: ${{ steps.comparison.outcome }}
        run: python .github/scripts/deployment_results.py record

      - name: Publish deployment result
        if: ${{ always() && steps.setup.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: deployment-result-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.data_product_id }}
          path: deployment-result.json
          if-no-files-found: error
          retention-days: 14

  finish-deployment:
    needs: [check-dp-changes, prepare-release, deploy, cleanup-feature-workspace]
    if: ${{ !cancelled() && needs.check-dp-changes.result == 'success' && needs.check-dp-changes.outputs.has_changes == 'true' }}
    runs-on: ubuntu-latest
    environment: ${{ fromJSON('{"dev":"develop","test":"staging","preprod":"preprod","prod":"production"}')['dev'] }}
    permissions:
      actions: write
      contents: read
    env:
      DATA_PRODUCTS: ${{ needs.check-dp-changes.outputs.data_products }}
      VERSION: ${{ needs.prepare-release.outputs.version }}
      DEPLOY_COMMIT: ${{ github.event.pull_request.merge_commit_sha }}
      VERSION_COMPARISON_ENABLED: ${{ github.repository != '__gdcloud_disabled__' }}
      METADATA_EXPORT_ENABLED: ${{ github.repository == '__gdcloud_disabled__' }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}

      - name: Setup Python Environment
        id: setup
        uses: ./.github/actions/setup_python
        with:
          github_token: ${{ secrets.TOKEN_GITHUB_GDCLOUD }}

      # Keep artifact directories separate: flattening could hide duplicate DP records.
      - name: Download deployment results
        uses: actions/download-artifact@v8
        with:
          pattern: deployment-result-${{ github.run_id }}-${{ github.run_attempt }}-*
          path: deployment-results

      - name: Collect deployment results
        id: collect
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: python .github/scripts/deployment_results.py collect

      # One explicit subset export, even if another DP or its tracking failed.
      - name: Trigger Metadata Export
        id: export
        if: ${{ !cancelled() && github.repository == '__gdcloud_disabled__' && steps.collect.outputs.successful_dps != '' }}
        env:
          GH_TOKEN: ${{ secrets[needs.check-dp-changes.outputs.github_token_variable] }}
          SUCCESSFUL_DPS: ${{ steps.collect.outputs.successful_dps }}
          DISPATCH_REF: ${{ needs.check-dp-changes.outputs.default_branch }}
        run: |
          gh workflow run ops_db_export.yml \
            --ref "$DISPATCH_REF" \
            -f environment="dev" \
            -f publish_pages="true" \
            -f data_product_ids="$SUCCESSFUL_DPS"

      - name: Deployment Summary
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        env:
          DEPENDENCIES: ${{ toJSON(needs) }}
          COLLECTION_OUTCOME: ${{ steps.collect.outcome }}
          EXPORT_OUTCOME: ${{ steps.export.outcome }}
        run: python .github/scripts/deployment_results.py summary
