# Generated by `gd-workflows adopt`; edit config.yml or gd-cloud-tooling,
# not this package-owned workflow. Re-run `make dev` after a pin change.
name: Auto - Scheduled model validation

# Weekday validation scope comes from config.yml: flagged DPs crossed with each
# environment's declared passes. `ldm-deploy` compares local LDM to remote PDM;
# `ldm-sql` executes dataset SQL to catch view-compilation errors;
# `overrides-check` (dev only) reports env overrides whose base source now
# resolves on its own — the one thing ldm-deploy structurally cannot see, since
# it applies the override before comparing. `alias-drift` (every env) reports a
# `LEGACY AS CANONICAL` rename whose target column the source table already has;
# it reads the env-resolved LDM, so it covers the committed base SQL that
# overrides-check, scoped to override entries, is blind to.
#
# One job per environment warms the PDM cache once, then reuses it across DPs.
# Preprod covers prod's shared PDM, avoiding production warehouse load.
# Failures notify SLACK_WEBHOOK_PR; clean runs are silent.

on:
  schedule:
    # Target: START within 06:30–07:30 local (CET/CEST), and NEVER before 06:30.
    # GitHub cron is UTC-only and ignores DST, so "06:30 local" is a different
    # UTC time per season: 05:30 UTC in winter (CET, UTC+1), 04:30 UTC in summer
    # (CEST, UTC+2). We register BOTH slots and let the `gate` job below proceed
    # only for the one that is actually 06:30 local in the current season
    # (matched on github.event.schedule + the live Europe/Berlin UTC offset).
    # The off-season firing (05:30 local in winter / 07:30 local in summer) is
    # skipped, so exactly one run/day starts at 06:30 local. Cron never fires
    # early and the gate imposes NO upper bound, so a delayed GitHub run (the
    # scheduler can drift well past an hour) still proceeds — never before
    # 06:30, late-tolerant.
    - cron: '30 4 * * 1-5'   # 04:30 UTC = 06:30 CEST (summer) / 05:30 CET (winter)
    - cron: '30 5 * * 1-5'   # 05:30 UTC = 07:30 CEST (summer) / 06:30 CET (winter)
  # Manual trigger for testing the scheduled path on demand.
  workflow_dispatch: {}

  workflow_call:

concurrency:
  group: scheduled-model-validation
  cancel-in-progress: false

permissions:
  contents: read       # Required for checkout
  actions: read        # Required by setup job's inline Python / load_config

jobs:
  # Local-time gate. Two crons are registered (see `on.schedule` above) so one
  # lands at 06:30 local in each DST season; this job proceeds only for the slot
  # that is genuinely 06:30 local now and drops the off-season firing, so exactly
  # one run/day continues. Manual (`workflow_dispatch`) runs always proceed.
  # No upper time bound: a delayed scheduled run on the intended cron still
  # proceeds (never-early, late-tolerant).
  gate:
    # Keep the weekday schedule dormant unless explicitly enabled, while
    # retaining workflow_dispatch as an on-demand validation path.
    if: ${{ github.event_name == 'workflow_dispatch' || github.repository == '__gdcloud_disabled__' }}
    runs-on: ubuntu-latest
    outputs:
      proceed: ${{ steps.window.outputs.proceed }}
    steps:
      - name: Decide whether this is the 06:30-local slot
        id: window
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          if [[ "$EVENT_NAME" != "schedule" ]]; then
            echo "Manual trigger ($EVENT_NAME) — proceeding regardless of local time."
            echo "proceed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # +0200 = CEST (summer), +0100 = CET (winter). The tz database on the
          # runner handles the DST switch, and we read it at run time so it is
          # always correct for today.
          offset=$(TZ=Europe/Berlin date +%z)
          local_time=$(TZ=Europe/Berlin date '+%Y-%m-%d %H:%M %Z')
          echo "Triggering cron: '$SCHEDULE' | Europe/Berlin: $local_time (offset $offset)"

          proceed=false
          if [[ "$offset" == "+0200" && "$SCHEDULE" == "30 4 * * 1-5" ]]; then
            proceed=true   # summer: 04:30 UTC = 06:30 CEST
          elif [[ "$offset" == "+0100" && "$SCHEDULE" == "30 5 * * 1-5" ]]; then
            proceed=true   # winter: 05:30 UTC = 06:30 CET
          fi

          if [[ "$proceed" == "true" ]]; then
            echo "✅ This is the 06:30-local slot — proceeding."
          else
            echo "⏭️ Off-season firing (05:30 local winter / 07:30 local summer) — skipping to avoid a duplicate run."
          fi
          echo "proceed=$proceed" >> "$GITHUB_OUTPUT"

  # One matrix cell per ldm_deploy environment; run_scansql marks ldm_sql scope.
  matrix-setup:
    needs: gate
    if: needs.gate.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      has_work: ${{ steps.matrix.outputs.has_work }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Python Environment
        uses: ./.github/actions/setup_python
        with:
          github_token: ${{ secrets.TOKEN_GITHUB_GDCLOUD }}

      - name: Build validation matrix (config-driven scope)
        id: matrix
        run: |
          matrix=$(python3 << 'PYEOF'
          import json, os, sys
          sys.path.insert(0, os.getcwd())
          from gdcloud.utils.config import (
              get_available_data_products,
              get_automated_validation_config,
          )
          cfg = get_automated_validation_config()
          checked_dps = cfg["data_products"]
          deploy_envs = cfg["ldm_deploy_environments"]
          sql_envs = set(cfg["ldm_sql_environments"])
          overrides_envs = set(cfg["overrides_check_environments"])
          alias_drift_envs = set(cfg["alias_drift_environments"])
          afm_scenario_envs = set(cfg["afm_scenario_environments"])
          include = []
          for env in deploy_envs:
              env_dps = set(get_available_data_products(environment=env))
              dps = [dp for dp in checked_dps if dp in env_dps]
              if not dps:
                  continue
              include.append({
                  "env": env,
                  "data_products": " ".join(dps),
                  "run_scansql": "true" if env in sql_envs else "false",
                  "run_overrides_check": "true" if env in overrides_envs else "false",
                  "run_alias_drift": "true" if env in alias_drift_envs else "false",
                  "run_afm_scenario": "true" if env in afm_scenario_envs else "false",
              })
          print(json.dumps({"include": include}))
          PYEOF
          )
          echo "Validation matrix: $matrix"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          # An empty include[] fails GitHub's matrix expansion, so gate the
          # downstream job rather than hand it an empty matrix (same shape as
          # model_validation.yml).
          has_work=$(echo "$matrix" | python3 -c "import json,sys; print(str(len(json.load(sys.stdin)['include']) > 0).lower())")
          echo "has_work=$has_work" >> "$GITHUB_OUTPUT"

  validate:
    needs: matrix-setup
    if: needs.matrix-setup.outputs.has_work == 'true'
    runs-on: ubuntu-latest
    environment:
      name: ${{ fromJSON('{"dev":"develop","test":"staging","preprod":"preprod","prod":"production"}')[matrix.env] }}
      deployment: false
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix-setup.outputs.matrix) }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-tags: true

      - name: Setup Python Environment
        uses: ./.github/actions/setup_python
        with:
          github_token: ${{ secrets.TOKEN_GITHUB_GDCLOUD }}

      - name: Load Configuration
        id: config
        uses: ./.github/actions/load_config
        with:
          environment: ${{ matrix.env }}

      - name: Set GoodData token
        run: echo "TOKEN_GOODDATA=${{ secrets.TOKEN_GOODDATA }}" >> "$GITHUB_ENV"

      # Fetch every data source's PDM for this env ONCE into the shared cache.
      # Best-effort: if it fails, the per-DP ldm-deploy --reuse-pdm below simply
      # re-fetches (correctness preserved, just without the dedup win).
      - name: Warm PDM cache (one scan per data source)
        continue-on-error: true
        run: |
          # Shared cache dir so this fetch and the per-DP `ldm-deploy --reuse-pdm`
          # below hit the same files ($RUNNER_TEMP is constant across steps).
          # Without an explicit --output-dir each gd-validate invocation makes its
          # own temp dir and reuse can't work.
          PDM_DIR="$RUNNER_TEMP/pdm-cache"
          gd-validate pdm --env ${{ matrix.env }} --no-preview --output-dir "$PDM_DIR"

      # Loop the checked DPs: ldm-deploy reuses the warmed PDM; ldm-sql (when
      # this env is in ldm_sql_environments) runs its own scanSql per dataset.
      # Each pass writes a structured JSON report (failures only, [] when clean)
      # to reports/<dp>__<pass>.json via --report-json. `gd-validate
      # slack-report` then renders ONE concise, deduped alert body from those
      # reports — no regex-scraping of human log output (the formatter lives in
      # model_validation/validation_report.py and is unit-tested). A SHARED view
      # failing once per DP collapses to a single line listing the affected DPs.
      # Each pass runs under `|| rc=1` so the loop continues but a non-zero exit
      # is remembered. The has_errors gate is driven by BOTH the rendered report
      # AND that exit code: a pass can fail WITHOUT a structured failure entry
      # (base-LDM/PDM fetch error, malformed PDM → exit 3, etc.), and those must
      # never go silently green — so $rc is the backstop and the renderer body
      # is the detail.
      - name: Validate data products
        id: val
        run: |
          PDM_DIR="$RUNNER_TEMP/pdm-cache"   # same dir the warm step wrote to
          mkdir -p reports
          rc=0

          for DP in ${{ matrix.data_products }}; do
            echo "::group::ldm-deploy ${DP} @ ${{ matrix.env }}"
            gd-validate ldm-deploy --env ${{ matrix.env }} --data-product-id "$DP" \
              --reuse-pdm --ldm-output create --output-dir "$PDM_DIR" \
              --report-json "reports/${DP}__ldm-deploy.json" < /dev/null 2>&1 || rc=1
            echo "::endgroup::"

            if [[ "${{ matrix.run_scansql }}" == "true" ]]; then
              echo "::group::ldm-sql ${DP} @ ${{ matrix.env }}"
              gd-validate ldm-sql --env ${{ matrix.env }} --data-product-id "$DP" \
                --local --no-preview \
                --report-json "reports/${DP}__ldm-sql.json" < /dev/null 2>&1 || rc=1
              echo "::endgroup::"
            fi

            # Expiry watch for env overrides (dev). Exits non-zero only on a
            # BROKEN override; a merely stale one is advisory, so it reaches the
            # alert through the report body rather than $rc — deleting one needs
            # the env-override-audit ladder, not a red build alone.
            if [[ "${{ matrix.run_overrides_check }}" == "true" ]]; then
              echo "::group::overrides-check ${DP} @ ${{ matrix.env }}"
              gd-validate overrides-check --env ${{ matrix.env }} --data-product-id "$DP" \
                --reuse-pdm --ldm-output create --output-dir "$PDM_DIR" \
                --report-json "reports/${DP}__overrides-check.json" < /dev/null 2>&1 || rc=1
              echo "::endgroup::"
            fi

            # Alias drift over the env-resolved LDM — base SQL included, which is
            # the half overrides-check cannot reach. `--warn-only` for the same
            # reason it is advisory there: removing an alias needs the
            # env-override-audit Step 2b comparison, not a red build alone.
            if [[ "${{ matrix.run_alias_drift }}" == "true" ]]; then
              echo "::group::alias-drift ${DP} @ ${{ matrix.env }}"
              gd-validate alias-drift --env ${{ matrix.env }} --data-product-id "$DP" \
                --reuse-pdm --ldm-output create --output-dir "$PDM_DIR" --warn-only \
                --report-json "reports/${DP}__alias-drift.json" < /dev/null 2>&1 || rc=1
              echo "::endgroup::"
            fi

            # Stored `scheduled: true` scenarios: live AFM executions, catching
            # what offline checks cannot (e.g. a datasource route the engine refuses).
            # Quick lookups (p95 < 1s): a short read timeout bounds a lost
            # response, which the client resubmits once.
            if [[ "${{ matrix.run_afm_scenario }}" == "true" ]]; then
              echo "::group::afm scenario ${DP} @ ${{ matrix.env }}"
              gd-validate afm scenario --env ${{ matrix.env }} --data-product-id "$DP" \
                --scheduled --timeout 15 \
                --report-json "reports/${DP}__afm-scenario.json" < /dev/null 2>&1 || rc=1
              echo "::endgroup::"
            fi
          done

          # Compose the alert body from the structured reports (empty when clean).
          # If the renderer itself ever fails, fall through to the $rc backstop
          # below so a real failure is never silently swallowed.
          gd-validate slack-report --report-dir reports > "error-${{ matrix.env }}.txt" || rc=1

          if [[ -s "error-${{ matrix.env }}.txt" || "$rc" -ne 0 ]]; then
            # A pass failed but produced no structured detail (or the renderer
            # itself failed) — guarantee a non-empty alert pointing at the run.
            [[ -s "error-${{ matrix.env }}.txt" ]] || \
              echo "(a validation pass exited non-zero with no structured detail — see workflow run)" \
                > "error-${{ matrix.env }}.txt"
            echo "has_errors=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_errors=false" >> "$GITHUB_OUTPUT"
            rm -f "error-${{ matrix.env }}.txt"
          fi

      - name: Upload error artifact
        if: steps.val.outputs.has_errors == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: validation-errors-${{ matrix.env }}
          overwrite: true
          path: error-${{ matrix.env }}.txt
          retention-days: 7

      # The structured reports behind that body, for notify's per-env
      # root-cause summary (`slack-report --root-causes`).
      - name: Upload report artifact
        if: steps.val.outputs.has_errors == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: validation-reports-${{ matrix.env }}
          overwrite: true
          path: reports/
          if-no-files-found: ignore
          retention-days: 7

      # Mark the job red so the run history reflects the failure (Slack is the
      # primary alert).
      - name: Fail job on validation error
        if: steps.val.outputs.has_errors == 'true'
        run: |
          echo "::error::Model validation failures in ${{ matrix.env }} (see error-${{ matrix.env }}.txt artifact / Slack)"
          exit 1

  # Aggregate every failing env into a single Slack message. Sends nothing when
  # no error artifacts were produced.
  notify:
    needs: validate
    # `always()` must not bypass the compiler-managed schedule gate when
    # `validate` is skipped because automation is disabled.
    if: ${{ always() && (github.event_name == 'workflow_dispatch' || github.repository == '__gdcloud_disabled__') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      # load_config resolves which secret holds the Slack webhook — it runs
      # Python from the repo, so setup must precede it even in a notify job.
      - name: Setup Python Environment
        uses: ./.github/actions/setup_python
        with:
          github_token: ${{ secrets.TOKEN_GITHUB_GDCLOUD }}

      - name: Load Configuration
        id: config
        uses: ./.github/actions/load_config
        with:
          # Pinned load_config emits these only when requested; unrequested reads "".
          keys: "slack_webhook_variable"

      - name: Download error artifacts
        id: download
        continue-on-error: true   # no artifacts => nothing to download (clean run)
        uses: actions/download-artifact@v8
        with:
          pattern: validation-errors-*
          path: errors
          merge-multiple: true

      # One subdirectory per env (no merge: every env writes the same
      # <dp>__<pass>.json names). slack-report reads them recursively.
      - name: Download report artifacts
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          pattern: validation-reports-*
          path: reports

      - name: Build Slack payload
        id: payload
        env:
          DOWNLOAD_OUTCOME: ${{ steps.download.outcome }}
          VALIDATION_RESULT: ${{ needs.validate.result }}
        run: |
          shopt -s nullglob
          files=(errors/error-*.txt)
          if [[ ${#files[@]} -eq 0 ]]; then
            if [[ "$DOWNLOAD_OUTCOME" == "failure" && "$VALIDATION_RESULT" == "failure" ]]; then
              body="Validation failed, but its error artifacts could not be downloaded. See the workflow run for details."
            else
              echo "✅ No validation errors — skipping Slack notification."
              echo "send=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            full="$body"
          else
            # Each env's root causes first: Slack gets the compact form within
            # 2000 of the cap below, so that cap cuts per-env detail only; the
            # run page gets the full form. Context only: a renderer failure
            # leaves the per-env bodies to carry the alert.
            causes="" causes_full=""
            if [[ -d reports ]]; then
              causes=$(gd-validate slack-report --report-dir reports --root-causes --max-chars 2000) || causes=""
              causes_full=$(gd-validate slack-report --report-dir reports --root-causes) || causes_full=""
            fi
            detail=""
            for f in "${files[@]}"; do
              name="${f##*/error-}"; name="${name%.txt}"
              detail+="▼ ${name}"$'\n'
              detail+="$(cat "$f")"$'\n\n'
            done
            body="$detail" full="$detail"
            if [[ -n "$causes" ]]; then body="${causes}"$'\n\n'"${detail}"; fi
            if [[ -n "$causes_full" ]]; then full="${causes_full}"$'\n\n'"${detail}"; fi
          fi

          {
            echo '```'
            echo "$full"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          # Slack section text caps at ~3000 chars; truncate with a pointer to
          # the run for the full output.
          max=2700
          if [[ ${#body} -gt $max ]]; then
            body="${body:0:$max}"$'\n… (truncated — see workflow run for full output)'
          fi

          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          PAYLOAD=$(jq -nc \
            --arg body "$body" \
            --arg url "$run_url" \
            '[
              {type: "section", text: {type: "mrkdwn",
                text: ("Scheduled model validation found errors:\n```" + $body + "```")}},
              {type: "section", text: {type: "mrkdwn",
                text: ("🔗 <" + $url + "|View workflow run>")}}
            ]')
          echo "json=$PAYLOAD" >> "$GITHUB_OUTPUT"
          echo "send=true" >> "$GITHUB_OUTPUT"

      - name: Notify Slack
        if: steps.payload.outputs.send == 'true'
        uses: ./.github/actions/notify_slack
        with:
          webhook_url: ${{ secrets[steps.config.outputs.slack_webhook_variable] }}
          header: "❌ Scheduled Model Validation Failures"
          payload: ${{ steps.payload.outputs.json }}
