# Generated by `gd-workflows adopt`; edit config.yml or gd-cloud-tooling,
# not this package-owned workflow. Re-run `make dev` after a pin change.
name: PR Label Check

# Required for non-draft PRs:
#   1. At least one configured DP label or TOOLING declares release intent.
#   2. DP labels cover every DP affected by the diff; content common configs
#      require every DP label. Failures include a `gh pr edit` fix command.

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, labeled, unlabeled]
    branches:
      - master
      - main

  workflow_call:

jobs:
  check-labels:
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false
    permissions:
      contents: read
    env:
      # Only for the `gh pr edit` remediation hint printed on failure.
      PR_NUMBER: ${{ github.event.pull_request.number }}
      # toJSON lifts the labels array into env: as a JSON string, which we
      # word-split safely below with jq. Same shape detect_dp_changes uses.
      PR_LABELS_JSON: ${{ toJSON(github.event.pull_request.labels.*.name) }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0       # pr_changed_files.sh diffs vs origin/<base>
          filter: blob:none    # Blobless: history only — ~1s vs shallow

      - name: Setup Python Environment
        uses: ./.github/actions/setup_python
        with:
          github_token: ${{ secrets.TOKEN_GITHUB_GDCLOUD }}

      - name: Validate release-scope labels cover the PR diff
        run: |
          set -euo pipefail

          # Resolve the allowed labels from the same catalog as gd-detect-dp.
          RELEASE_LABELS_JSON=$(python -c "import json; from gdcloud.dp_affected import release_scope_labels; print(json.dumps(release_scope_labels()))")
          RELEASE_LABELS=$(echo "$RELEASE_LABELS_JSON" | jq -r '.[]' | tr '\n' ' ' | sed 's/ $//')

          # Extract just the release-scope labels actually on the PR.
          SCOPE_LABELS_ON_PR=$(echo "$PR_LABELS_JSON" \
            | jq -r --argjson allowed "$RELEASE_LABELS_JSON" \
                '. as $l | $allowed | map(select(. as $a | $l | index($a))) | .[]')

          # ─── Gate 1: at least one release-scope label ─────────────────
          if [ -z "$SCOPE_LABELS_ON_PR" ]; then
            {
              echo "::error::PR must carry at least one release-scope label."
              echo "::error::Allowed: ${RELEASE_LABELS}."
              echo "::error::DP labels (EXAMPLE/SIBLING/…) ship that DP on merge; TOOLING ships nothing."
            }
            exit 1
          fi

          # ─── Resolve label DP set and diff DP set ──────────────────────
          # Both go through gd-detect-dp / dp_affected.py — one source of
          # truth for the label→DP mapping and the common-config signal.
          mapfile -t PR_LABEL_LIST < <(echo "$PR_LABELS_JSON" | jq -r '.[]')
          # Keep empty arrays safe under `set -u` if Gate 1 changes later.
          if [ ${#PR_LABEL_LIST[@]} -eq 0 ]; then
            LABEL_DPS_JSON='[]'
          else
            LABEL_DPS_JSON=$(gd-detect-dp --labels "${PR_LABEL_LIST[@]}" --json)
          fi

          # Diff DPs — pipe the PR's full file list (head vs base) through the
          # shared extractor. Mirrors detect_dp_changes/action.yml so a stray
          # directory under gd_data_product/ doesn't pollute. Note this gate
          # wants the diff set ALONE: unlike detect_dp_changes it must not union
          # in the branch's primary DP, or a `example_dp--x` branch touching
          # only tooling would start demanding the EXAMPLE label.
          CHANGED_FILES=$(.github/scripts/pr_changed_files.sh)
          DIFF_DPS_RAW_JSON=$(printf '%s\n' "$CHANGED_FILES" | gd-detect-dp --from-stdin --json)

          # Expand content-common-config fan-out; tooling configs never emit __all__.
          if [[ "$DIFF_DPS_RAW_JSON" == '["__all__"]' ]]; then
            DIFF_DPS_JSON=$(python -c "from gdcloud.dp_affected import all_known_dps_json; print(all_known_dps_json())")
            DIFF_TRIGGER="common config (gd_data_product/config.*.yml) — every DP must be labeled"
          else
            DIFF_DPS_JSON="$DIFF_DPS_RAW_JSON"
            DIFF_TRIGGER="PR file diff"
          fi

          echo "Release-scope labels on PR: ${SCOPE_LABELS_ON_PR//$'\n'/ }"
          echo "Label DPs:                  $LABEL_DPS_JSON"
          echo "Diff DPs ($DIFF_TRIGGER): $DIFF_DPS_JSON"

          # ─── Gate 2: label DPs must cover diff DPs ─────────────────────
          # Missing = diff DPs absent from the label DP set.
          MISSING_JSON=$(jq -nc --argjson diff "$DIFF_DPS_JSON" --argjson labels "$LABEL_DPS_JSON" \
            '$diff - $labels')
          MISSING_COUNT=$(echo "$MISSING_JSON" | jq 'length')

          if [ "$MISSING_COUNT" -gt 0 ]; then
            # Build the remediation from the shared configured-label mapping.
            ADD_FLAGS=$(python -c "import sys; from gdcloud.dp_affected import format_add_label_flags; print(format_add_label_flags(sys.argv[1]))" "$MISSING_JSON")
            {
              echo "::error::PR labels don't cover every DP touched in the diff."
              echo "::error::Source: $DIFF_TRIGGER"
              echo "::error::Missing labels for: $(echo "$MISSING_JSON" | jq -r '. | join(", ")')"
              echo "::error::Fix: gh pr edit ${PR_NUMBER} ${ADD_FLAGS}"
            }
            exit 1
          fi

          echo ""
          echo "✅ Labels cover the diff. Release scope on merge: $LABEL_DPS_JSON"
