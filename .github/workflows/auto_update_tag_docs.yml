# Generated by `gd-workflows adopt`; edit config.yml or gd-cloud-tooling,
# not this package-owned workflow. Re-run `make dev` after a pin change.
name: Auto-Update Tag Docs
run-name: "Auto-update tag docs @ ${{ github.ref_name }} (${{ github.sha }})"

# Tag docs are derived from rule output and aren't reviewed manually,
# so we regenerate them post-merge and auto-commit instead of blocking PRs.
# This avoids re-running docs generation on every PR push and removes a
# step that was only ever rubber-stamped.

on:
  push:
    branches:
      - master
      - main
    # NOTE: When adding SQL view dependencies, also update REQUIRED_VIEWS_BY_RULE
    #       in the toolkit (gdcloud tagging constants)
    paths:
      # YAML files containing tags
      - 'gd_data_product/**/visualization_objects/*.yaml'
      - 'gd_data_product/**/metrics/*.yaml'
      - 'gd_data_product/**/ldm/datasets/*.yaml'
      - 'gd_data_product/**/analytical_dashboards/*.yaml'
      - 'gd_data_product/**/config.tagging.yml'
      # Tagging code
      # Tag catalogue docs (catches manual edits so regen overwrites them)
      - 'docs/tags/**'
      # SQL views that tagging rules depend on

# Serialize so back-to-back merges don't race when pushing the auto-commit.
  workflow_call:

concurrency:
  group: auto-update-tag-docs
  cancel-in-progress: false

jobs:
  update-tag-docs:
    if: ${{ github.repository == '__gdcloud_disabled__' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Required when the built-in GITHUB_TOKEN commits updates

    steps:
      # First checkout with default token so load_config can read repo content
      - name: Initial Checkout
        uses: actions/checkout@v7

      # setup_python must run before load_config — load_config's inline Python
      # uses PEP 758 syntax that requires Python 3.14+ (system python is 3.12).
      - name: Setup Python Environment
        uses: ./.github/actions/setup_python
        with:
          full_deps: true
          github_token: ${{ secrets.TOKEN_GITHUB_GDCLOUD }}

      - name: Load Configuration
        uses: ./.github/actions/load_config
        id: config

      # Re-checkout with config token so we can push the auto-commit back to master.
      # This wipes .venv via git clean -ffdx, so we reinstall after.
      - name: Checkout With Config Token
        uses: actions/checkout@v7
        with:
          token: ${{ secrets[steps.config.outputs.github_token_variable] }}

      - name: Reinstall Python Environment
        uses: ./.github/actions/setup_python
        with:
          full_deps: true
          github_token: ${{ secrets.TOKEN_GITHUB_GDCLOUD }}

      # Restoring an older cache is safe: docs_cache.py validates each DP entry
      # against a per-DP content hash before reuse, so stale entries are rejected
      # at read time even if a partial-match restore-key wins.
      - name: Restore docs query cache
        uses: actions/cache@v6
        with:
          path: gd_output/tagging/docs_query_cache.json
          key: docs-query-cache-${{ runner.os }}-${{ hashFiles('gd_data_product/**', 'pyproject.toml') }}
          restore-keys: |
            docs-query-cache-${{ runner.os }}-

      # `docs` always renders the full catalogue (cross-DP permissions/combined
      # files require every DP's data), so no --data-product-id filter here. The
      # shared action regenerates + commits, retrying on a non-fast-forward race
      # (a PR merging mid-run) by re-syncing and re-rendering against the new tip.
      - name: Regenerate and commit tag docs
        uses: ./.github/actions/regenerate_and_commit
        with:
          command: gd-tagging docs
          paths: docs/tags/
          commit-message: "docs(tags): auto-update tag catalogue [skip ci]"
          actor: ${{ github.actor }}
