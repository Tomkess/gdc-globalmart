# Generated by `gd-workflows adopt`; edit config.yml or gd-cloud-tooling,
# not this package-owned workflow. Re-run `make dev` after a pin change.
name: Python Formatting Check

# NOTE: do NOT add `paths:` here. GitHub evaluates trigger-level path filters
# against the synchronize push delta, not the PR's full diff vs base — after
# a rebase that doesn't re-touch the gated paths in the new push, the workflow
# would silently skip even when the PR carries those changes overall (see PR
# #1075 for the model_validation regression). A required check that reports
# "skipped" then lets an unformatted change merge. The path-aware gate is
# implemented below via pr_path_gate.yml, which queries the PR's full diff.
on:
  pull_request:
    types: [opened, synchronize, reopened]

  workflow_call:

jobs:
  # Cheap gate that runs on every PR and exposes `changed` to the downstream
  # `check-formatting` job. Two-job layout gives the downstream a true
  # "Skipped" status on irrelevant PRs.
  #
  # Patterns match the original `paths:` list — Python sources, the ruff and
  # project config, and this workflow itself.
  gate:
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/pr_path_gate.yml
    permissions:
      contents: read       # Ceiling for the called workflow's token
    with:
      patterns: '\.py$|^pyproject\.toml$|^ruff\.toml$|^\.github/workflows/(gdcloud__)?check_formatting_python\.yml$'

  check-formatting:
    needs: gate
    if: github.event_name == 'pull_request' && needs.gate.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # Pinned, not "latest": a new ruff release must not change this check's
      # verdict without a commit. The repo's unpinned `ruff` dev dependency is
      # not a reproducible source, so the version lives here.
      - name: Check Python formatting
        uses: astral-sh/ruff-action@v4.1.0
        with:
          version: "0.16.5"
          args: check --show-fixes
          src: .

      - name: Check Python formatting (ruff format --check)
        uses: astral-sh/ruff-action@v4.1.0
        with:
          version: "0.16.5"
          args: format --check --diff
          src: .

      - name: Show diff if formatting issues found
        if: failure()
        run: |
          echo "Formatting issues detected. Run locally to fix:"
          echo ""
          echo "  make format-ruff"
          echo ""
          echo "Or:"
          echo "  ruff check --fix . && ruff format ."
