# Generated by `gd-workflows adopt`; edit config.yml or gd-cloud-tooling,
# not this package-owned workflow. Re-run `make dev` after a pin change.
name: Workflow Options Sync Check

on:
  pull_request:
    branches:
      - master
      - main
    paths:
      - 'config.yml'
      - '.github/workflows/*.yml'

  workflow_call:

jobs:
  check-workflow-options:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Python Environment
        uses: ./.github/actions/setup_python
        with:
          github_token: ${{ secrets.TOKEN_GITHUB_GDCLOUD }}

      - name: Verify workflow choice options match config.yml
        run: gd-workflows sync --check

      - name: Show fix instructions if drift detected
        if: failure()
        run: |
          echo "Workflow_dispatch choice options drifted from config.yml."
          echo ""
          echo "Run locally to fix:"
          echo "  gd-workflows sync"
