# Generated by `gd-workflows adopt`; edit config.yml or gd-cloud-tooling,
# not this package-owned workflow. Re-run `make dev` after a pin change.
name: "@ Translation delta"
run-name: "Translation delta (en-US) [${{ inputs.data_product_id }}]${{ inputs.version && format(' {0}', inputs.version) || '' }}"

# Emits the masked en-US translation delta — the single file to hand to
# translators — as a downloadable artifact.
# Two entry points, one implementation:
#   • workflow_dispatch — trigger by hand, choose the DP and (optionally) a version
#   • workflow_call     — invoked by workflow 5 after a successful prod deploy
# Offline/local extraction: no GoodData credentials, commits nothing back.
on:
  workflow_dispatch:
    inputs:
      data_product_id:
        description: 'Data product'
        required: true
        type: choice
        options:
          - 'globalmart'
        default: 'globalmart'
      version:
        description: 'Version tag to emit against (e.g. v1.785). Empty = current branch HEAD / latest tag.'
        required: false
        type: string
        default: ''

  workflow_call:
    inputs:
      data_product_id:
        required: true
        type: string
      version:
        required: false
        type: string
        default: ''
    secrets:
      dependency_token:
        description: 'Explicit dependency credential supplied by an engine-to-engine caller.'
        required: false
      # Compiled from config.yml: the steps below read this secret by
      # name, so the contract has to admit it. Optional, because a
      # caller that maps the alias above passes this one instead.
      TOKEN_GITHUB_GDCLOUD:
        required: false

permissions:
  contents: read

jobs:
  emit_delta:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          # fetch-tags brings each tag's tip WITH its tree+blobs (shallow), so the
          # version checkout below is instant — no lazy fetch. depth 1 is enough:
          # NO filter: blob:none here. This job's whole purpose is to materialize an
          # OLD tag's tree, and a blobless clone would defer exactly those blobs,
          # forcing an on-demand lazy fetch of ~5000 files per DP (~1m40s). blob:none
          # only pays off for HEAD-only jobs (check_*, model_validation); this is the
          # exception. Mirrors workflow 5's checkout.
          fetch-depth: 1
          fetch-tags: true

      # Emit against exactly what a given version shipped: replace the data
      # product directory with that version's tree. Empty version = current
      # branch (latest tag). The rm first matters — `git checkout <tag> -- dir`
      # alone overlays (files added since the tag would survive and leak
      # post-version strings into the delta).
      # Inputs reach the shell via env, never ${{ }}-interpolated into run:
      # (template injection — a crafted value would expand into the script).
      - name: Checkout Data Product at Version
        if: ${{ inputs.version != '' }}
        env:
          DP_ID: ${{ inputs.data_product_id }}
          RAW_VERSION: ${{ inputs.version }}
        run: |
          VERSION="$(echo -n "$RAW_VERSION" | xargs)"
          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
            echo "❌ Invalid version format: $VERSION" && exit 1
          fi
          git rm -rq --ignore-unmatch "gd_data_product/${DP_ID}/"
          git checkout "$VERSION" -- "gd_data_product/${DP_ID}/"

      - name: Setup Python Environment
        uses: ./.github/actions/setup_python
        with:
          # The fixed alias is what a nested caller maps, so that caller can
          # hand over this one credential instead of `secrets: inherit`. The
          # fallback preserves the standalone caller, whose project-specific
          # secret name is compiled into its input by gd-workflows sync.
          github_token: ${{ secrets.dependency_token || secrets.TOKEN_GITHUB_GDCLOUD }}

      - name: Emit en-US translation delta
        # --version stamps the frozen snapshot to match the checked-out data; when
        # empty, gd-translate falls back to the repo's latest tag (matches HEAD).
        # --no-zip: the hand-off zip is for local use — upload-artifact already
        # wraps the file in a zip, so an emitted zip would only nest redundantly.
        env:
          DP_ID: ${{ inputs.data_product_id }}
          VERSION: ${{ inputs.version }}
        run: |
          gd-translate delta --emit --no-zip \
            --data-product-id "$DP_ID" \
            --version "$VERSION"

      # Ship ONLY the masked delta — the single file translators fill in.
      # The frozen en-US.delta.sources.yml is deliberately NOT uploaded: it's the
      # unmasked English duplicate (must not reach translators), and --merge
      # reconstructs the source set deterministically from the version's git tag.
      - name: Upload translation delta artifact
        uses: actions/upload-artifact@v7
        with:
          name: translations-en-US-delta-${{ inputs.data_product_id }}-${{ inputs.version || github.run_number }}
          overwrite: true
          # Filename now carries the DP short code (en-US.delta-<short>.yml) so a
          # client can unzip several deliveries side by side; glob it (the sources
          # snapshot en-US.delta.sources.yml has a dot, not a hyphen — never matches).
          path: gd_output/translations/${{ inputs.data_product_id }}/en-US.delta-*.yml
          if-no-files-found: warn
          retention-days: 30
