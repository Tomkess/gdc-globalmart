# Generated by `gd-workflows adopt`; edit config.yml or gd-cloud-tooling,
# not this package-owned workflow. Re-run `make dev` after a pin change.
name: 2b - Update workspace from branch

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        type: choice
        # gd-workflows: environment-options dev,test
        options:
          # Note: prod/preprod intentionally excluded - this workflow modifies
          # workspaces and should not run against production environments
          - 'dev'
          - 'test'
        default: 'dev'

  workflow_call:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    environment: ${{ fromJSON('{"dev":"develop","test":"staging","preprod":"preprod","prod":"production"}')[inputs.environment] }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Python Environment
        uses: ./.github/actions/setup_python
        with:
          github_token: ${{ secrets.TOKEN_GITHUB_GDCLOUD }}

      - name: Load Configuration
        uses: ./.github/actions/load_config
        id: config
        with:
          environment: ${{ inputs.environment }}

      - name: Require feature branch
        env:
          BRANCH: ${{ steps.config.outputs.branch }}
          BRANCH_NAME: ${{ steps.config.outputs.branch_name }}
        run: |
          if [ -z "$BRANCH" ]; then
            echo "Error: This workflow only works on feature branches (format: data_product_id--branch_name)"
            echo "Current branch: $BRANCH_NAME"
            exit 1
          fi

      - name: Backup Workspace Layout
        env:
          TOKEN_GOODDATA: ${{ secrets.TOKEN_GOODDATA }}
          ENVIRONMENT: ${{ inputs.environment }}
          DATA_PRODUCT_ID: ${{ steps.config.outputs.data_product_id }}
          BRANCH: ${{ steps.config.outputs.branch }}
        run: |
          gd-backup \
          --environment "$ENVIRONMENT" \
          --data-product-id "$DATA_PRODUCT_ID" \
          --branch "$BRANCH" \
          --output-dir backups

      - name: Upload Backup to Artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: workspace-backup-${{ inputs.environment }}-${{ steps.config.outputs.data_product_id }}-${{ github.run_number }}-${{ github.run_attempt }}
          path: backups/
          retention-days: 30
          if-no-files-found: warn

      - name: Run Deploy Script
        timeout-minutes: 20
        env:
          TOKEN_GOODDATA: ${{ secrets.TOKEN_GOODDATA }}
          ENVIRONMENT: ${{ inputs.environment }}
          DATA_PRODUCT_ID: ${{ steps.config.outputs.data_product_id }}
          BRANCH: ${{ steps.config.outputs.branch }}
        run: |
          gd-upload \
          --environment "$ENVIRONMENT" \
          --data-product-id "$DATA_PRODUCT_ID" \
          --branch "$BRANCH"

      - name: Workflow Completed
        run: echo "Deployment completed successfully!"
