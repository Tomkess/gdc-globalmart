# Generated by `gd-workflows adopt`; edit config.yml or gd-cloud-tooling,
# not this package-owned workflow. Re-run `make dev` after a pin change.
name: 'Model Validation'

on:
  # PR trigger: ldm-deploy against test, preprod as pre-merge check.
  # NOTE: do NOT add `paths:` here. GitHub evaluates trigger-level path filters
  # against the synchronize push delta, not the PR's full diff vs base. After a
  # rebase that doesn't re-touch LDM in the new push, the workflow would silently
  # skip even when the PR carries LDM changes overall — so the merged HEAD ends
  # up with no validate-pr run attached (see PR #1075). The path-aware gate is
  # instead implemented in the `setup` job below via `check_pr_paths`, which
  # queries the PR's full diff and short-circuits cheaply.
  pull_request:
    types: [opened, synchronize, reopened]

# Cancel outdated PR validation runs. The input suffix is load-bearing: adopt
# renders caller and engine into one file, and workflows 4/5 call it three
# times per run (ldm-deploy, ldm-sql, ldm-sql base) sharing github.run_id —
# without it they cancel each other. On a PR `inputs` is empty, so it is a
# constant and outdated PR runs still supersede.
  workflow_call:
    inputs:
      env:
        description: 'Target environment'
        required: false
        type: string
        default: ''
      data_product_id:
        description: 'Data product to validate'
        required: false
        type: string
        default: ''
      mode:
        description: 'Validation mode: ldm-now, ldm-deploy, ldm-sql, or overrides-check'
        required: false
        type: string
        default: ldm-deploy
      data_source_skip:
        description: 'Data source IDs to skip (space-separated, for ldm-sql mode)'
        required: false
        type: string
        default: ''
      ref:
        description: 'Git ref to checkout (tag, branch, SHA). Defaults to caller HEAD when empty.'
        required: false
        type: string
        default: ''
      skip_overrides:
        description: 'Skip env overrides for ldm-sql (validate base LDM SQL)'
        required: false
        type: boolean
        default: false
      show_overrides:
        description: 'Show environment overrides after validation'
        required: false
        type: boolean
        default: false
    outputs:
      validation_result:
        description: 'Overall validation result (success or error)'
        value: ${{ jobs.validate.outputs.validation_result }}
      critical_issues_found:
        description: 'Whether critical issues were found'
        value: ${{ jobs.validate.outputs.critical_issues_found }}
      overrides_result:
        description: 'Overrides check result (success, failure, or skipped)'
        value: ${{ jobs.validate.outputs.overrides_result }}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}-${{ inputs.data_product_id }}-${{ inputs.mode }}-${{ inputs.skip_overrides }}
  cancel-in-progress: true

jobs:
  # ==========================================================================
  # PR Trigger Jobs: Multi-environment validation (filtered by config.yml)
  # ==========================================================================

  setup:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read       # Required by actions/checkout
    outputs:
      has_work: ${{ steps.matrix.outputs.has_work }}
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      # Checkout is needed up-front so the local composite action used by the
      # gate (./.github/actions/check_pr_paths) is on disk, and so the gate can
      # diff against origin/<base>. Cheap (~3-5s); the real cost-saver is
      # skipping `setup_python` and the validate-pr matrix below when no
      # LDM/config.env files are touched.
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0       # detect_dp_changes runs git diff vs base
          filter: blob:none    # Blobless: history only — ~1s vs shallow

      # Path-aware gate: query the PR's full diff (head vs base), not the
      # synchronize push delta. Skips the rest of the job cheaply when no
      # LDM / config.env files are touched anywhere in the PR.
      - name: Check PR diff for LDM / config.env changes
        id: ldm_changed
        uses: ./.github/actions/check_pr_paths
        with:
          patterns: '^gd_data_product/[^/]+/(ldm/|config\.env\.yml$)'

      - name: Setup Python Environment
        if: steps.ldm_changed.outputs.changed == 'true'
        uses: ./.github/actions/setup_python
        with:
          github_token: ${{ secrets.TOKEN_GITHUB_GDCLOUD }}

      # Resolve the in-scope DP set as (branch primary DP) ∪ (DPs from diff).
      # The union is intentional: a `{dp}--{suffix}` branch that incidentally
      # touches other DPs (e.g. via shared-library YAML) must validate every
      # touched DP, not just the branch's primary one. detect_dp_changes does
      # the union internally — see its action.yml.
      - name: Detect changed data products
        if: steps.ldm_changed.outputs.changed == 'true'
        id: detect
        uses: ./.github/actions/detect_dp_changes

      # Build a flat matrix of (data_product_id, env) pairs for validate-pr.
      # PR validation excludes prod (requires explicit deploy).
      - name: Build validation matrix
        id: matrix
        env:
          LDM_CHANGED: ${{ steps.ldm_changed.outputs.changed }}
          DETECTED_DPS: ${{ steps.detect.outputs.data_products || '[]' }}
          HAS_CHANGES: ${{ steps.detect.outputs.has_changes || 'false' }}
        run: |
          if [[ "$LDM_CHANGED" != "true" ]] || [[ "$HAS_CHANGES" != "true" ]]; then
            echo 'matrix={"include":[]}' >> "$GITHUB_OUTPUT"
            echo "has_work=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Resolve each in-scope DP's environments. Non-prod only — prod is
          # config-flagged `protected: true` and requires an explicit deploy.
          # Single source of truth shared with auto_scheduled_model_validation.yml.
          matrix=$(DP_LIST="$DETECTED_DPS" python3 << 'PYEOF'
          import json, os, sys
          sys.path.insert(0, os.getcwd())
          from gdcloud.utils.config import get_available_data_products, get_available_environments
          dp_list = json.loads(os.environ["DP_LIST"])
          non_prod_envs = get_available_environments(include_protected=False)
          include = []
          for dp in dp_list:
              for e in non_prod_envs:
                  if dp in get_available_data_products(environment=e):
                      include.append({"data_product_id": dp, "env": e})
          print(json.dumps({"include": include}))
          PYEOF
          )

          echo "Validation matrix: $matrix"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          has_work=$(echo "$matrix" | python3 -c "import json,sys; print(str(len(json.load(sys.stdin)['include']) > 0).lower())")
          echo "has_work=$has_work" >> "$GITHUB_OUTPUT"

  validate-pr:
    if: github.event_name == 'pull_request' && needs.setup.outputs.has_work == 'true'
    needs: setup
    runs-on: ubuntu-latest
    environment:
      name: ${{ fromJSON('{"dev":"develop","test":"staging","preprod":"preprod","prod":"production"}')[matrix.env] }}
      deployment: false
    # Backstop against a wedged/unresponsive environment: the validation calls
    # carry their own HTTP timeouts, so a healthy run is minutes; cap the job so
    # a stuck step fails fast instead of burning the 6h GitHub default.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.setup.outputs.matrix) }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Python Environment
        uses: ./.github/actions/setup_python
        with:
          github_token: ${{ secrets.TOKEN_GITHUB_GDCLOUD }}

      - name: Load Configuration
        uses: ./.github/actions/load_config
        id: config
        with:
          environment: ${{ matrix.env }}
          data_product_id: ${{ matrix.data_product_id }}

      - name: Set GoodData token
        env:
          TOKEN_GOODDATA: ${{ secrets.TOKEN_GOODDATA }}
        run: |
          delimiter="TOKEN_GOODDATA_$(cat /proc/sys/kernel/random/uuid)"
          {
            printf 'TOKEN_GOODDATA<<%s\n' "$delimiter"
            printf '%s\n' "$TOKEN_GOODDATA"
            printf '%s\n' "$delimiter"
          } >> "$GITHUB_ENV"

      - name: Run model validation
        id: run_validation
        continue-on-error: true
        run: |
          set -o pipefail
          gd-validate \
            ldm-deploy \
            --env ${{ matrix.env }} \
            --data-product-id ${{ matrix.data_product_id }} \
            --ldm-output create \
            2>&1 | tee validation.log

      - name: Run overrides check
        id: run_overrides
        if: matrix.env != 'dev'
        continue-on-error: true
        run: |
          set -o pipefail
          gd-validate \
            overrides-check \
            --env ${{ matrix.env }} \
            --data-product-id ${{ matrix.data_product_id }} \
            --reuse-pdm \
            --ldm-output fetch \
            2>&1 | tee overrides.log

      - name: Write summary
        if: always()
        uses: ./.github/actions/write_validation_summary
        with:
          mode: ldm-deploy
          environment: ${{ matrix.env }}
          data_product_id: ${{ matrix.data_product_id }}
          validation_outcome: ${{ steps.run_validation.outcome }}
          validation_result: ${{ steps.run_validation.outputs.validation_result }}
          critical_issues: ${{ steps.run_validation.outputs.critical_issues_found }}
          overrides_outcome: ${{ steps.run_overrides.outcome }}

      - name: Check results
        if: steps.run_validation.outcome == 'failure' || steps.run_overrides.outcome == 'failure'
        run: |
          if [[ "${{ steps.run_validation.outcome }}" == "failure" ]]; then
            echo "::error::Model validation failed for environment: ${{ matrix.env }}"
          fi
          if [[ "${{ steps.run_overrides.outcome }}" == "failure" ]]; then
            echo "::error::Redundant overrides found for environment: ${{ matrix.env }}"
          fi
          exit 1

  validation-summary:
    if: github.event_name == 'pull_request' && always()
    needs: [setup, validate-pr]
    runs-on: ubuntu-latest
    permissions:
      contents: read  # Required by actions/checkout
      actions: read   # Required to query workflow run jobs
    steps:
      # Sparse: this job runs no tooling, it only needs gh_api_retry.sh on disk.
      # Cone mode also brings the repo-root files; both are negligible.
      - name: Checkout retry helper
        uses: actions/checkout@v7
        with:
          sparse-checkout: .github/scripts

      - name: Check validation results
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "${{ needs.setup.outputs.has_work }}" != "true" ]]; then
            echo "ℹ️ Validation was skipped (no data product changes detected)"
            exit 0
          fi

          if [[ "${{ needs.validate-pr.result }}" == "skipped" ]]; then
            echo "ℹ️ Validation skipped (no matching environments for data products)"
            echo "### ℹ️ Model Validation Skipped" >> $GITHUB_STEP_SUMMARY
            echo "No environments configured for the affected data products." >> $GITHUB_STEP_SUMMARY
            exit 0
          fi

          if [[ "${{ needs.validate-pr.result }}" == "success" ]]; then
            echo "✅ All environment validations passed"
            echo "### ✅ Model Validation Passed" >> $GITHUB_STEP_SUMMARY
            echo "All environment validations completed successfully." >> $GITHUB_STEP_SUMMARY
            exit 0
          fi

          # Fetch failed jobs from this workflow run
          echo "❌ Environment validation failures:"

          # Retry-wrapped: a run's job statuses live only server-side, so this
          # is one of the few calls with no local equivalent. Without retries a
          # transient api.github.com blip degrades the failure report to
          # "(Could not retrieve specific failures)" — the exact output someone
          # is reading to find out what broke.
          failed_jobs=$(.github/scripts/gh_api_retry.sh \
            "/repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/jobs" \
            --jq '.jobs[] | select(.name | startswith("validate-pr")) | select(.conclusion == "failure") | .name' || echo "")

          if [[ -n "$failed_jobs" ]]; then
            echo "$failed_jobs" | while read -r job; do
              echo "  - $job"
            done

            # Write to Job Summary
            echo "### ❌ Model Validation Failed" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "The following environment validations failed:" >> $GITHUB_STEP_SUMMARY
            echo "$failed_jobs" | while read -r job; do
              echo "- $job" >> $GITHUB_STEP_SUMMARY
            done
          else
            echo "  (Could not retrieve specific failures)"
          fi

          echo ""
          echo "::error::Model validation failed for one or more environments"
          exit 1

  # ==========================================================================
  # Workflow Call Job: Single environment validation
  # ==========================================================================

  validate:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: ${{ fromJSON('{"dev":"develop","test":"staging","preprod":"preprod","prod":"production"}')[inputs.env] }}
      deployment: false
    # Higher than validate-pr's cap: the manual ldm-sql mode can run a full
    # scanSql sweep across every dataset, but still bounded so a wedged
    # environment fails fast instead of burning the 6h GitHub default.
    timeout-minutes: 30
    outputs:
      validation_result: ${{ steps.run_validation.outputs.validation_result || 'error' }}
      critical_issues_found: ${{ steps.run_validation.outputs.critical_issues_found || 'true' }}
      overrides_result: ${{ steps.run_overrides.outcome || 'skipped' }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-tags: true

      - name: Checkout Data Product at Specific Version
        if: inputs.ref != ''
        env:
          RAW_REF: ${{ inputs.ref }}
        run: |
          REF="$(echo -n "$RAW_REF" | xargs)"
          if [[ "$REF" == hotfix/* ]]; then
            if [[ ! "$REF" =~ ^hotfix/[A-Za-z0-9._/-]+$ ]] || [[ "$REF" == *..* ]]; then
              echo "❌ Invalid hotfix ref: $REF" && exit 1
            fi
            git fetch origin "refs/heads/$REF:refs/remotes/origin/$REF"
            REF="origin/$REF"
          elif [[ "$REF" =~ ^[0-9a-f]{40}$ ]]; then
            # Workflow 5 pins hotfix candidates to an immutable SHA during its
            # planning job; fetch that exact commit instead of following a
            # branch that could advance before validation starts.
            git fetch origin "$REF"
          fi
          echo "📌 Validating data product files at ref: $REF"
          # rm-then-restore: checkout alone never DELETES files added after
          # the ref — without the rm this job would validate the UNION of the
          # ref's content plus newer files, while the deploy ships ref content
          # only (mirrors workflow 5's restore step)
          git rm -rq --ignore-unmatch -- gd_data_product/
          git checkout "$REF" -- gd_data_product/
          echo "   Version commit: $(git rev-parse "$REF")"
          echo "   Actions/scripts: latest ($(git rev-parse --short HEAD))"

      - name: Setup Python Environment
        uses: ./.github/actions/setup_python
        with:
          github_token: ${{ secrets.TOKEN_GITHUB_GDCLOUD }}

      - name: Load Configuration
        uses: ./.github/actions/load_config
        id: config
        with:
          environment: ${{ inputs.env }}
          data_product_id: ${{ inputs.data_product_id }}

      - name: Set GoodData token
        env:
          TOKEN_GOODDATA: ${{ secrets.TOKEN_GOODDATA }}
        run: |
          delimiter="TOKEN_GOODDATA_$(cat /proc/sys/kernel/random/uuid)"
          {
            printf 'TOKEN_GOODDATA<<%s\n' "$delimiter"
            printf '%s\n' "$TOKEN_GOODDATA"
            printf '%s\n' "$delimiter"
          } >> "$GITHUB_ENV"

      - name: Run model validation
        id: run_validation
        continue-on-error: true
        env:
          # Through env, not interpolated into the script body: workflow_call
          # types these as free-form strings, and the `mode` validation the
          # Python entry point performs happens AFTER substitution, so it
          # cannot constrain what the shell executes. The literal flag
          # expressions below stay inline — they resolve to fixed strings.
          MODE: ${{ inputs.mode }}
          ENV_NAME: ${{ inputs.env }}
          DATA_PRODUCT_ID: ${{ inputs.data_product_id }}
          DATA_SOURCE_SKIP: ${{ inputs.data_source_skip }}
        run: |
          set -o pipefail
          if [[ "$MODE" == "ldm-sql" ]]; then
            echo "::group::Full scan output"
          fi
          SKIP_ARGS=()
          if [[ -n "$DATA_SOURCE_SKIP" ]]; then
            SKIP_ARGS=(--data-source-skip "$DATA_SOURCE_SKIP")
          fi
          gd-validate \
            "$MODE" \
            --env "$ENV_NAME" \
            --data-product-id "$DATA_PRODUCT_ID" \
            ${{ inputs.mode == 'ldm-deploy' && '--ldm-output create' || '' }} \
            ${{ inputs.mode == 'ldm-sql' && '--local --no-preview' || '' }} \
            ${{ inputs.mode == 'ldm-sql' && inputs.skip_overrides && '--no-overrides' || '' }} \
            "${SKIP_ARGS[@]}" \
            2>&1 | tee validation.log || rc=$?
          if [[ "$MODE" == "ldm-sql" ]]; then
            echo "::endgroup::"
            echo ""
            sed -n '/^=== Summary ===/,$p' validation.log | tail -n +2
          fi
          exit ${rc:-0}

      - name: Run overrides check
        id: run_overrides
        if: inputs.mode == 'ldm-deploy' && inputs.env != 'dev'
        continue-on-error: true
        run: |
          set -o pipefail
          gd-validate \
            overrides-check \
            --env ${{ inputs.env }} \
            --data-product-id ${{ inputs.data_product_id }} \
            --reuse-pdm \
            --ldm-output fetch \
            2>&1 | tee overrides.log

      - name: Show environment overrides
        if: inputs.show_overrides == true
        continue-on-error: true  # Informational step - don't fail the job
        run: |
          gd-env-overrides \
            --env ${{ inputs.env }} \
            --data-product-id ${{ inputs.data_product_id }}

      # Compact summary for ldm-sql (informational, non-blocking)
      - name: Write summary (ldm-sql)
        if: always() && inputs.mode == 'ldm-sql'
        run: |
          suffix="${{ inputs.skip_overrides && ' (base LDM, no overrides)' || '' }}"
          if [[ "${{ steps.run_validation.outcome }}" == "success" ]]; then
            echo "## ✅ SQL Validation: ${{ inputs.env }}${suffix}" >> $GITHUB_STEP_SUMMARY
          else
            echo "## ⚠️ SQL Validation: ${{ inputs.env }}${suffix} (issues found)" >> $GITHUB_STEP_SUMMARY
          fi
          echo '```' >> $GITHUB_STEP_SUMMARY
          sed -n '/^=== Summary ===/,$p' validation.log | tail -n +2 >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      # Full summary for other modes (blocking)
      - name: Write summary
        if: always() && inputs.mode != 'ldm-sql'
        uses: ./.github/actions/write_validation_summary
        with:
          mode: ${{ inputs.mode }}
          environment: ${{ inputs.env }}
          data_product_id: ${{ inputs.data_product_id }}
          validation_outcome: ${{ steps.run_validation.outcome }}
          validation_result: ${{ steps.run_validation.outputs.validation_result }}
          critical_issues: ${{ steps.run_validation.outputs.critical_issues_found }}
          overrides_outcome: ${{ steps.run_overrides.outcome }}

      - name: Check results
        if: inputs.mode != 'ldm-sql' && (steps.run_validation.outcome == 'failure' || steps.run_overrides.outcome == 'failure')
        run: |
          if [[ "${{ steps.run_validation.outcome }}" == "failure" ]]; then
            echo "::error::Model validation failed for environment: ${{ inputs.env }}"
          fi
          if [[ "${{ steps.run_overrides.outcome }}" == "failure" ]]; then
            echo "::error::Redundant overrides found for environment: ${{ inputs.env }}"
          fi
          exit 1
