# Generated by `gd-workflows adopt`; edit gd-cloud-tooling, not this package-owned workflow.
name: "gdcloud · branch_gate"

# Installed by `gd-workflows adopt` from the pinned gdcloud package and
# overwritten on every adopt — do not edit. Refuses a run dispatched from
# anything but the configured default branch, before any job holds a
# credential. It reads config.yml with the stdlib only: load_config needs the
# gdcloud package, and installing that takes the PAT this gate runs ahead of.

on:
  workflow_call:
    outputs:
      default_branch:
        description: 'The default branch configured in config.yml'
        value: ${{ jobs.gate.outputs.default_branch }}

jobs:
  gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      default_branch: ${{ steps.read.outputs.default_branch }}
    steps:
      # From the repository's default branch, not the dispatched ref — else the
      # branch under test could set default_git_branch to itself. The policy
      # still comes from config.yml; this only anchors where to read it.
      - name: Check out config.yml from the default branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: config.yml
          sparse-checkout-cone-mode: false

      - name: Read the configured default branch
        id: read
        run: |
          python3 -c '
          import os, pathlib, re
          text = ""
          path = pathlib.Path("config.yml")
          if path.is_file():
              text = path.read_text()
          match = re.search(
              r"^default_git_branch:\s*[\"\x27]?([^\"\x27\s#]+)", text, re.M
          )
          value = match.group(1) if match else "main"
          with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
              fh.write(f"default_branch={value}\n")
          print(f"configured default branch: {value}")
          '

      # ref_type is load-bearing: a workflow_dispatch run may select a TAG,
      # and a tag named like the default branch would pass a name-only gate
      # while the checkouts below resolve the tag instead.
      - name: Refuse a non-default branch
        if: >-
          ${{ github.ref_type != 'branch'
              || github.ref_name != steps.read.outputs.default_branch }}
        run: |
          echo "❌ This workflow must be run from the default branch."
          echo "   Configured default: ${{ steps.read.outputs.default_branch }}"
          echo "   Current ref:        ${{ github.ref_name }} (${{ github.ref_type }})"
          echo "   Switch to it and re-trigger the deployment."
          exit 1
