[project]
name = "globalmart"
version = "0.1.0"
description = "Rebuild the GlobalMart GoodData workspaces from source, into any org"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    # Release toolkit (FEAT-019, ADR 011). Same pin as gd-ecommerce-demo, so both demo repos
    # on the shared orgs run one release process. `auto_gdcloud_pin.yml` bumps it by PR.
    # Only `gd_plugin/` and the CI use it; the `globalmart` package never imports it.
    "gdcloud @ git+https://github.com/gooddata/gd-cloud-tooling.git@v0.51.0",
    # Pinned exactly: FEAT-001's byte-stability guarantee depends on the SDK's
    # on-disk layout format, which is not covered by semver.
    #
    # >=1.74 is a hard floor, not a preference: CatalogDeclarativeAnalyticsLayer only
    # gained `memory_items` and `parameters` in 1.74. On an older SDK a capture would
    # silently drop every AI-memory object, which STEERING § Portability Contract calls
    # a defect ("AI context travels"). tests/test_sdk_floor.py asserts this.
    "gooddata-sdk==1.75.0",
    "python-dotenv>=1.2.3",
    "pyyaml>=6.0.2",
]

[project.optional-dependencies]
# Warehouse drivers, needed only by `globalmart data load`. Capturing, splitting and
# publishing never touch a warehouse, and duckdb alone is a ~15 MB wheel — so someone who
# only publishes layouts should not have to install it.
data = [
    "duckdb>=1.1.0",
    "psycopg[binary]>=3.2.0",
]

# The A2A/MCP orchestrator (goal-02). Its transport is standard library on purpose — this
# package is meant to be liftable into a customer's runtime — so the only dependency is the
# model client the router and merge steps use. Someone who only publishes layouts does not
# need an LLM SDK.
agents = [
    "anthropic>=0.112.0",
]

[project.scripts]
globalmart = "globalmart.cli:main"
gd-agents = "gd_agents.cli:main"

# How gdcloud finds GlobalMart's own CI checks. Entry points are read from installed
# metadata, which is why `[tool.uv] package = true` below is load-bearing.
[project.entry-points."gdcloud.ci_checks"]
globalmart = "gd_plugin.checks:CHECKS"

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "types-pyyaml>=6.0.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# hatchling refuses a git-URL dependency (the gdcloud pin) without this.
[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/globalmart", "src/gd_agents", "gd_plugin"]
# The viewer page is data, not code, so it needs naming explicitly or a
# wheel install has a `serve` command with no page to serve.
artifacts = ["src/gd_agents/server/static/*.html"]

[tool.uv]
# Install this project into its own environment, so the `gdcloud.ci_checks` entry point is
# registered. Without it gdcloud silently finds no project checks (gdcloud docs/plugins.md).
package = true

[tool.ruff]
line-length = 110
src = ["src", "tests", "."]
# gdcloud-owned: `gd-workflows adopt` vendors these and check_ci_payload compares them byte for byte,
# so they keep gdcloud's own formatting, never this project's.
extend-exclude = [".github"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.14"
strict = true
files = ["src/globalmart", "src/gd_agents", "gd_plugin"]

[[tool.mypy.overrides]]
module = ["gooddata_sdk.*"]
ignore_missing_imports = true

# gdcloud ships no type information (no py.typed). Only gd_plugin/ and gdcloud_project import it.
[[tool.mypy.overrides]]
module = ["gdcloud.*"]
ignore_missing_imports = true

# Optional warehouse drivers (the `data` extra). They are imported inside functions so the
# package works without them, which means a type-check run in an environment that lacks
# them must not fail.
[[tool.mypy.overrides]]
module = ["duckdb.*", "psycopg.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
