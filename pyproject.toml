[project]
name = "globalmart"
version = "0.1.0"
description = "Rebuild the GlobalMart GoodData workspaces from source, into any org"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # Pinned exactly: FEAT-001's byte-stability guarantee depends on the SDK's
    # on-disk layout format, which is not covered by semver.
    #
    # >=1.74 is a hard floor, not a preference: CatalogDeclarativeAnalyticsLayer only
    # gained `memory_items` and `parameters` in 1.74. On an older SDK a capture would
    # silently drop every AI-memory object, which STEERING § Portability Contract calls
    # a defect ("AI context travels"). tests/test_sdk_floor.py asserts this.
    "gooddata-sdk==1.75.0",
    "pyyaml>=6.0.2",
]

[project.scripts]
globalmart = "globalmart.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "types-pyyaml>=6.0.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/globalmart"]

[tool.ruff]
line-length = 110
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/globalmart"]

[[tool.mypy.overrides]]
module = ["gooddata_sdk.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
