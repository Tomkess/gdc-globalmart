# How each environment differs from the committed base (gdcloud env overrides).
# GlobalMart's four environments read one MotherDuck schema, so there are no overrides.
env_config: {}

# The canonical data source the projection resolves placeholders to (FEAT-019, ADR 011).
# Not a gdcloud key: read by globalmart.gdcloud_bridge only.
globalmart_canonical:
  datasource_id: gdc_ds_globalmart_motherduck
  datasource_schema: globalmart
