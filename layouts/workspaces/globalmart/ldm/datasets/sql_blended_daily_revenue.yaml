grain:
- id: sql_blended_daily_revenue.order_date
  type: attribute
id: sql_blended_daily_revenue
references:
- identifier:
    id: dim_channel_master
    type: dataset
  multivalue: false
  sources:
  - column: channel_id
    dataType: STRING
    target:
      id: dim_channel_master.channel_id
      type: attribute
- identifier:
    id: dim_store
    type: dataset
  multivalue: false
  sources:
  - column: store_id
    dataType: STRING
    target:
      id: dim_store.store_id
      type: attribute
- identifier:
    id: transaction_date
    type: dataset
  multivalue: false
  sources:
  - column: order_date
    dataType: DATE
    target:
      id: transaction_date
      type: date
sql:
  dataSourceId: '{{ datasource_id }}'
  statement: "\nSELECT\n    COALESCE(oh.order_date, woh.order_date) AS order_date,\n    oh.store_id AS store_id,\n    cm.channel_type,\n\
    \    SUM(COALESCE(ol.revenue, wol.revenue)) AS total_revenue,\n    COUNT(DISTINCT COALESCE(oh.order_id, woh.order_id))\
    \ AS order_count\nFROM {{ datasource_schema }}.fact_order_header oh\nLEFT JOIN {{ datasource_schema }}.fact_order_line\
    \ ol ON oh.order_id = ol.order_id\nLEFT JOIN {{ datasource_schema }}.dim_channel_master cm ON oh.channel_id = cm.channel_id\n\
    FULL OUTER JOIN {{ datasource_schema }}.fact_web_order_header woh ON oh.order_date = woh.order_date\nLEFT JOIN {{ datasource_schema\
    \ }}.fact_web_order_line wol ON woh.order_id = wol.order_id\nWHERE COALESCE(oh.order_date, woh.order_date) IS NOT NULL\n\
    GROUP BY 1, 2, 3\n"
tags:
- Blended Daily Revenue
title: Blended Daily Revenue
workspaceDataFilterReferences: []
