grain:
- id: sql_customer_ltv_snapshot.customer_id
  type: attribute
id: sql_customer_ltv_snapshot
references:
- identifier:
    id: dim_customer
    type: dataset
  multivalue: false
  sources:
  - column: customer_id
    dataType: STRING
    target:
      id: dim_customer.customer_id
      type: attribute
sql:
  dataSourceId: '{{ datasource_id }}'
  statement: "\nSELECT\n    c.customer_id,\n    c.customer_name,\n    COUNT(DISTINCT oh.order_id) AS lifetime_order_count,\n\
    \    SUM(ol.revenue) AS lifetime_revenue,\n    AVG(ol.revenue) AS avg_order_value,\n    MAX(oh.order_date) AS last_order_date,\n\
    \    (EXTRACT(DAY FROM MAX(oh.order_date)) - EXTRACT(DAY FROM MIN(oh.order_date))) / 365.0 AS customer_age_years\nFROM\
    \ {{ datasource_schema }}.dim_customer c\nLEFT JOIN {{ datasource_schema }}.fact_order_header oh ON c.customer_id = oh.customer_id\n\
    LEFT JOIN {{ datasource_schema }}.fact_order_line ol ON oh.order_id = ol.order_id\nGROUP BY 1, 2\n"
tags:
- Customer Lifetime Value
title: Customer Lifetime Value
workspaceDataFilterReferences: []
