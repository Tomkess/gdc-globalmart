grain:
- id: sql_assortment_efficiency.product_id
  type: attribute
id: sql_assortment_efficiency
references:
- identifier:
    id: dim_product
    type: dataset
  multivalue: false
  sources:
  - column: product_id
    dataType: STRING
    target:
      id: dim_product.product_id
      type: attribute
sql:
  dataSourceId: '{{ datasource_id }}'
  statement: "\nSELECT\n    p.product_id,\n    p.category_id,\n    SUM(ol.quantity) AS units_sold,\n    SUM(inv.on_hand_units)\
    \ AS avg_inventory,\n    SUM(ol.quantity) / NULLIF(SUM(inv.on_hand_units), 0) AS sell_through_rate\nFROM {{ datasource_schema\
    \ }}.dim_product p\nLEFT JOIN {{ datasource_schema }}.fact_order_line ol ON p.product_id = ol.product_id\nLEFT JOIN {{\
    \ datasource_schema }}.fact_inventory_snapshot_daily inv ON p.product_id = inv.product_id\nGROUP BY 1, 2\n"
tags:
- Assortment Efficiency
title: Assortment Efficiency
workspaceDataFilterReferences: []
