grain:
- id: sql_ops_efficiency_summary.store_id
  type: attribute
id: sql_ops_efficiency_summary
references:
- identifier:
    id: dim_store
    type: dataset
  multivalue: false
  sources:
  - column: store_id
    dataType: STRING
    target:
      id: dim_store.store_id
      type: attribute
sql:
  dataSourceId: '{{ datasource_id }}'
  statement: "\nSELECT\n    s.store_id,\n    s.store_name,\n    SUM(ol.revenue) AS store_revenue,\n    SUM(fsd.sqft) AS store_sqft,\n\
    \    SUM(COALESCE(sh.staff_hours, 0)) AS total_staff_hours,\n    SUM(ol.revenue) / SUM(fsd.sqft) AS revenue_per_sqft,\n\
    \    SUM(ol.revenue) / NULLIF(SUM(COALESCE(sh.staff_hours, 0)), 0) AS revenue_per_staff_hour\nFROM {{ datasource_schema\
    \ }}.dim_store s\nLEFT JOIN {{ datasource_schema }}.fact_order_header oh ON s.store_id = oh.store_id\nLEFT JOIN {{ datasource_schema\
    \ }}.fact_order_line ol ON oh.order_id = ol.order_id\nLEFT JOIN (\n    SELECT store_id, SUM(sqft) AS sqft\n    FROM {{\
    \ datasource_schema }}.fact_store_visit_census GROUP BY store_id\n) fsd ON s.store_id = fsd.store_id\nLEFT JOIN {{ datasource_schema\
    \ }}.fact_store_staffing_daily sh ON s.store_id = sh.store_id\nGROUP BY 1, 2\n"
tags:
- Operations Efficiency Summary
title: Operations Efficiency Summary
workspaceDataFilterReferences: []
