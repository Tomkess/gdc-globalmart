facts:
- description: Total deductions recorded on each payroll transaction. Use this to analyze how much is being withheld or deducted,
    and to summarize deductions by employee, period, or other payroll dimensions.
  id: fact_payroll_transaction.deductions
  sourceColumn: deductions
  sourceColumnDataType: NUMERIC
  tags:
  - Payroll Transaction
  title: Deductions
- description: Gross Pay represents the total payroll amount earned before any deductions or taxes for each payroll transaction.
    Use it to analyze and aggregate employee compensation within the Payroll Transaction dataset.
  id: fact_payroll_transaction.gross_pay
  sourceColumn: gross_pay
  sourceColumnDataType: NUMERIC
  tags:
  - Payroll Transaction
  title: Gross Pay
