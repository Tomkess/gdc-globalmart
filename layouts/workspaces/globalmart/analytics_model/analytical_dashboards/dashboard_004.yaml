description: Dashboard for analyzing customer segmentation and lifetime value through loyalty activity, events, feedback,
  and NPS trends over time. It brings together key time-series views such as points earned/redeemed, reward and order value,
  event volume/value, feedback volume/sentiment, and response counts, plus a lifetime order count headline. By default it
  is filtered to the last 12 months, with optional store region and product filtering available.
id: dashboard_004
title: Customer Segmentation & Lifetime Value
