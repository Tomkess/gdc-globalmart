description: Dashboard that monitors supply chain performance and purchase order activity, combining supplier scorecard KPIs
  (quality, delivery, cost) with inventory health and stock/value trends over time. It highlights purchasing quantities by
  channel (in-store, online, and North region) and inventory units/value on hand by month, quarter, and year. By default it
  focuses on the last 12 months, with additional predefined attribute filters applied.
id: dashboard_007
title: Supply Chain & Purchase Orders
