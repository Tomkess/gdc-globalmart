description: Dashboard for analyzing returns and refunds performance through a set of headline KPIs that compare key measures
  (e.g., revenue vs net revenue, net revenue vs operating expense amount, price changes vs till variance, and loyalty/operational
  indicators like points redeemed and checkout time). It is pre-filtered to the last 12 months, with optional filtering by
  channel and currency (no default selections).
id: dashboard_022
title: Returns & Refunds Analysis
