description: Dashboard for monitoring store traffic and related operational KPIs over time, bringing together visitor counts
  along with shrinkage, maintenance cost, and downtime trends by month/quarter/year across in-store and online channels (with
  some views focused on the North region). By default it is filtered to the last 12 months, with optional filter controls
  for exchange rate to USD and fiscal period.
