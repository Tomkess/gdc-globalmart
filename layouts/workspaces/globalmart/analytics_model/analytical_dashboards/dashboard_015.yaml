description: Dashboard that brings together payroll cost (gross pay and deductions), absence hours, and training spend trends
  across channels (In-Store, Online) and the North region. It supports monitoring month/quarter/year patterns and comparing
  how payroll- and absence-related measures change over time under the dashboard’s reporting context, with defaults set to
  the last 12 months and optional geography filters (region and city).
id: dashboard_015
title: Payroll & Absence Analytics
