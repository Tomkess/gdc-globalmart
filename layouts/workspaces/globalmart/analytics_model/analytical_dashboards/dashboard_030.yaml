description: This dashboard brings together key workforce productivity indicators—headcount, active headcount, recruitment
  volume, and recruitment cost—shown as time trends (by month/quarter/year) and headline KPIs. It is intended for monitoring
  staffing and recruiting performance across regions and channels, with default filtering to the last 12 months and optional
  constraints for fiscal quarter, store region, and channel.
id: dashboard_030
title: Workforce Productivity Index
