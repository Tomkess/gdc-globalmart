description: Dashboard for monitoring staff productivity and scheduling by linking labor (staff hours and staff counts) to
  operational outcomes such as revenue per staff hour, energy cost, and shrinkage trends. It brings together time-series views
  by month/quarter/year and comparisons across channels (In-Store vs Online) and regions to help spot staffing and cost changes
  over time. By default it is scoped to the last 12 months and can be further narrowed by store region and loyalty tier selections.
id: dashboard_013
title: Staff Productivity & Scheduling
