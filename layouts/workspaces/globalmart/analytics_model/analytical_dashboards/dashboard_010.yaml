description: Dashboard that summarizes daily Profit & Loss performance by trending key finance measures over time, including
  net and gross revenue, gross margin, COGS, OpEx, EBITDA, budgets, CapEx spend/approved budget, and intercompany recharges.
  By default it focuses on the last 12 months, with additional customer-related filters applied, to support ongoing monitoring
  of profitability and cost/revenue trends.
id: dashboard_010
title: Daily Profit & Loss Summary
