description: Dashboard bringing together key HR trends over time—headcount, hours worked, payroll (gross pay and deductions),
  absence, recruitment volume and cost, and training spend—so you can monitor workforce capacity and cost drivers. It is set
  up to report on the last 12 months and supports filtering by store region and channel to focus the analysis on specific
  parts of the business.
