description: Dashboard for monitoring overall inventory health by combining key trends in units on hand and inventory value
  with purchasing, receiving, transfers, stock movements, and write-offs over time. It helps teams spot changes in stock levels
  and the operational drivers behind them (e.g., PO volume/amount, receipt and variance quantities, transfer volumes, and
  write-off costs). By default, it is scoped to the last 12 months, with additional product-related filters applied.
id: dashboard_006
title: Inventory Health & Stock Levels
