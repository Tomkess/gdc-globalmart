description: Dashboard that benchmarks compliance adherence, fraud alerts, chargebacks, and audit findings over time to support
  risk and cost-center monitoring. It combines score and alert headlines with monthly/quarterly/yearly trend charts to spot
  changes, spikes, and regional or channel differences. By default it is filtered to the last 12 months, with optional filters
  for store region and sales channel.
id: dashboard_031
title: Compliance & Cost Center Benchmarks
