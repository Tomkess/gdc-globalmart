  maql: SELECT {metric/metric_l1_fact_customer_feedback_sentiment_score} - {metric/metric_l1_fact_customer_feedback_feedback_count}
description: Measures the net difference between total customer sentiment and total feedback volume by subtracting Total Feedback
  Count from Total Sentiment Score. Use it to see whether sentiment levels are high or low relative to how much feedback was
  received within the same filters or time period.
