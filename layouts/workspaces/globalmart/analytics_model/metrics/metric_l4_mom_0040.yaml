content:
  format: '#,##0.00'
  maql: SELECT {metric/metric_l3_0013_1} - (SELECT {metric/metric_l3_0013_1} FOR PREVIOUS ({label/transaction_date.month}))
description: Measures the month-over-month change in the number of online gift card transactions, calculated as the current
  month’s transaction count minus the previous month. Use it to track whether online gift card transaction volume is rising
  or falling over time.
