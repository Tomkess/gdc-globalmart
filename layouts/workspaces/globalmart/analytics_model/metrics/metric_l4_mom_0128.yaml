  maql: SELECT {metric/metric_l3_0042_2} - (SELECT {metric/metric_l3_0042_2} FOR PREVIOUS ({label/transaction_date.month}))
description: Tracks the month-over-month change in the North Region’s Planogram Compliance Score by comparing the current
  month to the prior month. Use it to monitor whether planogram compliance performance in the North region is improving or
  declining over time, taking into account any other report filters applied. A planogram is a diagram specifying exact product
  placement on retail shelves.
