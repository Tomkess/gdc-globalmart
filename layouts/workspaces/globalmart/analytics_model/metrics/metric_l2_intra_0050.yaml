content:
  format: '#,##0.00'
  maql: SELECT {metric/metric_l1_total_inventory_value} - {metric/metric_l1_fact_stock_movement_movement_qty}
description: Calculates the difference between Total Inventory Value on hand and Total Movement Quantity to highlight where
  changes in inventory value are not aligned with the volume of stock being moved for the selected filters and scope. Use
  it to spot periods or locations with unusual gaps between value held and units transferred.
id: metric_l2_intra_0050
tags:
- L2
title: Inventory Value vs Movement Quantity (Stock Movement) Change
