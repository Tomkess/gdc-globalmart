description: Measures the month-over-month change in the In-Store Planogram Compliance Score by comparing the current month
  to the previous month. Use it to track whether in-store planogram compliance is improving or declining over time for the
  selected locations and date range. A planogram is a diagram specifying exact product placement on retail shelves.
