  maql: SELECT {metric/metric_l4_yoy_0011} + ({metric/metric_l1_fact_customer_event_event_count} / {metric/metric_l1_fact_customer_event_event_value})
description: Combines the North region year-over-year change in purchase order line item quantity with an event efficiency
