  maql: SELECT {metric/metric_l4_yoy_0003} + ({metric/metric_l1_fact_returns_quantity_returned} / {metric/metric_l1_fact_daily_store_sales_sales_amount})
description: Extends the year-over-year Net Revenue change for the In-Store channel by adding a returns-to-sales ratio (total
