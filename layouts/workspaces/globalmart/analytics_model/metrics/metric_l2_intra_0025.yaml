  maql: SELECT {metric/metric_l1_fact_loyalty_points_earned_order_amount} - {metric/metric_l1_fact_loyalty_points_redeemed_reward_value}
description: Shows the net difference between the total order amount tied to loyalty points earned and the total reward value
  tied to loyalty points redeemed. Use it to see whether loyalty-driven purchasing value is outweighing redemption value when
  comparing across time periods or customer segments.
