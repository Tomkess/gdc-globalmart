content:
  format: '#,##0.00'
  maql: SELECT {metric/metric_l1_fact_chargeback_chargeback_amount} WHERE {label/dim_channel_master.channel_type} IN ("In-Store")
description: Total monetary value of chargebacks, filtered to the In-Store sales channel only. Use this metric to track and
  compare in-store chargeback exposure across time periods or other business dimensions while excluding other channel types.
  A chargeback is a disputed payment transaction reversed by the card issuer.
id: metric_l3_0120_0
tags:
