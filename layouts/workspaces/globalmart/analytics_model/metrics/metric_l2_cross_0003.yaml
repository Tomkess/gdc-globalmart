content:
  format: '#,##0.00'
  maql: SELECT {metric/metric_l1_total_campaign_spend} / {metric/metric_l1_fact_purchase_order_line_quantity}
description: Calculates the average campaign spend per unit purchased by dividing Total Campaign Spend by the total quantity
  of purchase order line items. Use it to assess marketing spend efficiency relative to purchasing volume and compare this
  ratio across dimensions such as time, supplier, or product.
