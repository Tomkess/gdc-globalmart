  maql: SELECT {metric/metric_l1_fact_chargeback_chargeback_amount} WHERE {label/dim_channel_master.channel_type} IN ("Online")
description: Total monetary value of chargebacks limited to the Online sales channel. Use this to monitor and compare chargeback
