  maql: SELECT {metric/metric_l4_mom_0014} + ({metric/metric_l1_fact_customer_feedback_sentiment_score} / {metric/metric_l1_fact_customer_feedback_feedback_count})
description: Combines the month-over-month change in North Region energy consumption cost with the average customer sentiment
