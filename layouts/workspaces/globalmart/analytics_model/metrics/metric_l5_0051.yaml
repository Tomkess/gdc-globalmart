  maql: SELECT {metric/metric_l4_mom_0025} + ({metric/metric_l1_fact_stock_movement_movement_qty} / {metric/metric_l1_fact_purchase_order_header_po_count})
description: Combines the month-over-month change in online store sales transaction count with the average stock movement
