# Covers tests/fixtures/mini_globalmart/ completely and strictly: every dashboard, every
# visualization and the one memory item is assigned or excluded with a real reason.
#
# dashboard_mixed is listed under BOTH sales and finance. That is the whole point: its tiles
# span two domains, and the predecessor dropped exactly this dashboard without saying so.
version: 1
parent_workspace_id: globalmart
workspace_id_template: globalmart-{key_kebab}
workspace_name_template: GlobalMart — {label}
domains:
- key: customer
  label: Customers
  description: Customer segmentation and feedback. Its visualizations sit on no dashboard.
  workspace_id: globalmart-customer
  dashboards: []
  visualizations:
  - viz_customer_0096
  - viz_customer_0097
- key: finance
  label: Finance
  description: Margin and profitability. Shares the executive dashboard with sales.
  workspace_id: globalmart-finance
  dashboards:
  - dashboard_mixed
  visualizations: []
- key: sales
  label: Sales
  description: Revenue, discounts and returns across channels.
  workspace_id: globalmart-sales
  dashboards:
  - dashboard_000
  - dashboard_mixed
  visualizations: []
  ai:
    memory_item_tags:
    - area/sales
  ldm_include:
  - dim_store
shared:
  dashboards: []
  visualizations: []
unassigned:
  dashboards: []
  visualizations:
  - id: viz_orphan_0001
    reason: Duplicate created during an LLM description pass; matches no domain and sits on no dashboard.
  ai: []
